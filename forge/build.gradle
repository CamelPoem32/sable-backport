tasks.register('verifyLithiumSableCompatibility') {
    group = 'forge backport'
    description = 'Verifies the M9.1 Sable/Radium-Lithium Entity#getFeetBlockState mixin compatibility boundary.'

    dependsOn tasks.named('syncMixinRefmap')
    dependsOn tasks.named('compileJava')

    inputs.file(rootProject.file('../target_modpack/mods/radium-mc1.20.1-0.12.4+git.26c9d8e.jar'))
    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/entity/entity_sublevel_collision/EntityMixin.java'))
    inputs.files(sourceSets.main.output.classesDirs)

    doLast {
        File lithiumJar = rootProject.file('../target_modpack/mods/radium-mc1.20.1-0.12.4+git.26c9d8e.jar')
        if (!lithiumJar.isFile()) {
            throw new GradleException("Missing target Lithium/Radium jar: ${lithiumJar}")
        }
        String lithiumSha = sha256(lithiumJar)
        if (lithiumSha != 'B42584E2672D6B5329959EC2B0F342395B19389FED0EE4D86EA71072F42F77A0') {
            throw new GradleException("Unexpected Lithium/Radium SHA-256: ${lithiumSha}")
        }

        String lithiumConfigText
        String lithiumMixinText
        String lithiumModsToml
        JarFile lithiumZip = new JarFile(lithiumJar)
        try {
            def configEntry = lithiumZip.getJarEntry('lithium.mixins.json')
            def mixinEntry = lithiumZip.getJarEntry(
                    'me/jellysquid/mods/lithium/mixin/entity/collisions/unpushable_cramming/EntityMixin.class')
            def modsEntry = lithiumZip.getJarEntry('META-INF/mods.toml')
            if (configEntry == null || mixinEntry == null || modsEntry == null) {
                throw new GradleException('Target Lithium/Radium jar is missing required config, mods.toml, or EntityMixin')
            }
            lithiumConfigText = new String(lithiumZip.getInputStream(configEntry).readAllBytes(), StandardCharsets.UTF_8)
            lithiumMixinText = new String(lithiumZip.getInputStream(mixinEntry).readAllBytes(), StandardCharsets.ISO_8859_1)
            lithiumModsToml = new String(lithiumZip.getInputStream(modsEntry).readAllBytes(), StandardCharsets.UTF_8)
        } finally {
            lithiumZip.close()
        }
        if (!lithiumModsToml.contains('modId = "radium"')
                || !lithiumModsToml.contains('version = "0.12.4+git.26c9d8e"')
                || !lithiumModsToml.contains('provides=["lithium"]')) {
            throw new GradleException('Target Radium metadata no longer proves the accepted Lithium provider/version')
        }
        if (!lithiumConfigText.contains('entity.collisions.unpushable_cramming.EntityMixin')) {
            throw new GradleException('Lithium unpushable_cramming EntityMixin is not enabled by the target config')
        }
        [
                'onPositionChanged',
                'setPos(DDD)V',
                'ChunkSectionPos;getSectionCoord',
                'onBaseTick',
                'baseTick()V',
                'hasVehicle()Z',
                'onBlockCached',
                'getBlockStateAtPos()Lnet/minecraft/block/BlockState;',
                'INVOKE_ASSIGN',
                'World;getBlockState',
                'BlockCachingEntity',
                'getCachedFeetBlockState',
                'lithiumOnBlockCacheSet',
                'f_185934_'
        ].each { canary ->
            if (!lithiumMixinText.contains(canary)) {
                throw new GradleException("Lithium EntityMixin lost expected canary: ${canary}")
            }
        }

        File sableSource = rootProject.file(
                'common/src/main/java/dev/ryanhcode/sable/mixin/entity/entity_sublevel_collision/EntityMixin.java')
        String sableSourceText = sableSource.getText('UTF-8')
        if (sableSourceText.contains('@Overwrite')
                || sableSourceText.contains('public BlockState getFeetBlockState()')) {
            throw new GradleException('Sable EntityMixin still overwrites/replaces getFeetBlockState')
        }
        [
                '@ModifyExpressionValue',
                'method = "getFeetBlockState"',
                'value = "FIELD"',
                'feetBlockState:Lnet/minecraft/world/level/block/state/BlockState;',
                'opcode = Opcodes.GETFIELD',
                'value = "INVOKE"',
                'Level;getBlockState(Lnet/minecraft/core/BlockPos;)Lnet/minecraft/world/level/block/state/BlockState;',
                'sable$refreshFeetBlockStateWhileTracking',
                'sable$resolveSubLevelFeetBlockState',
                'sable$trackingSubLevel != null ? null : cachedState',
                'Sable.HELPER.getAllIntersecting',
                'sable$inBlockStatePos'
        ].each { canary ->
            if (!sableSourceText.contains(canary)) {
                throw new GradleException("Sable EntityMixin source lost compatibility canary: ${canary}")
            }
        }

        File sableMixinClass = sourceSets.main.output.classesDirs.files.collect {
            new File(it, 'dev/ryanhcode/sable/mixin/entity/entity_sublevel_collision/EntityMixin.class')
        }.find { it.isFile() }
        if (sableMixinClass == null) {
            throw new GradleException('Compiled Sable entity_sublevel_collision EntityMixin class was not found')
        }
        String sableClassText = new String(Files.readAllBytes(sableMixinClass.toPath()), StandardCharsets.ISO_8859_1)
        [
                'sable$refreshFeetBlockStateWhileTracking',
                'sable$resolveSubLevelFeetBlockState',
                'getFeetBlockState',
                'ModifyExpressionValue',
                'Level;getBlockState',
                'feetBlockState',
                'sable$trackingSubLevel',
                'sable$inBlockStatePos'
        ].each { canary ->
            if (!sableClassText.contains(canary)) {
                throw new GradleException("Compiled Sable EntityMixin lost compatibility canary: ${canary}")
            }
        }
        if (sableClassText.contains('Lorg/spongepowered/asm/mixin/Overwrite;')) {
            throw new GradleException('Compiled Sable EntityMixin still carries an @Overwrite annotation')
        }

        logger.lifecycle('verifyLithiumSableCompatibility PASS: '
                + "lithium=radium-mc1.20.1-0.12.4+git.26c9d8e.jar sha256=${lithiumSha}; "
                + 'Lithium onBlockCached INVOKE_ASSIGN canary present; '
                + 'Sable getFeetBlockState overwrite removed; expression modifiers preserve vanilla lookup shape; '
                + 'neighbor hooks setPos/baseTick present')
    }
}

tasks.register('verifySableSpawnCommandBoundary') {
    group = 'forge backport'
    description = 'Verifies the production /sable spawn block command reaches a safe handler and is not smoke-gated.'

    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/command/SableCommand.java'))
    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/command/SableSpawnCommands.java'))
    inputs.file(rootProject.file('common/src/main/resources/assets/sable/lang/en_us.json'))
    inputs.file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java')

    doLast {
        File commandSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/command/SableCommand.java')
        File spawnSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/command/SableSpawnCommands.java')
        File langSource = rootProject.file('common/src/main/resources/assets/sable/lang/en_us.json')
        File forgeSource = file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java')
        String commandText = commandSource.getText('UTF-8')
        String spawnText = spawnSource.getText('UTF-8')
        String langText = langSource.getText('UTF-8')
        String forgeText = forgeSource.getText('UTF-8')

        if (!commandText.contains('SableSpawnCommands.register(sableBuilder, buildContext)')) {
            throw new GradleException('Root /sable command no longer registers SableSpawnCommands')
        }
        if (!commandText.contains('Commands.literal("sable")')
                || !commandText.contains('commandSourceStack.hasPermission(2)')
                || !forgeText.contains('MinecraftForge.EVENT_BUS.addListener(this::registerCommand)')
                || !forgeText.contains('SableCommand.register(event.getDispatcher(), event.getBuildContext())')) {
            throw new GradleException('Forge /sable root registration lost command tree/event-bus canaries')
        }
        [
                'Commands.literal("spawn")',
                '.then(Commands.literal("block")',
                '.executes((ctx) -> spawnBlock(ctx, DEFAULT_SPAWN_BLOCKSTATE, null))',
                'BlockStateArgument.block(buildContext)',
                'SableSpawnCommands::spawnBlockFromArgument'
        ].each { canary ->
            if (!spawnText.contains(canary)) {
                throw new GradleException("/sable spawn block registration lost canary: ${canary}")
            }
        }

        int registerStart = spawnText.indexOf('public static void register(')
        int namedFinaleStart = spawnText.indexOf('@FunctionalInterface', registerStart)
        if (registerStart < 0 || namedFinaleStart < 0) {
            throw new GradleException('Unable to isolate SableSpawnCommands.register source')
        }
        String registerText = spawnText.substring(registerStart, namedFinaleStart)
        int spawnIndex = registerText.indexOf('Commands.literal("spawn")')
        int blockIndex = registerText.indexOf('.then(Commands.literal("block")')
        int platformIndex = registerText.indexOf('.then(Commands.literal("platform")')
        if (!(spawnIndex >= 0 && blockIndex > spawnIndex && platformIndex > blockIndex)) {
            throw new GradleException('Unexpected /sable spawn block registration order/tree shape')
        }
        String blockTreeText = registerText.substring(blockIndex, platformIndex)
        [
                '.then(Commands.literal("block")',
                '.executes((ctx) -> spawnBlock(ctx, DEFAULT_SPAWN_BLOCKSTATE, null))',
                '.then(namedSpawnFinale(Commands.argument("block", BlockStateArgument.block(buildContext)),',
                'SableSpawnCommands::spawnBlockFromArgument'
        ].each { canary ->
            if (!blockTreeText.contains(canary)) {
                throw new GradleException("/sable spawn block tree lost terminal callback canary: ${canary}")
            }
        }

        int finaleStart = spawnText.indexOf('private static <T extends ArgumentBuilder')
        int spawnBlockStart = spawnText.indexOf('private static int spawnBlock(', finaleStart)
        if (finaleStart < 0 || spawnBlockStart < 0) {
            throw new GradleException('Unable to isolate namedSpawnFinale source')
        }
        String finaleText = spawnText.substring(finaleStart, spawnBlockStart)
        [
                'builder.executes((ctx) -> invoker.run(ctx, null))',
                'builder.then(Commands.argument("name", StringArgumentType.string())',
                '.executes((ctx) -> invoker.run(ctx, StringArgumentType.getString(ctx, "name"))))'
        ].each { canary ->
            if (!finaleText.contains(canary)) {
                throw new GradleException("namedSpawnFinale no longer makes the block/name terminal executable: ${canary}")
            }
        }

        int methodStart = spawnText.indexOf('private static int spawnBlock(')
        int methodEnd = spawnText.indexOf('private static void finishInitialSpawnBlock(', methodStart)
        if (methodStart < 0 || methodEnd < 0) {
            throw new GradleException('Unable to isolate spawnBlock handler source')
        }
        String handlerText = spawnText.substring(methodStart, methodEnd)
        [
                'private static int spawnBlockFromArgument',
                'material=<block-argument>',
                'BlockStateArgument.getBlock(ctx, "block").getState()',
                'private static int spawnBlockResolved',
                'SABLE_SPAWN phase=argument_resolved',
                'SABLE_SPAWN phase=source_resolved',
                'SABLE_SPAWN phase=container_resolved',
                'SABLE_SPAWN phase=create_begin',
                'SABLE_SPAWN phase=create_returned',
                'SABLE_SPAWN phase=chunk_created',
                'SABLE_SPAWN phase=block_set',
                'SABLE_SPAWN phase=registered',
                'SableCommandHelper.requireSubLevelContainer(ctx)',
                'plotContainer.allocateNewSubLevel(pose)',
                'subLevel.setName(name)',
                'final PlotChunkHolder chunkHolder = plot.getChunkHolder(plot.toLocal(new ChunkPos(globalBlockPos)))',
                'final LevelChunk chunk = chunkHolder.getChunk()',
                'final BlockState oldState = chunk.getBlockState(globalBlockPos)',
                'final BlockState previousState = chunk.setBlockState(globalBlockPos, material, false)',
                'final BlockState storedState = chunk.getBlockState(globalBlockPos)',
                'Initial spawn block write did not persist',
                'finishInitialSpawnBlock(subLevel, BlockPos.ZERO, oldState, material)',
                'subLevel.updateLastPose()',
                'SABLE_SPAWN phase=entered',
                'SABLE_SPAWN phase=complete',
                'SABLE_SPAWN phase=failed',
                'SABLE_SPAWN phase=exit',
                'SABLE_SPAWN phase=rollback_begin',
                'SABLE_SPAWN phase=rollback_complete',
                'SABLE_SPAWN phase=rollback_failed',
                'source.sendSuccess(() -> Component.translatable("commands.sable.spawn.success", "block"), false)',
                'return 1;',
                'private static void rollbackSpawnSubLevel',
                'plotContainer.removeSubLevel(subLevel, SubLevelRemovalReason.REMOVED)',
                'failure.addSuppressed(cleanupFailure)',
                'catch (final CommandSyntaxException exception)',
                'catch (final RuntimeException exception)',
                'catch (final Error error)',
                'throw ERROR_SPAWN_BLOCK_FAILED.create(message)'
        ].each { canary ->
            if (!handlerText.contains(canary)) {
                throw new GradleException("spawnBlock handler lost production canary: ${canary}")
            }
        }
        if (handlerText.contains('accessor.getBlockState(BlockPos.ZERO)')
                || handlerText.contains('accessor.setBlock(BlockPos.ZERO, material')) {
            throw new GradleException('/sable spawn block regressed to embedded parent-world lookup for initial block storage')
        }
        if (!handlerText.contains('throws CommandSyntaxException')) {
            throw new GradleException('spawnBlock handlers no longer declare CommandSyntaxException')
        }
        String finishText = spawnText.substring(methodEnd)
        [
                'SABLE_SPAWN phase=mass_check',
                'chunkHolder.handleBlockChange',
                'plot.updateBoundingBox()',
                'plot.expandIfNecessary(globalBlockPos)',
                'serverSubLevel.buildMassTracker()',
                'serverSubLevel.updateMergedMassData(1.0f)',
                'final var mergedMass = serverSubLevel.getMassTracker()',
                'final var selfMass = serverSubLevel.getSelfMassTracker()',
                'SubLevelPhysicsSystem.get(serverSubLevel.getLevel()) != null',
                'Initial spawn block produced invalid mass data: mass=%s'
        ].each { canary ->
            if (!finishText.contains(canary)) {
                throw new GradleException("finishInitialSpawnBlock lost mass-initialization canary: ${canary}")
            }
        }
        if (handlerText.contains('sable.runtimeSmoke') || handlerText.contains('sable.standaloneRuntimeSmoke')
                || handlerText.contains('Boolean.getBoolean')) {
            throw new GradleException('/sable spawn block production path is incorrectly smoke-property gated')
        }
        if (!spawnText.contains('DynamicCommandExceptionType ERROR_SPAWN_BLOCK_FAILED')) {
            throw new GradleException('spawnBlock no longer exposes a Brigadier command failure boundary')
        }
        if (!langText.contains('"commands.sable.spawn.block.failure"')) {
            throw new GradleException('Missing user-visible spawnBlock failure translation')
        }

        def brigadierResult = SableSpawnCommandTreeVerifier.verify()
        if (brigadierResult.consumed() != brigadierResult.total() || brigadierResult.result() != 1) {
            throw new GradleException("Unexpected /sable spawn block Brigadier verifier result: ${brigadierResult}")
        }
        brigadierResult.tree().each { line ->
            logger.lifecycle("verifySableSpawnCommandBoundary tree:${line}")
        }

        logger.lifecycle('verifySableSpawnCommandBoundary PASS: /sable spawn block is production registered, '
                + "parseConsumed=${brigadierResult.consumed()}/${brigadierResult.total()}, "
                + 'terminal block/name node invokes spawnBlock, returns 1 on success, logs entered/complete/failed, '
                + 'converts runtime spawn failures to CommandSyntaxException, writes the initial block through the plot chunk, '
                + 'checks persisted state/mass before success, uses allocateNewSubLevel, '
                + 'and is not sable.runtimeSmoke gated')
    }
}

