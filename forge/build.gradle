def prepareStandaloneSableUserdevArtifact = tasks.register('prepareStandaloneSableUserdevArtifact') {
    group = 'forge backport'
    description = 'Derives a forgeclientuserdev-mapped standalone Sable artifact from the final reobfuscated all-jar.'
    dependsOn tasks.named('createSrgToMcp')
    dependsOn tasks.named('packageRapierIntoFinalForgeArtifact')

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    inputs.files(configurations.compileClasspath)
    outputs.file(standaloneMappedSableRuntime)

    doLast {
        File inputJar = standaloneProductionSableArtifact.get().asFile
        if (!inputJar.isFile()) {
            throw new GradleException(
                    "Standalone Sable userdev mapping requires final artifact ${inputJar}; run :forge:build first"
            )
        }
        File mappingsFile = layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile
        if (!mappingsFile.isFile()) {
            throw new GradleException(
                    "Standalone Sable userdev mapping requires ${mappingsFile}; run :forge:createSrgToMcp first"
            )
        }
        File outputJar = standaloneMappedSableRuntime.get().asFile
        def standaloneHierarchyClasspath = configurations.compileClasspath.files.findAll {
            it.isFile() && it.name.endsWith('.jar')
        }
        def result = SableStandaloneUserdevMapper.map(
                inputJar,
                mappingsFile,
                outputJar,
                standaloneHierarchyClasspath)
        File nestedProductionRapier = standaloneRapierProductionNestedJar.get().asFile
        File nestedUserdevRapier = standaloneRapierUserdevNestedJar.get().asFile
        nestedProductionRapier.parentFile.mkdirs()
        JarFile mappedOuterJar = new JarFile(outputJar)
        try {
            def nestedRapierEntry = mappedOuterJar.getJarEntry(rapierBackportJarJarPath)
            if (nestedRapierEntry == null) {
                throw new GradleException(
                        "Standalone userdev Sable artifact lacks nested Rapier JarJar ${rapierBackportJarJarPath}; "
                                + 'run :forge:verifyRapierPackagedArtifact first'
                )
            }
            Files.write(nestedProductionRapier.toPath(), mappedOuterJar.getInputStream(nestedRapierEntry).readAllBytes())
        } finally {
            mappedOuterJar.close()
        }
        def nestedRapierResult = SableStandaloneUserdevMapper.map(
                nestedProductionRapier,
                mappingsFile,
                nestedUserdevRapier,
                standaloneHierarchyClasspath)
        File tempOutputJar = new File(outputJar.parentFile, outputJar.name + '.rapier-userdev.tmp')
        ZipInputStream input = new ZipInputStream(new BufferedInputStream(new FileInputStream(outputJar)))
        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempOutputJar)))
        try {
            def entry
            while ((entry = input.nextEntry) != null) {
                ZipEntry outputEntry = new ZipEntry(entry.name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                if (entry.name == rapierBackportJarJarPath) {
                    output.write(Files.readAllBytes(nestedUserdevRapier.toPath()))
                } else {
                    output.write(input.readAllBytes())
                }
                output.closeEntry()
            }
        } finally {
            input.close()
            output.close()
        }
        Files.move(tempOutputJar.toPath(), outputJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Prepared standalone userdev Sable artifact ${outputJar.name} from "
                + "${inputJar.absolutePath} sha256=${result.inputSha256}; transformedClasses="
                + "${result.transformedClasses}, declarationRemaps=${result.declarationRemaps}, "
                + "referenceRemaps=${result.referenceRemaps}, selfReferenceRemaps="
                + "${result.selfReferenceRemaps}, annotationRemaps=${result.annotationRemaps}, "
                + "hierarchyDeclarationRemaps=${result.hierarchyDeclarationRemaps}, "
                + "hierarchyReferenceRemaps=${result.hierarchyReferenceRemaps}, "
                + "bridgeHierarchyDeclarationRemaps=${result.bridgeHierarchyDeclarationRemaps}, "
                + "bridgeHierarchyReferenceRemaps=${result.bridgeHierarchyReferenceRemaps}, "
                + "handleReferenceRemaps=${result.handleReferenceRemaps}, "
                + "constantDynamicHandleReferenceRemaps=${result.constantDynamicHandleReferenceRemaps}, "
                + "unresolvedHierarchyDeclarations=${result.unresolvedHierarchyDeclarations}, "
                + "unresolvedHierarchyReferences=${result.unresolvedHierarchyReferences}")
        logger.lifecycle("Prepared standalone userdev nested Rapier ${rapierBackportJarJarPath}; "
                + "inputSha256=${nestedRapierResult.inputSha256}, transformedClasses="
                + "${nestedRapierResult.transformedClasses}, referenceRemaps="
                + "${nestedRapierResult.referenceRemaps}, handleReferenceRemaps="
                + "${nestedRapierResult.handleReferenceRemaps}, constantDynamicHandleReferenceRemaps="
                + "${nestedRapierResult.constantDynamicHandleReferenceRemaps}, "
                + "unresolvedHierarchyDeclarations=${nestedRapierResult.unresolvedHierarchyDeclarations}, "
                + "unresolvedHierarchyReferences=${nestedRapierResult.unresolvedHierarchyReferences}")
    }
}

tasks.register('prepareStandaloneRuntimeLauncherRoots') {
    group = 'forge backport'
    description = 'Creates the intentionally empty standalone launcher source-set roots required by Forge userdev MOD_CLASSES.'
    dependsOn tasks.named('standaloneRuntimeLauncherClasses')

    outputs.dir(sourceSets.standaloneRuntimeLauncher.output.resourcesDir)
    outputs.dirs(sourceSets.standaloneRuntimeLauncher.output.classesDirs)

    doLast {
        File resourcesDir = sourceSets.standaloneRuntimeLauncher.output.resourcesDir
        resourcesDir.mkdirs()
        sourceSets.standaloneRuntimeLauncher.output.classesDirs.files.each { dir ->
            dir.mkdirs()
        }
        logger.lifecycle("Prepared empty standalone launcher MOD_CLASSES roots: "
                + ([resourcesDir] + sourceSets.standaloneRuntimeLauncher.output.classesDirs.files).collect {
