tasks.register('verifyForgePackaging') {
    group = 'verification'
    description = 'Statically verifies the Forge package and the separate Companion library package.'
    dependsOn tasks.named('jar')
    dependsOn project(':sable_companion_1_20').tasks.named('jar')

    doLast {
        File forgeArchive = tasks.named('jar').get().archiveFile.get().asFile
        File companionArchive = project(':sable_companion_1_20').tasks.named('jar').get().archiveFile.get().asFile
        JarFile forgeJar = new JarFile(forgeArchive)
        try {
            def requiredEntries = [
                    'dev/ryanhcode/sable/forge/SableForge.class',
                    'META-INF/mods.toml',
                    'META-INF/accesstransformer-forge.cfg',
                    'sable-common-forge.mixins.json',
                    'sable-forge.mixins.json',
                    'sable.refmap.json'
            ]
            requiredEntries.each { entry ->
                if (forgeJar.getJarEntry(entry) == null) {
                    throw new GradleException("Forge jar is missing ${entry}")
                }
            }

            forgeServiceProviders.each { service, provider ->
                String servicePath = "META-INF/services/${service}"
                def entry = forgeJar.getJarEntry(servicePath)
                if (entry == null) {
                    throw new GradleException("Forge jar is missing ${servicePath}")
                }
                String content = forgeJar.getInputStream(entry).getText('UTF-8').trim()
                if (content != provider) {
                    throw new GradleException("Unexpected provider in ${servicePath}: ${content}")
                }
                String providerClass = provider.replace('.', '/') + '.class'
                if (forgeJar.getJarEntry(providerClass) == null) {
                    throw new GradleException("Forge jar is missing provider class ${providerClass}")
                }
            }

            if (forgeJar.manifest.mainAttributes.getValue('FMLAT') != 'accesstransformer-forge.cfg') {
                throw new GradleException('Forge jar manifest has no curated FMLAT')
            }
            if (!file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java').getText('UTF-8').contains('@Mod(Sable.MOD_ID)')) {
                throw new GradleException('Forge bootstrap source is missing @Mod(Sable.MOD_ID)')
            }

            def deferredPrefixes = [
                    'dev/ryanhcode/sable/debug/',
                    'dev/ryanhcode/sable/render/dynamic_shade/',
                    'dev/ryanhcode/sable/render/region/',
                    'dev/ryanhcode/sable/sublevel/render/fancy/',
                    'dev/ryanhcode/sable/mixin/entity/entity_leashing/',
                    'dev/ryanhcode/sable/mixin/entity/entity_pathfinding/',
                    'dev/ryanhcode/sable/mixin/camera/camera_zoom/MouseHandlerMixin.class',
                    'dev/ryanhcode/sable/mixinhelpers/camera/new_camera_types/',
                    'dev/ryanhcode/sable/mixinterface/camera/camera_zoom/CameraZoomExtension.class',
                    'dev/ryanhcode/sable/mixin/sublevel_render/block_entity_render/',
                    'dev/ryanhcode/sable/mixin/loaded_chunk_debug/'
            ]
            def deferredEntries = forgeJar.entries().toList().findAll { entry ->
                deferredPrefixes.any { prefix -> entry.name.startsWith(prefix) }
            }
            if (!deferredEntries.isEmpty()) {
                throw new GradleException("Deferred classes leaked into Forge jar: ${deferredEntries*.name}")
            }
            if (forgeJar.entries().toList().any { it.name.startsWith('dev/ryanhcode/sable/companion/') }) {
                throw new GradleException('Companion classes were unexpectedly bundled before the JarJar milestone')
            }
        } finally {
            forgeJar.close()
        }

        JarFile companionJar = new JarFile(companionArchive)
        try {
            [
                    'dev/ryanhcode/sable/companion/SableCompanion.class',
                    'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion',
                    'META-INF/LICENSE_sable_companion'
            ].each { entry ->
                if (companionJar.getJarEntry(entry) == null) {
                    throw new GradleException("Companion library jar is missing ${entry}")
                }
            }
            if (companionJar.getJarEntry('META-INF/mods.toml') != null) {
                throw new GradleException('Companion common library unexpectedly contains Forge mod metadata')
            }
        } finally {
            companionJar.close()
        }

        logger.lifecycle("Verified Forge package ${forgeArchive.name} and Companion library ${companionArchive.name}")
    }
}

