def prepareStandaloneSableUserdevArtifact = tasks.register('prepareStandaloneSableUserdevArtifact') {
    group = 'forge backport'
    description = 'Derives a forgeclientuserdev-mapped standalone Sable artifact from the final reobfuscated all-jar.'
    dependsOn tasks.named('createSrgToMcp')
    dependsOn tasks.named('packageRapierIntoFinalForgeArtifact')

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    inputs.files(configurations.compileClasspath)
    outputs.file(standaloneMappedSableRuntime)

    doLast {
        File inputJar = standaloneProductionSableArtifact.get().asFile
        if (!inputJar.isFile()) {
            throw new GradleException(
                    "Standalone Sable userdev mapping requires final artifact ${inputJar}; run :forge:build first"
            )
        }
        File mappingsFile = layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile
        if (!mappingsFile.isFile()) {
            throw new GradleException(
                    "Standalone Sable userdev mapping requires ${mappingsFile}; run :forge:createSrgToMcp first"
            )
        }
        File outputJar = standaloneMappedSableRuntime.get().asFile
        def standaloneHierarchyClasspath = configurations.compileClasspath.files.findAll {
            it.isFile() && it.name.endsWith('.jar')
        }
        def result = SableStandaloneUserdevMapper.map(
                inputJar,
                mappingsFile,
                outputJar,
                standaloneHierarchyClasspath)
        File nestedProductionRapier = standaloneRapierProductionNestedJar.get().asFile
        File nestedUserdevRapier = standaloneRapierUserdevNestedJar.get().asFile
        File nestedProductionCompanion = standaloneCompanionProductionNestedJar.get().asFile
        File nestedUserdevCompanion = standaloneCompanionUserdevNestedJar.get().asFile
        nestedProductionRapier.parentFile.mkdirs()
        nestedProductionCompanion.parentFile.mkdirs()
        JarFile mappedOuterJar = new JarFile(outputJar)
        try {
            def nestedRapierEntry = mappedOuterJar.getJarEntry(rapierBackportJarJarPath)
            if (nestedRapierEntry == null) {
                throw new GradleException(
                        "Standalone userdev Sable artifact lacks nested Rapier JarJar ${rapierBackportJarJarPath}; "
                                + 'run :forge:verifyRapierPackagedArtifact first'
                )
            }
            def nestedCompanionEntry = mappedOuterJar.getJarEntry(companionBackportJarJarPath)
            if (nestedCompanionEntry == null) {
                throw new GradleException(
                        "Standalone userdev Sable artifact lacks nested Companion JarJar ${companionBackportJarJarPath}"
                )
            }
            Files.write(nestedProductionRapier.toPath(), mappedOuterJar.getInputStream(nestedRapierEntry).readAllBytes())
            Files.write(nestedProductionCompanion.toPath(),
                    mappedOuterJar.getInputStream(nestedCompanionEntry).readAllBytes())
        } finally {
            mappedOuterJar.close()
        }
        def nestedRapierResult = SableStandaloneUserdevMapper.map(
                nestedProductionRapier,
                mappingsFile,
                nestedUserdevRapier,
                standaloneHierarchyClasspath)
        def nestedCompanionResult = SableStandaloneUserdevMapper.map(
                nestedProductionCompanion,
                mappingsFile,
                nestedUserdevCompanion,
                standaloneHierarchyClasspath)
        File tempOutputJar = new File(outputJar.parentFile, outputJar.name + '.nested-userdev.tmp')
        ZipInputStream input = new ZipInputStream(new BufferedInputStream(new FileInputStream(outputJar)))
        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempOutputJar)))
        try {
            def entry
            while ((entry = input.nextEntry) != null) {
                ZipEntry outputEntry = new ZipEntry(entry.name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                if (entry.name == rapierBackportJarJarPath) {
                    output.write(Files.readAllBytes(nestedUserdevRapier.toPath()))
                } else if (entry.name == companionBackportJarJarPath) {
                    output.write(Files.readAllBytes(nestedUserdevCompanion.toPath()))
                } else {
                    output.write(input.readAllBytes())
                }
                output.closeEntry()
            }
        } finally {
            input.close()
            output.close()
        }
        Files.move(tempOutputJar.toPath(), outputJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("Prepared standalone userdev Sable artifact ${outputJar.name} from "
                + "${inputJar.absolutePath} sha256=${result.inputSha256}; transformedClasses="
                + "${result.transformedClasses}, declarationRemaps=${result.declarationRemaps}, "
                + "referenceRemaps=${result.referenceRemaps}, selfReferenceRemaps="
                + "${result.selfReferenceRemaps}, annotationRemaps=${result.annotationRemaps}, "
                + "hierarchyDeclarationRemaps=${result.hierarchyDeclarationRemaps}, "
                + "hierarchyReferenceRemaps=${result.hierarchyReferenceRemaps}, "
                + "bridgeHierarchyDeclarationRemaps=${result.bridgeHierarchyDeclarationRemaps}, "
                + "bridgeHierarchyReferenceRemaps=${result.bridgeHierarchyReferenceRemaps}, "
                + "handleReferenceRemaps=${result.handleReferenceRemaps}, "
                + "constantDynamicHandleReferenceRemaps=${result.constantDynamicHandleReferenceRemaps}, "
                + "unresolvedHierarchyDeclarations=${result.unresolvedHierarchyDeclarations}, "
                + "unresolvedHierarchyReferences=${result.unresolvedHierarchyReferences}")
        logger.lifecycle("Prepared standalone userdev nested Rapier ${rapierBackportJarJarPath}; "
                + "inputSha256=${nestedRapierResult.inputSha256}, transformedClasses="
                + "${nestedRapierResult.transformedClasses}, referenceRemaps="
                + "${nestedRapierResult.referenceRemaps}, handleReferenceRemaps="
                + "${nestedRapierResult.handleReferenceRemaps}, constantDynamicHandleReferenceRemaps="
                + "${nestedRapierResult.constantDynamicHandleReferenceRemaps}, "
                + "unresolvedHierarchyDeclarations=${nestedRapierResult.unresolvedHierarchyDeclarations}, "
                + "unresolvedHierarchyReferences=${nestedRapierResult.unresolvedHierarchyReferences}")
        logger.lifecycle("Prepared standalone userdev nested Companion ${companionBackportJarJarPath}; "
                + "inputSha256=${nestedCompanionResult.inputSha256}, transformedClasses="
                + "${nestedCompanionResult.transformedClasses}, referenceRemaps="
                + "${nestedCompanionResult.referenceRemaps}, handleReferenceRemaps="
                + "${nestedCompanionResult.handleReferenceRemaps}, constantDynamicHandleReferenceRemaps="
                + "${nestedCompanionResult.constantDynamicHandleReferenceRemaps}, "
                + "unresolvedHierarchyDeclarations=${nestedCompanionResult.unresolvedHierarchyDeclarations}, "
                + "unresolvedHierarchyReferences=${nestedCompanionResult.unresolvedHierarchyReferences}")
    }
}

tasks.register('prepareStandaloneRuntimeLauncherRoots') {
    group = 'forge backport'
    description = 'Creates the intentionally empty standalone launcher source-set roots required by Forge userdev MOD_CLASSES.'
    dependsOn tasks.named('standaloneRuntimeLauncherClasses')

    outputs.dir(sourceSets.standaloneRuntimeLauncher.output.resourcesDir)
    outputs.dirs(sourceSets.standaloneRuntimeLauncher.output.classesDirs)

    doLast {
        File resourcesDir = sourceSets.standaloneRuntimeLauncher.output.resourcesDir
        resourcesDir.mkdirs()
        sourceSets.standaloneRuntimeLauncher.output.classesDirs.files.each { dir ->
            dir.mkdirs()
        }
        logger.lifecycle("Prepared empty standalone launcher MOD_CLASSES roots: "
                + ([resourcesDir] + sourceSets.standaloneRuntimeLauncher.output.classesDirs.files).collect {
                    it.absolutePath
                })
    }
}

tasks.register('prepareStandaloneRuntimeSmoke') {
    group = 'forge backport'
    description = 'Stages the standalone short-smoke mods directory with the final Sable artifact and external runtime dependencies.'
    dependsOn prepareStandaloneSableUserdevArtifact
    dependsOn tasks.named('prepareTargetModpackDependencies')
    dependsOn tasks.named('prepareCreateDevelopmentRuntime')
    dependsOn tasks.named('preparePonderDevelopmentRuntime')
    dependsOn tasks.named('prepareStandaloneSableUserdevArtifact')
    dependsOn tasks.named('prepareVeilDevelopmentRuntime')
    dependsOn tasks.named('prepareStandaloneRuntimeLauncherRoots')
    dependsOn prepareCreateDevelopmentRuntime
    dependsOn prepareTargetModpackDependencies

    inputs.file(standaloneMappedSableRuntime)
    inputs.file(createDevelopmentRuntime)
    inputs.file(ponderDevelopmentRuntime)
    inputs.file(veilDevelopmentRuntime)
    inputs.files(fileTree(targetModpackRepository) { include '*.jar' })
    outputs.dir(standaloneRuntimeDir)

    doLast {
        File runDir = standaloneRuntimeDir.asFile
        File modsDir = standaloneRuntimeModsDir.asFile
        File savesDir = standaloneRuntimeSavesDir.asFile
        modsDir.mkdirs()
        savesDir.mkdirs()

        def mappedRuntimeArtifact = { String artifactName, String expectedVersion ->
            String expectedMappedVersion = "${expectedVersion}_mapped_official_${forge_minecraft_version}"
            def artifact = configurations.targetRuntimeMapped.resolvedConfiguration.resolvedArtifacts.find {
                it.moduleVersion.id.group == 'local.target'
                        && it.name == artifactName
                        && it.moduleVersion.id.version == expectedMappedVersion
            }
            if (artifact == null) {
                throw new GradleException(
                        "Standalone runtime could not resolve mapped ${artifactName}:${expectedMappedVersion}"
                )
            }
            artifact.file
        }
        File mappedFlywheel = mappedRuntimeArtifact(
                "flywheel-forge-${forge_minecraft_version}".toString(),
                forge_flywheel_version.toString())
        File mappedPonder = ponderDevelopmentRuntime.get().asFile

        def managedNames = [
                standaloneMappedSableRuntime.get().asFile.name,
                createDevelopmentRuntime.get().asFile.name,
                mappedFlywheel.name,
                mappedPonder.name,
                veilDevelopmentRuntime.get().asFile.name
        ] as Set
        modsDir.listFiles()?.findAll { file ->
            managedNames.contains(file.name)
                    || file.name.startsWith("${mod_id}-forge-")
                    || file.name.startsWith("flywheel-forge-${forge_minecraft_version}-")
                    || file.name.startsWith("Ponder-Forge-${forge_minecraft_version}-")
        }?.each { file ->
            Files.deleteIfExists(file.toPath())
        }

        def copyMod = { File source ->
            if (!source.isFile()) {
                throw new GradleException("Standalone runtime dependency is missing: ${source}")
            }
            Files.copy(
                    source.toPath(),
                    new File(modsDir, source.name).toPath(),
                    StandardCopyOption.REPLACE_EXISTING
            )
        }

        copyMod(standaloneMappedSableRuntime.get().asFile)
        copyMod(createDevelopmentRuntime.get().asFile)
        copyMod(mappedFlywheel)
        copyMod(mappedPonder)
        copyMod(veilDevelopmentRuntime.get().asFile)

        File sourceWorld = file('run/m6-client/saves/M6_Smoke_Empty')
        if (!sourceWorld.isDirectory()) {
            throw new GradleException("Proven runtime-smoke world is missing: ${sourceWorld}")
        }
        File targetWorld = new File(savesDir, 'M6_Smoke_Empty')
        String savesRoot = savesDir.canonicalPath + File.separator
        if (!targetWorld.canonicalPath.startsWith(savesRoot)) {
            throw new GradleException("Refusing to replace unexpected smoke-world path: ${targetWorld}")
        }
        delete targetWorld
        copy {
            from sourceWorld
            into targetWorld
        }

        logger.lifecycle("Prepared standalone smoke runtime in ${runDir} with managed mods: ${managedNames}")
    }
}

def standaloneRuntimeClasspathLeak = { File file ->
    String path = file.absolutePath.replace('\\', '/').toLowerCase(Locale.ROOT)
    String name = file.name.toLowerCase(Locale.ROOT)
    path.contains('/deobf_dependencies/local/target/')
            || path.contains('/deobf_dependencies/foundry/veil/')
            || name.contains("create-${forge_minecraft_version}-${forge_create_version}".toLowerCase(Locale.ROOT))
            || name.contains("flywheel-forge-${forge_minecraft_version}-${forge_flywheel_version}".toLowerCase(Locale.ROOT))
            || name.contains("ponder-forge-${forge_minecraft_version}-${forge_ponder_version}".toLowerCase(Locale.ROOT))
            || name.contains("registrate-${forge_registrate_version}".toLowerCase(Locale.ROOT))
            || name.contains("veil-forge-${forge_minecraft_version}-${forge_veil_version}".toLowerCase(Locale.ROOT))
}

tasks.register('verifyStandaloneRunConfiguration') {
    group = 'verification'
    description = 'Verifies the standalone smoke run uses the final mods directory instead of Sable development output.'
    dependsOn tasks.named('prepareStandaloneRuntimeLauncherRoots')
    dependsOn tasks.named('prepareStandaloneRuntimeSmoke')
    dependsOn tasks.named('verifyStandaloneAccessTransformerNamespaces')

    doLast {
        def runConfig = minecraft.runs.standaloneClient
        if (runConfig.main != 'cpw.mods.bootstraplauncher.BootstrapLauncher') {
            throw new GradleException(
                    "Standalone run main=${runConfig.main}, expected cpw.mods.bootstraplauncher.BootstrapLauncher"
            )
        }
        int launchTarget = runConfig.args.indexOf('--launchTarget')
        if (launchTarget < 0 || runConfig.args.size() <= launchTarget + 1
                || runConfig.args[launchTarget + 1] != 'forgeclientuserdev') {
            throw new GradleException("Standalone run args do not select forgeclientuserdev: ${runConfig.args}")
        }
        def sourceNames = runConfig.sources*.name
        if (sourceNames != ['standaloneRuntimeLauncher']) {
            throw new GradleException(
                    "Standalone run sources=${sourceNames}, expected only standaloneRuntimeLauncher"
            )
        }
        def launcherSourceClasspathSurfaces = [
                'standaloneRuntimeLauncher.compileClasspath': sourceSets.standaloneRuntimeLauncher.compileClasspath.files,
                'standaloneRuntimeLauncher.runtimeClasspath' : sourceSets.standaloneRuntimeLauncher.runtimeClasspath.files
        ]
        launcherSourceClasspathSurfaces.each { surface, files ->
            def leakedEntries = files.findAll(standaloneRuntimeClasspathLeak)
            if (!leakedEntries.isEmpty()) {
                throw new GradleException(
                        "Standalone ForgeGradle source-set surface ${surface} leaks target mods: "
                                + leakedEntries*.absolutePath
                )
            }
        }
        if (!runConfig.mods.isEmpty()) {
            throw new GradleException("Standalone run unexpectedly declares development mods: ${runConfig.mods*.name}")
        }
        def launcherRoots = [sourceSets.standaloneRuntimeLauncher.output.resourcesDir]
        launcherRoots.addAll(sourceSets.standaloneRuntimeLauncher.output.classesDirs.files)
        def missingRoots = launcherRoots.findAll { !it.isDirectory() }
        if (!missingRoots.isEmpty()) {
            throw new GradleException(
                    "Standalone launcher MOD_CLASSES roots do not exist: ${missingRoots*.absolutePath}"
            )
        }
        def leakedFiles = launcherRoots.collectMany { root ->
            fileTree(root).files
        }
        if (!leakedFiles.isEmpty()) {
            throw new GradleException(
                    "Standalone launcher source set must stay empty, found: ${leakedFiles*.absolutePath}"
            )
        }
        def standaloneClasspath = tasks.named('runStandaloneClient').get().classpath.files
        def externalCompanionEntries = standaloneClasspath.findAll { file ->
            String path = file.absolutePath.replace('\\', '/')
            path.contains('/sable_companion_1_20/')
                    || file.name.startsWith('sable-companion-common-')
        }
        if (!externalCompanionEntries.isEmpty()) {
            throw new GradleException(
                    "Standalone runtime must not expose Companion outside the packaged Sable JarJar: "
                            + externalCompanionEntries*.absolutePath
            )
        }
        def externalTargetEntries = standaloneClasspath.findAll(standaloneRuntimeClasspathLeak)
        if (!externalTargetEntries.isEmpty()) {
            throw new GradleException(
                    'Standalone runtime must load target mods from run/standalone-client/mods, '
                            + "not the launcher/module classpath: ${externalTargetEntries*.absolutePath}"
            )
        }
        def developmentSableEntries = standaloneClasspath.findAll { file ->
            String path = file.absolutePath.replace('\\', '/').toLowerCase(Locale.ROOT)
            path.endsWith('/forge/build/classes/java/main')
                    || path.endsWith('/forge/build/resources/main')
                    || path.contains('/common/build/classes/')
                    || path.contains('/common/build/resources/')
                    || path.contains('/sable_companion_1_20/build/classes/')
                    || path.contains('/sable_companion_1_20/build/resources/')
        }
        if (!developmentSableEntries.isEmpty()) {
            throw new GradleException("Standalone launcher exposes development Sable/Companion output: "
                    + developmentSableEntries*.absolutePath)
        }
        File legacyClasspathFile = layout.buildDirectory.file(
                'classpath/forge_runStandaloneClient_minecraftClasspath.txt').get().asFile
        if (!legacyClasspathFile.isFile()) {
            throw new GradleException("Standalone legacy classpath file is missing: ${legacyClasspathFile}")
        }
        def legacyClasspathEntries = legacyClasspathFile.getText('UTF-8')
                .readLines()
                .collectMany { line -> line.split(';') as List }
                .collect { it.trim() }
                .findAll { !it.isEmpty() }
                .collect { file(it) }
        def leakedLegacyTargets = legacyClasspathEntries.findAll(standaloneRuntimeClasspathLeak)
        if (!leakedLegacyTargets.isEmpty()) {
            throw new GradleException(
                    'Standalone legacyClassPath.file must not expose target mods; they belong in mods/: '
                            + leakedLegacyTargets*.absolutePath
            )
        }
        def jvmArgLeaks = runConfig.jvmArgs.findAll { arg ->
            String lower = arg.toString().replace('\\', '/').toLowerCase(Locale.ROOT)
            lower.contains('registrate') || lower.contains('/deobf_dependencies/local/target/')
        }
        if (!jvmArgLeaks.isEmpty()) {
            throw new GradleException("Standalone JVM args leak target modules directly: ${jvmArgLeaks}")
        }
        def javaExecArgLeaks = (
                tasks.named('runStandaloneClient').get().jvmArgs
                        + tasks.named('runStandaloneClient').get().args
                        + tasks.named('runStandaloneClient').get().systemProperties.values()
        ).findAll { arg ->
            String lower = arg.toString().replace('\\', '/').toLowerCase(Locale.ROOT)
            lower.contains('registrate')
                    || lower.contains('/deobf_dependencies/local/target/')
                    || lower.contains('/deobf_dependencies/foundry/veil/')
        }
        if (!javaExecArgLeaks.isEmpty()) {
            throw new GradleException("Standalone JavaExec generated launch args leak target modules: "
                    + javaExecArgLeaks)
        }
        File modsDir = standaloneRuntimeModsDir.asFile
        def mappedRuntimeArtifact = { String artifactName, String expectedVersion ->
            String expectedMappedVersion = "${expectedVersion}_mapped_official_${forge_minecraft_version}"
            def artifact = configurations.targetRuntimeMapped.resolvedConfiguration.resolvedArtifacts.find {
                it.moduleVersion.id.group == 'local.target'
                        && it.name == artifactName
                        && it.moduleVersion.id.version == expectedMappedVersion
            }
            if (artifact == null) {
                throw new GradleException(
                        "Standalone verifier could not resolve mapped ${artifactName}:${expectedMappedVersion}"
                )
            }
            artifact.file
        }
        File mappedFlywheel = mappedRuntimeArtifact(
                "flywheel-forge-${forge_minecraft_version}".toString(),
                forge_flywheel_version.toString())
        File mappedPonder = ponderDevelopmentRuntime.get().asFile
        if (!mappedPonder.isFile()) {
            throw new GradleException("Standalone patched Ponder artifact is missing: ${mappedPonder}")
        }
        File productionSableJar = standaloneProductionSableArtifact.get().asFile
        File mappedSableJar = standaloneMappedSableRuntime.get().asFile
        if (!productionSableJar.isFile()) {
            throw new GradleException("Standalone production Sable artifact is missing: ${productionSableJar}")
        }
        if (!mappedSableJar.isFile()) {
            throw new GradleException("Standalone mapped Sable artifact is missing: ${mappedSableJar}")
        }
        if (mappedSableJar.canonicalFile == productionSableJar.canonicalFile) {
            throw new GradleException('Standalone mapped Sable artifact must not replace the production all-jar')
        }
        String productionSableSha = SableStandaloneUserdevMapper.sha256Hex(productionSableJar)
        String mappedSableSha = SableStandaloneUserdevMapper.sha256Hex(mappedSableJar)
        if (productionSableSha == mappedSableSha) {
            throw new GradleException('Standalone mapped Sable artifact is byte-identical to the reobfuscated all-jar')
        }
        def finalMinecraftMixin = SableStandaloneUserdevMapper.classMembers(
                productionSableJar,
                'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.class')
        def mappedMinecraftMixin = SableStandaloneUserdevMapper.classMembers(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.class')
        if (!finalMinecraftMixin.fields.contains('f_91073_') || finalMinecraftMixin.fields.contains('level')) {
            throw new GradleException("Final Sable MinecraftMixin does not prove production namespace: "
                    + finalMinecraftMixin.fields)
        }
        if (!mappedMinecraftMixin.fields.contains('level') || mappedMinecraftMixin.fields.contains('f_91073_')) {
            throw new GradleException("Standalone mapped MinecraftMixin does not expose userdev field level: "
                    + mappedMinecraftMixin.fields)
        }
        def finalGameRendererMixin = SableStandaloneUserdevMapper.classMembers(
                productionSableJar,
                'dev/ryanhcode/sable/mixin/entity/entities_turn_with_sub_levels/GameRendererMixin.class')
        def mappedGameRendererMixin = SableStandaloneUserdevMapper.classMembers(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/entity/entities_turn_with_sub_levels/GameRendererMixin.class')
        if (!finalGameRendererMixin.fields.contains('f_109059_') || finalGameRendererMixin.fields.contains('minecraft')) {
            throw new GradleException("Final Sable GameRendererMixin does not prove production namespace: "
                    + finalGameRendererMixin.fields)
        }
        if (!mappedGameRendererMixin.fields.contains('minecraft')
                || mappedGameRendererMixin.fields.contains('f_109059_')) {
            throw new GradleException("Standalone mapped GameRendererMixin does not expose userdev field minecraft: "
                    + mappedGameRendererMixin.fields)
        }
        String reloadDescriptor = '(Lnet/minecraft/server/packs/resources/ResourceManager;)V'
        def jarHasEntry = { File jar, String entryName ->
            JarFile jarFile = new JarFile(jar)
            try {
                jarFile.getJarEntry(entryName) != null
            } finally {
                jarFile.close()
            }
        }
        def retainedReloadDispatchers = [
                'dev/ryanhcode/sable/sublevel/render/dispatcher/VanillaSubLevelRenderDispatcher.class'
        ]
        [
                'dev/ryanhcode/sable/sublevel/render/dispatcher/FancySubLevelRenderDispatcher.class'
        ].each { optionalEntry ->
            if (jarHasEntry(productionSableJar, optionalEntry) || jarHasEntry(mappedSableJar, optionalEntry)) {
                retainedReloadDispatchers.add(optionalEntry)
            }
        }
        retainedReloadDispatchers.each { classEntry ->
            def finalDispatcher = SableStandaloneUserdevMapper.classMembers(productionSableJar, classEntry)
            def mappedDispatcher = SableStandaloneUserdevMapper.classMembers(mappedSableJar, classEntry)
            if (!finalDispatcher.methods.contains('m_6213_' + reloadDescriptor)
                    || finalDispatcher.methods.contains('onResourceManagerReload' + reloadDescriptor)) {
                throw new GradleException("Final ${classEntry} does not prove production reload namespace: "
                        + finalDispatcher.methods)
            }
            if (!mappedDispatcher.methods.contains('onResourceManagerReload' + reloadDescriptor)
                    || mappedDispatcher.methods.contains('m_6213_' + reloadDescriptor)) {
                throw new GradleException("Standalone mapped ${classEntry} did not remap reload callback: "
                        + mappedDispatcher.methods)
            }
            def mappedReferences = SableStandaloneUserdevMapper.classReferences(mappedSableJar, classEntry)
            if (mappedReferences.methods.any { it.contains('.m_6213_' + reloadDescriptor) }) {
                throw new GradleException("Standalone mapped ${classEntry} has stale reload self reference: "
                        + mappedReferences.methods)
            }
        }
        String reachAroundEntry = 'dev/ryanhcode/sable/sublevel/render/dispatcher/ReachAroundSubLevelRenderDispatcher.class'
        if (jarHasEntry(mappedSableJar, reachAroundEntry)) {
            def reachAroundDispatcher = SableStandaloneUserdevMapper.classMembers(mappedSableJar, reachAroundEntry)
            if (reachAroundDispatcher.methods.contains('m_6213_' + reloadDescriptor)) {
                throw new GradleException("ReachAroundSubLevelRenderDispatcher declares stale reload callback: "
                        + reachAroundDispatcher.methods)
            }
        }
        String reloadApplyTypedDescriptor = (
                '(Ljava/util/Map;Lnet/minecraft/server/packs/resources/ResourceManager;'
                        + 'Lnet/minecraft/util/profiling/ProfilerFiller;)V')
        String reloadApplyErasedDescriptor = (
                '(Ljava/lang/Object;Lnet/minecraft/server/packs/resources/ResourceManager;'
                        + 'Lnet/minecraft/util/profiling/ProfilerFiller;)V')
        [
                'dev/ryanhcode/sable/physics/config/FloatingBlockMaterialDataHandler$ReloadListener.class',
                'dev/ryanhcode/sable/physics/config/dimension_physics/DimensionPhysicsData$ReloadListener.class',
                'dev/ryanhcode/sable/physics/config/block_properties/PhysicsBlockPropertiesDefinitionLoader.class'
        ].each { classEntry ->
            def finalReloadListener = SableStandaloneUserdevMapper.classMembers(productionSableJar, classEntry)
            def mappedReloadListener = SableStandaloneUserdevMapper.classMembers(mappedSableJar, classEntry)
            if (!finalReloadListener.methods.contains('apply' + reloadApplyTypedDescriptor)
                    || !finalReloadListener.methods.contains('m_5787_' + reloadApplyErasedDescriptor)) {
                throw new GradleException("Final ${classEntry} does not prove production reload apply bridge shape: "
                        + finalReloadListener.methods)
            }
            if (!mappedReloadListener.methods.contains('apply' + reloadApplyTypedDescriptor)
                    || !mappedReloadListener.methods.contains('apply' + reloadApplyErasedDescriptor)
                    || mappedReloadListener.methods.contains('m_5787_' + reloadApplyErasedDescriptor)) {
                throw new GradleException("Standalone mapped ${classEntry} lacks named erased reload apply bridge: "
                        + mappedReloadListener.methods)
            }
            def mappedReloadReferences = SableStandaloneUserdevMapper.classReferences(mappedSableJar, classEntry)
            if (mappedReloadReferences.methods.any { it.contains('.m_5787_' + reloadApplyErasedDescriptor) }) {
                throw new GradleException("Standalone mapped ${classEntry} has stale reload apply bridge reference: "
                        + mappedReloadReferences.methods)
            }
        }
        def standaloneHierarchyClasspath = configurations.compileClasspath.files.findAll {
            it.isFile() && it.name.endsWith('.jar')
        }
        def staleHierarchyDeclarations = SableStandaloneUserdevMapper.staleHierarchyMethodDeclarations(
                mappedSableJar,
                layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile,
                standaloneHierarchyClasspath)
        if (!staleHierarchyDeclarations.isEmpty()) {
            throw new GradleException("Standalone mapped Sable has stale hierarchy method declarations: "
                    + staleHierarchyDeclarations)
        }
        def staleHierarchyReferences = SableStandaloneUserdevMapper.staleHierarchyMethodReferences(
                mappedSableJar,
                layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile,
                standaloneHierarchyClasspath)
        if (!staleHierarchyReferences.isEmpty()) {
            throw new GradleException("Standalone mapped Sable has stale hierarchy method references: "
                    + staleHierarchyReferences)
        }
        def serverLevelPlotRefs = SableStandaloneUserdevMapper.classReferences(
                mappedSableJar,
                'dev/ryanhcode/sable/sublevel/plot/ServerLevelPlot.class')
        if (!serverLevelPlotRefs.handles.any {
            it == 'net/minecraft/server/level/ChunkHolder.getFullStatus()Lnet/minecraft/server/level/FullChunkStatus;'
        } || serverLevelPlotRefs.handles.any { it.contains('ChunkHolder.m_287213_') }) {
            throw new GradleException("Standalone mapped ServerLevelPlot bootstrap handles did not remap "
                    + "ChunkHolder.m_287213_ -> getFullStatus: ${serverLevelPlotRefs.handles}")
        }
        String expectedPacketSendHandle = ('net/minecraft/server/network/ServerGamePacketListenerImpl.send'
                + '(Lnet/minecraft/network/protocol/Packet;)V')
        if (!serverLevelPlotRefs.handles.any {
            it == expectedPacketSendHandle
        } || serverLevelPlotRefs.handles.any {
            it.contains('ServerGamePacketListenerImpl.m_9829_')
        }) {
            throw new GradleException("Standalone mapped ServerLevelPlot bootstrap handles did not remap "
                    + "ServerGamePacketListenerImpl.m_9829_ -> send: ${serverLevelPlotRefs.handles}")
        }
        def staleMemberReferences = SableStandaloneUserdevMapper.staleKnownMemberReferences(
                mappedSableJar,
                layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile,
                standaloneHierarchyClasspath)
        if (!staleMemberReferences.references.isEmpty()) {
            throw new GradleException("Standalone mapped Sable has stale known remappable member references: "
                    + staleMemberReferences.references)
        }
        logger.lifecycle("Verified standalone mapped Sable stale member scan: ordinary="
                + "${staleMemberReferences.ordinaryInstructionReferences}, handles="
                + "${staleMemberReferences.handleReferences}, constantDynamicOrLdcHandles="
                + "${staleMemberReferences.constantDynamicOrLdcHandleReferences}, remaining=0")
        def argumentTypeInfosMixin = SableStandaloneUserdevMapper.classMembers(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/command/ArgumentTypeInfosMixin.class')
        def argumentTypeInfosRefs = SableStandaloneUserdevMapper.classReferences(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/command/ArgumentTypeInfosMixin.class')
        String argumentTypeRegisterDescriptor = (
                '(Lnet/minecraft/core/Registry;Ljava/lang/String;Ljava/lang/Class;'
                        + 'Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;)'
                        + 'Lnet/minecraft/commands/synchronization/ArgumentTypeInfo;')
        if (!argumentTypeInfosMixin.methods.contains('register' + argumentTypeRegisterDescriptor)
                || argumentTypeInfosMixin.methods.any { it.startsWith('m_235386_') }) {
            throw new GradleException("Standalone mapped ArgumentTypeInfosMixin declaration is stale: "
                    + argumentTypeInfosMixin.methods)
        }
        if (!argumentTypeInfosRefs.methods.contains(
                'dev/ryanhcode/sable/mixin/command/ArgumentTypeInfosMixin.register'
                        + argumentTypeRegisterDescriptor)
                || argumentTypeInfosRefs.methods.any { it.contains('ArgumentTypeInfosMixin.m_235386_') }) {
            throw new GradleException("Standalone mapped ArgumentTypeInfosMixin self-call is stale: "
                    + argumentTypeInfosRefs.methods)
        }
        if (!argumentTypeInfosRefs.methods.any {
            it.contains('net/minecraft/commands/synchronization/SingletonArgumentInfo.contextFree')
        }) {
            throw new GradleException('Standalone mapped ArgumentTypeInfosMixin lost external contextFree remap')
        }
        def plotMinecraftRefs = SableStandaloneUserdevMapper.classReferences(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.class')
        if (!plotMinecraftRefs.fields.contains(
                'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.level:'
                        + 'Lnet/minecraft/client/multiplayer/ClientLevel;')
                || plotMinecraftRefs.fields.any { it.contains('MinecraftMixin.f_91073_') }) {
            throw new GradleException("Standalone mapped plot.MinecraftMixin field self-reference is stale: "
                    + plotMinecraftRefs.fields)
        }
        def itemInvokerRefs = SableStandaloneUserdevMapper.classReferences(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/punching/ItemInvoker.class')
        if (!itemInvokerRefs.annotationValues.contains('getPlayerPOVHitResult')
                || itemInvokerRefs.annotationValues.contains('m_41435_')) {
            throw new GradleException("Standalone mapped ItemInvoker annotation target is stale: "
                    + itemInvokerRefs.annotationValues)
        }
        def mappedFlywheelMinecraftMixin = SableStandaloneUserdevMapper.classMembers(
                mappedFlywheel,
                'dev/engine_room/flywheel/impl/mixin/MinecraftMixin.class')
        if (!mappedFlywheelMinecraftMixin.fields.contains('resourceManager')
                || mappedFlywheelMinecraftMixin.fields.contains('f_91036_')) {
            throw new GradleException("Standalone Flywheel is not mapped for userdev MinecraftMixin: "
                    + mappedFlywheelMinecraftMixin.fields)
        }
        def expectedStandaloneMods = [
                mappedSableJar.name,
                createDevelopmentRuntime.get().asFile.name,
                mappedFlywheel.name,
                mappedPonder.name,
                veilDevelopmentRuntime.get().asFile.name
        ] as Set
        def actualStandaloneMods = (modsDir.listFiles()?.findAll { it.isFile() }*.name ?: []) as Set
        if (actualStandaloneMods != expectedStandaloneMods) {
            throw new GradleException(
                    "Standalone mods directory has unexpected contents: ${actualStandaloneMods}; "
                            + "expected ${expectedStandaloneMods}"
            )
        }
        def standaloneRegistrateMods = actualStandaloneMods.findAll {
            it.toLowerCase(Locale.ROOT).contains('registrate')
        }
        if (!standaloneRegistrateMods.isEmpty()) {
            throw new GradleException("Standalone mods directory must not contain standalone Registrate: "
                    + standaloneRegistrateMods)
        }
        def managedModFiles = modsDir.listFiles()?.findAll { it.isFile() } ?: []
        def intendedModNames = managedModFiles*.name as Set
        def requiredIntendedModNames = [
                mappedSableJar.name,
                createDevelopmentRuntime.get().asFile.name,
                mappedFlywheel.name,
                mappedPonder.name,
                veilDevelopmentRuntime.get().asFile.name
        ] as Set
        if (intendedModNames != requiredIntendedModNames) {
            throw new GradleException("Standalone intended mods mismatch: ${intendedModNames}")
        }
        if (actualStandaloneMods.contains(productionSableJar.name)) {
            throw new GradleException("Standalone userdev mods directory must not contain production Sable jar: "
                    + productionSableJar.name)
        }
        JarFile mappedSableZip = new JarFile(mappedSableJar)
        try {
            [
                    'META-INF/mods.toml',
                    'sable.refmap.json',
                    'sable-common-forge.mixins.json',
                    'sable-forge.mixins.json',
                    'META-INF/accesstransformer-forge.cfg',
                    'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion',
                    'META-INF/jarjar/metadata.json',
                    'META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar',
                    'META-INF/jarjar/mixinextras-forge-0.5.3.jar'
            ].each { entry ->
                if (mappedSableZip.getJarEntry(entry) == null) {
                    throw new GradleException("Standalone mapped Sable artifact lost required entry ${entry}")
                }
            }
            def companionOuterClasses = mappedSableZip.entries().toList().findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/companion/') && entry.name.endsWith('.class')
            }
            if (!companionOuterClasses.isEmpty()) {
                throw new GradleException("Standalone mapped Sable leaked Companion classes outside JarJar: "
                        + companionOuterClasses*.name)
            }
            def smokeEntry = mappedSableZip.getJarEntry(
                    'dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.class')
            if (smokeEntry == null) {
                throw new GradleException('Standalone mapped Sable artifact is missing standalone smoke harness')
            }
            String smokeClassText = new String(
                    mappedSableZip.getInputStream(smokeEntry).readAllBytes(),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            def parseStandaloneSmokeResourceUrl = { String rawUrl ->
                String path = java.net.URLDecoder.decode(
                        rawUrl,
                        java.nio.charset.StandardCharsets.UTF_8
                ).replace('\\', '/')
                if (path.startsWith('jar:')) {
                    path = path.substring('jar:'.length())
                }
                if (path.startsWith('union:')) {
                    path = path.substring('union:'.length())
                }
                if (path.startsWith('file:')) {
                    path = path.substring('file:'.length())
                }
                if (path.length() >= 3 && path.charAt(0) == '/' && path.charAt(2) == ':') {
                    path = path.substring(1)
                }
                def findJarEnd = { String candidatePath, int fromIndex ->
                    int jarName = candidatePath.indexOf('.jar', fromIndex)
                    while (jarName >= 0) {
                        int jarEnd = jarName + '.jar'.length()
                        if (jarEnd == candidatePath.length()
                                || candidatePath.charAt(jarEnd) == '#'
                                || candidatePath.charAt(jarEnd) == '!'
                                || candidatePath.charAt(jarEnd) == '/') {
                            return jarEnd
                        }
                        jarName = candidatePath.indexOf('.jar', jarEnd)
                    }
                    throw new GradleException("Standalone smoke URL canary did not contain a jar artifact: ${rawUrl}")
                }
                def stripSecureJarId = { String suffix ->
                    if (!suffix.startsWith('#')) {
                        return suffix
                    }
                    int index = 1
                    while (index < suffix.length() && Character.isDigit(suffix.charAt(index))) {
                        index++
                    }
                    if (index <= 1 || index >= suffix.length()
                            || !(suffix.charAt(index) == '!' || suffix.charAt(index) == '_')) {
                        throw new GradleException("Standalone smoke URL canary has invalid SecureJar id: ${rawUrl}")
                    }
                    suffix.charAt(index) == '_' ? suffix.substring(index + 1) : suffix.substring(index)
                }
                int outerJarEnd = findJarEnd(path, 0)
                String outerArtifact = path.substring(0, outerJarEnd)
                String suffix = stripSecureJarId(path.substring(outerJarEnd))
                if (suffix.startsWith('!/')) {
                    return [outer: outerArtifact, nested: null, resource: suffix.substring('!/'.length())]
                }
                if (suffix.startsWith('/')) {
                    String nestedAndResource = suffix.substring(1)
                    int nestedJarEnd = findJarEnd(nestedAndResource, 0)
                    String nestedEntry = nestedAndResource.substring(0, nestedJarEnd)
                    suffix = stripSecureJarId(nestedAndResource.substring(nestedJarEnd))
                    if (!suffix.startsWith('!/')) {
                        throw new GradleException("Standalone smoke nested URL canary lacks resource separator: ${rawUrl}")
                    }
                    return [outer: outerArtifact, nested: nestedEntry, resource: suffix.substring('!/'.length())]
                }
                throw new GradleException("Unsupported standalone smoke URL canary shape: ${rawUrl}")
            }
            String unionCanary = ('union:/C:/work/run/standalone-client/mods/'
                    + 'sable-forge-1.20.1-2.0.0-all-userdev.jar%23198!/dev/example/Class.class')
            def parsedUnionCanary = parseStandaloneSmokeResourceUrl(unionCanary)
            String expectedUnionCanary = ('C:/work/run/standalone-client/mods/'
                    + 'sable-forge-1.20.1-2.0.0-all-userdev.jar')
            if (parsedUnionCanary.outer != expectedUnionCanary
                    || parsedUnionCanary.nested != null
                    || parsedUnionCanary.resource != 'dev/example/Class.class') {
                throw new GradleException(
                        "Standalone smoke union URL canary parsed to ${parsedUnionCanary}, "
                                + "expected outer=${expectedUnionCanary}, nested=null, resource=dev/example/Class.class"
                )
            }
            String nestedUnionCanary = ('union:/C:/x/outer.jar%23198_/'
                    + 'META-INF/jarjar/inner.jar%23218!/dev/Y.class')
            def parsedNestedUnionCanary = parseStandaloneSmokeResourceUrl(nestedUnionCanary)
            if (parsedNestedUnionCanary.outer != 'C:/x/outer.jar'
                    || parsedNestedUnionCanary.nested != 'META-INF/jarjar/inner.jar'
                    || parsedNestedUnionCanary.resource != 'dev/Y.class') {
                throw new GradleException(
                        "Standalone smoke nested union URL canary parsed to ${parsedNestedUnionCanary}, "
                                + 'expected outer=C:/x/outer.jar, nested=META-INF/jarjar/inner.jar, '
                                + 'resource=dev/Y.class'
                )
            }
            if (!smokeClassText.contains('META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar')
                    || !smokeClassText.contains('requireNestedJarSource')
                    || !smokeClassText.contains('requireNoDevelopmentSource')
                    || !smokeClassText.contains(' did not resolve from ')
                    || !smokeClassText.contains(' inside the staged Sable artifact: ')
                    || !smokeClassText.contains('resolved from development output instead of packaged artifact')
                    || !smokeClassText.contains('SableCompanion')
                    || !smokeClassText.contains('DefaultSableCompanion')) {
                throw new GradleException('Standalone smoke harness no longer verifies nested Companion JarJar provenance')
            }
            if (!smokeClassText.contains('normalizeResourceUrl')
                    || !smokeClassText.contains('parseRuntimeResourceUrl')
                    || !smokeClassText.contains('ParsedRuntimeResource')
                    || !smokeClassText.contains('union:')
                    || !smokeClassText.contains('#')) {
                throw new GradleException(
                        'Standalone smoke harness no longer normalizes Forge/SecureJar union resource URLs'
                )
            }
            if (smokeClassText.contains('did not resolve from the final Sable all-jar')) {
                throw new GradleException('Standalone smoke harness still requires literal final all-jar filename')
            }
            def staleSelfReferences = []
            mappedSableZip.entries().toList().findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/mixin/')
                        && entry.name.endsWith('.class')
                        && !entry.name.contains('$')
            }.each { entry ->
                String owner = entry.name.substring(0, entry.name.length() - '.class'.length())
                def references = SableStandaloneUserdevMapper.classReferences(mappedSableJar, entry.name)
                references.fields.findAll { reference ->
                    reference.startsWith(owner + '.f_')
                }.each { reference ->
                    staleSelfReferences.add("${entry.name}: ${reference}")
                }
                references.methods.findAll { reference ->
                    reference.startsWith(owner + '.m_')
                }.each { reference ->
                    staleSelfReferences.add("${entry.name}: ${reference}")
                }
            }
            if (!staleSelfReferences.isEmpty()) {
                throw new GradleException(
                        'Standalone mapped Sable contains stale intra-Mixin SRG member references: '
                                + staleSelfReferences
                )
            }
        } finally {
            mappedSableZip.close()
        }
        File stagedCreate = new File(modsDir, createDevelopmentRuntime.get().asFile.name)
        int effectiveRegistrateSuppliers = 0
        String effectiveRegistrateSupplier = null
        JarFile stagedCreateJar = new JarFile(stagedCreate)
        try {
            String registratePath = expectedTargetArtifacts.registrate.path
            def nestedRegistrate = stagedCreateJar.getJarEntry(registratePath)
            if (nestedRegistrate == null) {
                throw new GradleException("Standalone Create runtime is missing nested ${registratePath}")
            }
            effectiveRegistrateSuppliers += 1
            effectiveRegistrateSupplier = "${stagedCreate.absolutePath}!/${registratePath}"
            ZipInputStream registrateZip = new ZipInputStream(stagedCreateJar.getInputStream(nestedRegistrate))
            try {
                boolean foundRegistrateLoot = false
                boolean foundAbstractRegistrate = false
                def entry
                while ((entry = registrateZip.nextEntry) != null) {
                    foundRegistrateLoot |= entry.name == 'com/tterrag/registrate/providers/loot/RegistrateLootTables.class'
                    foundAbstractRegistrate |= entry.name == 'com/tterrag/registrate/AbstractRegistrate.class'
                }
                if (!foundAbstractRegistrate || !foundRegistrateLoot) {
                    throw new GradleException(
                            "Nested Create Registrate lacks expected canaries: AbstractRegistrate="
                                    + "${foundAbstractRegistrate}, loot=${foundRegistrateLoot}"
                    )
                }
            } finally {
                registrateZip.close()
            }
        } finally {
            stagedCreateJar.close()
        }
        def unexpectedRegistrateFiles = (
                standaloneClasspath
                        + legacyClasspathEntries
                        + sourceSets.standaloneRuntimeLauncher.compileClasspath.files
                        + sourceSets.standaloneRuntimeLauncher.runtimeClasspath.files
        ).findAll { file ->
            file.name.toLowerCase(Locale.ROOT).contains('registrate')
        }
        if (!unexpectedRegistrateFiles.isEmpty()) {
            throw new GradleException("Unexpected standalone Registrate suppliers outside Create JarJar: "
                    + unexpectedRegistrateFiles*.absolutePath)
        }
        if (effectiveRegistrateSuppliers != 1) {
            throw new GradleException("Expected one effective Registrate supplier, found "
                    + effectiveRegistrateSuppliers)
        }
        logger.lifecycle("Verified standalone run configuration: main=${runConfig.main}, sources=${sourceNames}, "
                + "launchTarget=forgeclientuserdev, empty MOD_CLASSES roots exist, "
                + "mapped Sable userdev artifact derived from final all-jar sha256=${productionSableSha}, "
                + "no external Companion or target-mod classpath, legacy classpath clean, "
                + "Create-owned nested Registrate is the only standalone Registrate supplier: "
                + effectiveRegistrateSupplier)
    }
}

tasks.register('verifyRapierRuntimeSmokePreparation') {
    group = 'verification'
    description = 'Statically verifies M8.4 standalone Rapier userdev mapping, provenance, and smoke-probe wiring.'
    dependsOn prepareStandaloneSableUserdevArtifact
    dependsOn tasks.named('prepareStandaloneRuntimeLauncherRoots')
    inputs.files(sourceSets.main.output.classesDirs)

    doLast {
        File smokeSource = file('src/main/java/dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.java')
        String smokeSourceText = smokeSource.getText('UTF-8')
        [
                'm8_rapier_gravity_smoke',
                'SABLE_RAPIER_SMOKE phase={} status=PASS',
                'provider=RapierPhysicsPipelineProvider',
                'Rapier pipeline initialized; native/JNI init completed',
                'freshObject=',
                'rapierPass("gravity"',
                'rapierPass("collision"',
                'status=SKIP after failed M8 gate',
                'approximatelyStationary'
        ].each { canary ->
            if (!smokeSourceText.contains(canary)) {
                throw new GradleException("M8 Rapier smoke source lacks canary: ${canary}")
            }
        }
        [
                'requireSingleServerObject',
                'runServerGate',
                'create6_runtime_smoke',
                'Sublevel has nonzero linear velocity',
                'Sublevel has nonzero angular velocity',
                'phase=lifecycle status=PASS observed integrated server stop cycle='
        ].each { forbidden ->
            if (smokeSourceText.contains(forbidden)) {
                throw new GradleException("M8 Rapier smoke source still contains old M7 invariant/path: ${forbidden}")
            }
        }

        File productionSableJar = standaloneProductionSableArtifact.get().asFile
        File mappedSableJar = standaloneMappedSableRuntime.get().asFile
        File productionNestedRapier = standaloneRapierProductionNestedJar.get().asFile
        File userdevNestedRapier = standaloneRapierUserdevNestedJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        if (!productionSableJar.isFile() || !mappedSableJar.isFile()) {
            throw new GradleException('M8.4 requires final and standalone mapped Sable artifacts to exist')
        }
        if (!productionNestedRapier.isFile() || !userdevNestedRapier.isFile()) {
            throw new GradleException('M8.4 nested Rapier production/userdev artifacts were not prepared')
        }
        def verifyJarSmokeText = { String label, String smokeText ->
            [
                    'm8_rapier_gravity_smoke',
                    'SABLE_RAPIER_SMOKE',
                    'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipelineProvider',
                    'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipeline',
                    'dev.ryanhcode.sable.physics.impl.rapier.Rapier3D',
                    'META-INF/jarjar/sable-rapier-common-1.20.1-2.0.0.jar',
                    'META-INF/jarjar/lz4-java-1.11.0.jar',
                    'freshObject=',
                    'gravity',
                    'collision',
                    'Rapier pipeline initialized; native/JNI init completed',
                    'M8 Rapier gravity/collision did not complete'
            ].each { canary ->
                if (!smokeText.contains(canary)) {
                    throw new GradleException("${label} lacks M8 canary: ${canary}")
                }
            }
            [
                    'create6_runtime_smoke',
                    'requireSingleServerObject',
                    'runServerGate',
                    'Sublevel has nonzero linear velocity',
                    'Sublevel has nonzero angular velocity'
            ].each { forbidden ->
                if (smokeText.contains(forbidden)) {
                    throw new GradleException("${label} still contains old M7 invariant/path: ${forbidden}")
                }
            }
        }
        JarFile productionOuter = new JarFile(productionSableJar)
        try {
            def productionSmokeEntry = productionOuter.getJarEntry(
                    'dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.class')
            if (productionSmokeEntry == null) {
                throw new GradleException('Final production Sable artifact is missing standalone smoke harness')
            }
            verifyJarSmokeText('Final production standalone smoke harness',
                    new String(productionOuter.getInputStream(productionSmokeEntry).readAllBytes(),
                            java.nio.charset.StandardCharsets.ISO_8859_1))
        } finally {
            productionOuter.close()
        }
        def standaloneHierarchyClasspath = productionRemapHierarchyClasspath()

        def productionRapierReport = RapierProductionJarMapper.referenceReport(
                productionNestedRapier, mappingsFile, standaloneHierarchyClasspath)
        if (productionRapierReport.productionMinecraftMemberReferences.isEmpty()
                || !productionRapierReport.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Production nested Rapier namespace proof failed: productionRefs="
                    + "${productionRapierReport.productionMinecraftMemberReferences.size()}, namedRefs="
                    + "${productionRapierReport.namedMinecraftMemberReferences.take(20)}")
        }
        def userdevRapierReport = RapierProductionJarMapper.referenceReport(
                userdevNestedRapier, mappingsFile, standaloneHierarchyClasspath)
        def userdevSrgLookingProductionRefs = userdevRapierReport.productionMinecraftMemberReferences.findAll {
            it.contains('.m_') || it.contains('.f_')
        }
        if (userdevRapierReport.namedMinecraftMemberReferences.isEmpty()
                || !userdevSrgLookingProductionRefs.isEmpty()) {
            throw new GradleException("Standalone userdev nested Rapier namespace proof failed: namedRefs="
                    + "${userdevRapierReport.namedMinecraftMemberReferences.size()}, staleSrgLookingProductionRefs="
                    + "${userdevSrgLookingProductionRefs.take(20)}")
        }
        def staleRapierRefs = SableStandaloneUserdevMapper.staleKnownMemberReferences(
                userdevNestedRapier,
                layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile,
                standaloneHierarchyClasspath)
        if (!staleRapierRefs.references.isEmpty()) {
            throw new GradleException("Standalone userdev nested Rapier has stale SRG member references: "
                    + staleRapierRefs.references.take(30))
        }

        JarFile mappedOuter = new JarFile(mappedSableJar)
        try {
            def mappedOuterEntries = mappedOuter.entries().toList()
            def mappedRapierEntry = mappedOuter.getJarEntry(rapierBackportJarJarPath)
            if (mappedRapierEntry == null) {
                throw new GradleException("Standalone mapped Sable lacks nested Rapier ${rapierBackportJarJarPath}")
            }
            if (sha256Bytes(mappedOuter.getInputStream(mappedRapierEntry).readAllBytes())
                    != sha256(userdevNestedRapier)) {
                throw new GradleException('Standalone mapped outer Sable does not contain the prepared userdev Rapier jar bytes')
            }
            def lz4Entry = mappedOuter.getJarEntry(rapierLz4JarJarPath)
            if (lz4Entry == null || sha256Bytes(mappedOuter.getInputStream(lz4Entry).readAllBytes()) != rapierLz4Sha256) {
                throw new GradleException('Standalone mapped Sable lost the exact nested LZ4 runtime jar')
            }
            [
                    'META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar',
                    'META-INF/jarjar/mixinextras-forge-0.5.3.jar'
            ].each { entry ->
                if (mappedOuter.getJarEntry(entry) == null) {
                    throw new GradleException("Standalone mapped Sable lost nested ${entry}")
                }
            }
            def outerRapierClasses = mappedOuterEntries.findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/physics/impl/rapier/') && entry.name.endsWith('.class')
            }
            if (!outerRapierClasses.isEmpty()) {
                throw new GradleException("Rapier classes leaked into standalone outer Sable: ${outerRapierClasses*.name}")
            }
            def smokeEntry = mappedOuter.getJarEntry(
                    'dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.class')
            if (smokeEntry == null) {
                throw new GradleException('Standalone mapped Sable artifact is missing standalone smoke harness')
            }
            String smokeClassText = new String(
                    mappedOuter.getInputStream(smokeEntry).readAllBytes(),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            verifyJarSmokeText('Standalone mapped smoke harness', smokeClassText)
        } finally {
            mappedOuter.close()
        }

        def launcherSurfaces = [
                'runStandaloneClient.classpath'                     : tasks.named('runStandaloneClient').get().classpath.files,
                'standaloneRuntimeLauncher.compileClasspath'        : sourceSets.standaloneRuntimeLauncher.compileClasspath.files,
                'standaloneRuntimeLauncher.runtimeClasspath'        : sourceSets.standaloneRuntimeLauncher.runtimeClasspath.files
        ]
        launcherSurfaces.each { surface, files ->
            def leaks = files.findAll { file ->
                String path = file.absolutePath.replace('\\', '/').toLowerCase(Locale.ROOT)
                path.contains('/classes/java/rapierbackport')
                        || path.contains('/resources/rapierbackport')
                        || path.contains('/rapierbackport/')
                        || path.contains('/sable_rapier/build/')
            }
            if (!leaks.isEmpty()) {
                throw new GradleException("${surface} leaks Rapier development output: ${leaks*.absolutePath}")
            }
        }
        File legacyClasspathFile = layout.buildDirectory.file(
                'classpath/forge_runStandaloneClient_minecraftClasspath.txt').get().asFile
        if (legacyClasspathFile.isFile()) {
            def legacyLeaks = legacyClasspathFile.getText('UTF-8')
                    .readLines()
                    .collectMany { line -> line.split(';') as List }
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() }
                    .findAll { entry ->
                        String lower = entry.replace('\\', '/').toLowerCase(Locale.ROOT)
                        lower.contains('/classes/java/rapierbackport')
                                || lower.contains('/resources/rapierbackport')
                                || lower.contains('/rapierbackport/')
                                || lower.contains('/sable_rapier/build/')
                    }
            if (!legacyLeaks.isEmpty()) {
                throw new GradleException("Standalone legacy classpath leaks Rapier development output: ${legacyLeaks}")
            }
        }

        logger.lifecycle("verifyRapierRuntimeSmokePreparation PASS: productionRapierRefs="
                + "${productionRapierReport.productionMinecraftMemberReferences.size()}, "
                + "userdevNamedRefs=${userdevRapierReport.namedMinecraftMemberReferences.size()}, "
                + "staleRapierRefs=0, ordinary=${staleRapierRefs.ordinaryInstructionReferences}, "
