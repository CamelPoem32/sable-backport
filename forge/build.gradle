        }
        def plotMinecraftRefs = SableStandaloneUserdevMapper.classReferences(
                mappedSableJar,
                'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.class')
        if (!plotMinecraftRefs.fields.contains(
                'dev/ryanhcode/sable/mixin/plot/MinecraftMixin.level:'
                        + 'Lnet/minecraft/client/multiplayer/ClientLevel;')
                || plotMinecraftRefs.fields.any { it.contains('MinecraftMixin.f_91073_') }) {
            throw new GradleException("Standalone mapped plot.MinecraftMixin field self-reference is stale: "
                    + plotMinecraftRefs.fields)
        }
        def itemInvokerRefs = SableStandaloneUserdevMapper.classReferences(
