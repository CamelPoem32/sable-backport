tasks.register('verifyTargetModpackDependencies') {
    group = 'verification'
    description = 'Confirms that all exact local target dependencies resolve through ForgeGradle mappings.'
    dependsOn prepareTargetModpackDependencies

    doLast {
        File repositoryDir = targetModpackRepository.get().asFile.canonicalFile
        def expectedModules = expectedTargetArtifacts.values().collect { it.artifact } as Set
        def resolved = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'local.target'
        }

        if ((resolved.collect { it.name } as Set) != expectedModules) {
            throw new GradleException(
                    "Expected mapped local modules ${expectedModules}, resolved ${resolved.collect { it.name }}"
            )
        }

        resolved.each { artifact ->
            String version = artifact.moduleVersion.id.version
            File file = artifact.file.canonicalFile
            if (!version.contains("_mapped_official_${forge_minecraft_version}")) {
                throw new GradleException("Local dependency was not deobfuscated: ${artifact.moduleVersion.id}")
            }
            if (file.toPath().startsWith(repositoryDir.toPath())) {
                throw new GradleException("Compile classpath still uses raw staged jar: ${file}")
            }
            logger.lifecycle("Mapped ${artifact.moduleVersion.id} -> ${file}")
        }
    }
}

tasks.register('verifyVeilDependency') {
    group = 'verification'
    description = 'Confirms ForgeGradle compiles against mapped Veil 1.20 rather than its raw production jar.'
    dependsOn prepareVeilDevelopmentRuntime
    dependsOn tasks.named('preparePonderDevelopmentRuntime')
    dependsOn tasks.named('prepareCreateDevelopmentRuntime')
    dependsOn tasks.named('createSrgToMcp')

    doLast {
        File mappingsFile = layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile
        if (!mappingsFile.isFile()) {
            throw new GradleException("Missing SRG->named mapping file for Veil AT verification: ${mappingsFile}")
        }
        def rawFiles = configurations.veilRaw.resolve()
        if (rawFiles.size() != 1) {
            throw new GradleException("Expected one raw Veil artifact, resolved ${rawFiles}")
        }
        File rawVeil = rawFiles.first().canonicalFile

        def veilArtifacts = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            artifact.name == "Veil-forge-${forge_minecraft_version}" && artifact.classifier == 'slim'
        }
        if (veilArtifacts.size() != 1) {
            throw new GradleException("Expected one compile Veil artifact, resolved ${veilArtifacts*.moduleVersion*.id}")
        }

        def mappedArtifact = veilArtifacts.first()
        File mappedVeil = mappedArtifact.file.canonicalFile
        if (mappedVeil == rawVeil) {
            throw new GradleException("Compile classpath uses the raw Veil artifact: ${rawVeil}")
        }
        if (sha256(mappedVeil) == sha256(rawVeil)) {
            throw new GradleException('Mapped and raw Veil artifacts have identical SHA-256 hashes')
        }
        if (configurations.compileClasspath.files.any { it.canonicalFile == rawVeil }) {
            throw new GradleException("Raw Veil jar leaked onto compileClasspath: ${rawVeil}")
        }

        String canaryPath = 'foundry/veil/api/client/render/VeilRenderSystem.class'
        def readCanary = { File file ->
            JarFile jarFile = new JarFile(file)
            try {
                def entry = jarFile.getJarEntry(canaryPath)
                if (entry == null) {
                    throw new GradleException("${file.name} does not contain ${canaryPath}")
                }
                jarFile.getInputStream(entry).withCloseable { input ->
                    new String(input.readAllBytes(), java.nio.charset.StandardCharsets.ISO_8859_1)
                }
            } finally {
                jarFile.close()
            }
        }

        String rawCanary = readCanary(rawVeil)
        String mappedCanary = readCanary(mappedVeil)
        if (!rawCanary.contains('m_91087_')) {
            throw new GradleException('Raw Veil canary does not contain the expected production SRG Minecraft call')
        }
        if (!mappedCanary.contains('getInstance')) {
            throw new GradleException('Mapped Veil canary does not contain the official-mapping Minecraft call')
        }

        File stagedVeil = veilDevelopmentRuntime.get().asFile.canonicalFile
        if (!stagedVeil.isFile()) {
            throw new GradleException("Staged Veil development runtime is missing: ${stagedVeil}")
        }
        def sourceAtReport = VeilDevelopmentRuntimePatcher.inspectAccessTransformer(
                configurations.veilRuntimeMapped.singleFile,
                mappingsFile
        )
        def stagedAtReport = VeilDevelopmentRuntimePatcher.inspectAccessTransformer(stagedVeil, mappingsFile)
        String compositeStateSrg = ('public net.minecraft.client.renderer.RenderType$CompositeRenderType '
                + 'm_173265_()Lnet/minecraft/client/renderer/RenderType$CompositeState; # state')
        String compositeStateNamed = ('public net.minecraft.client.renderer.RenderType$CompositeRenderType '
                + 'state()Lnet/minecraft/client/renderer/RenderType$CompositeState; # state')
        if (!sourceAtReport.text.contains(compositeStateSrg)) {
            throw new GradleException('Original mapped Veil artifact no longer contains the expected stale state AT canary')
        }
        if (!stagedAtReport.text.contains(compositeStateNamed)
                || stagedAtReport.text.contains('m_173265_()Lnet/minecraft/client/renderer/RenderType$CompositeState;')) {
            throw new GradleException('Staged Veil AT did not remap CompositeRenderType.state() correctly')
        }
        if (!stagedAtReport.text.contains(
                'public net.minecraft.client.renderer.GameRenderer getFov(Lnet/minecraft/client/Camera;FZ)D # getFov')) {
            throw new GradleException('Staged Veil AT did not remap GameRenderer.getFov canary')
        }
        if (!stagedAtReport.text.contains(
                'public net.minecraft.client.renderer.ItemInHandRenderer renderPlayerArm'
                        + '(Lcom/mojang/blaze3d/vertex/PoseStack;Lnet/minecraft/client/renderer/MultiBufferSource;'
                        + 'IFFLnet/minecraft/world/entity/HumanoidArm;)V # renderPlayerArm')) {
            throw new GradleException('Staged Veil AT did not remap ItemInHandRenderer.renderPlayerArm canary')
        }
        if (stagedAtReport.unresolvedKnownMembers != 0) {
            throw new GradleException(
                    "Staged Veil AT has unresolved known SRG members: ${stagedAtReport.unresolvedKnownMembers}"
            )
        }
        if (sourceAtReport.remappedMembers <= 0 || stagedAtReport.remappedMembers != 0) {
            throw new GradleException(
                    "Unexpected Veil AT remap counts: source remappable=${sourceAtReport.remappedMembers}, "
                            + "staged remappable=${stagedAtReport.remappedMembers}"
            )
        }

        def standaloneTargetAts = []
        ([createDevelopmentRuntime.get().asFile, ponderDevelopmentRuntime.get().asFile])
                .findAll { it.isFile() }
                .each { jar ->
                    try {
                        def report = VeilDevelopmentRuntimePatcher.inspectAccessTransformer(jar, mappingsFile)
                        standaloneTargetAts.add("${jar.name}: remappableNow=${report.remappedMembers}, "
                                + "unresolvedKnown=${report.unresolvedKnownMembers}")
                    } catch (IOException ignored) {
                        // No access transformer in this target artifact.
                    }
                }

        logger.lifecycle("Verified mapped Veil ${mappedArtifact.moduleVersion.id}")
        logger.lifecycle("  raw:    ${rawVeil} (${sha256(rawVeil)})")
        logger.lifecycle("  mapped: ${mappedVeil} (${sha256(mappedVeil)})")
        logger.lifecycle("  staged: ${stagedVeil} (${sha256(stagedVeil)})")
        logger.lifecycle("  Veil AT: entries=${stagedAtReport.memberEntries}, "
                + "remapped=${sourceAtReport.remappedMembers}, "
                + "remainingRemappable=${stagedAtReport.remappedMembers}, "
                + "unresolved=${stagedAtReport.unresolvedKnownMembers}; "
                + "CompositeRenderType m_173265_ -> state")
        if (!standaloneTargetAts.isEmpty()) {
            logger.lifecycle("  Other staged target AT scan: ${standaloneTargetAts}")
        }
    }
}

tasks.register('verifyStandaloneAccessTransformerNamespaces') {
    group = 'verification'
    description = 'Verifies staged standalone target-mod access transformers are remapped from SRG to userdev names.'
    dependsOn tasks.named('createSrgToMcp')
    dependsOn tasks.named('prepareCreateDevelopmentRuntime')
    dependsOn tasks.named('preparePonderDevelopmentRuntime')
    dependsOn tasks.named('prepareVeilDevelopmentRuntime')

    doLast {
        File mappingsFile = layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile
        if (!mappingsFile.isFile()) {
            throw new GradleException("Missing SRG->named mapping file for standalone AT verification: ${mappingsFile}")
        }

        def mappedRuntimeArtifact = { String artifactName, String expectedVersion ->
            String expectedMappedVersion = "${expectedVersion}_mapped_official_${forge_minecraft_version}"
            def artifact = configurations.targetRuntimeMapped.resolvedConfiguration.resolvedArtifacts.find {
                it.moduleVersion.id.group == 'local.target'
                        && it.name == artifactName
                        && it.moduleVersion.id.version == expectedMappedVersion
            }
            if (artifact == null) {
                throw new GradleException(
                        "Standalone AT verifier could not resolve mapped ${artifactName}:${expectedMappedVersion}"
                )
            }
            artifact.file
        }

        File sourceCreate = configurations.createRuntimeMapped.singleFile
        File sourcePonder = mappedRuntimeArtifact(
                "Ponder-Forge-${forge_minecraft_version}".toString(),
                forge_ponder_version.toString())
        File sourceVeil = configurations.veilRuntimeMapped.singleFile
        File stagedCreate = createDevelopmentRuntime.get().asFile
        File stagedPonder = ponderDevelopmentRuntime.get().asFile
        File stagedVeil = veilDevelopmentRuntime.get().asFile

        def checkAt = { String label, File source, File staged, int expectedRemapped ->
            def sourceReport = VeilDevelopmentRuntimePatcher.inspectAccessTransformer(source, mappingsFile)
            def stagedReport = VeilDevelopmentRuntimePatcher.inspectAccessTransformer(staged, mappingsFile)
            if (sourceReport.remappedMembers != expectedRemapped) {
                throw new GradleException(
                        "${label} source AT remappable count=${sourceReport.remappedMembers}, "
                                + "expected ${expectedRemapped}"
                )
            }
            if (stagedReport.remappedMembers != 0 || stagedReport.unresolvedKnownMembers != 0) {
                throw new GradleException(
                        "${label} staged AT still has remappable=${stagedReport.remappedMembers}, "
                                + "unresolvedKnown=${stagedReport.unresolvedKnownMembers}"
                )
            }
            [sourceReport, stagedReport]
        }

        def createReports = checkAt('Create', sourceCreate, stagedCreate, 28)
        def ponderReports = checkAt('Ponder', sourcePonder, stagedPonder, 5)
        def veilReports = checkAt('Veil', sourceVeil, stagedVeil, 31)

        String waxables = 'public-f net.minecraft.world.item.HoneycombItem WAXABLES # WAXABLES'
        if (!createReports[1].text.contains(waxables)
                || createReports[1].text.contains('HoneycombItem f_150863_')) {
            throw new GradleException('Staged Create AT did not remap HoneycombItem.WAXABLES correctly')
        }

        def stagedMods = [
                'Create': stagedCreate,
                'Ponder': stagedPonder,
                'Veil': stagedVeil
        ]
        stagedMods.each { label, jar ->
            def report = VeilDevelopmentRuntimePatcher.inspectAccessTransformer(jar, mappingsFile)
            if (report.remappedMembers != 0 || report.unresolvedKnownMembers != 0) {
                throw new GradleException(
                        "${label} staged AT has stale known SRG members: remappable=${report.remappedMembers}, "
                                + "unresolvedKnown=${report.unresolvedKnownMembers}"
                )
            }
        }

        logger.lifecycle("Verified staged standalone AT namespaces: "
                + "Create 28->0, Ponder 5->0, Veil 31->0; "
                + "HoneycombItem f_150863_ -> WAXABLES")
    }
}

def readClassStructure = { InputStream rawInput ->
    DataInputStream input = new DataInputStream(new BufferedInputStream(rawInput))
    if (input.readInt() != 0xCAFEBABE as int) {
        throw new GradleException('Invalid class-file magic')
    }
    input.readUnsignedShort()
    input.readUnsignedShort()

    int constantPoolCount = input.readUnsignedShort()
    String[] utf8 = new String[constantPoolCount]
    for (int index = 1; index < constantPoolCount; index++) {
        int tag = input.readUnsignedByte()
        switch (tag) {
            case 1:
                utf8[index] = input.readUTF()
                break
            case 3:
            case 4:
                input.readInt()
                break
            case 5:
            case 6:
                input.readLong()
                index++
                break
            case 7:
            case 8:
            case 16:
            case 19:
            case 20:
                input.readUnsignedShort()
                break
            case 9:
            case 10:
            case 11:
            case 12:
            case 17:
            case 18:
                input.readUnsignedShort()
                input.readUnsignedShort()
                break
            case 15:
                input.readUnsignedByte()
                input.readUnsignedShort()
                break
            default:
                throw new GradleException("Unsupported class-file constant-pool tag ${tag}")
        }
    }

    int classAccess = input.readUnsignedShort()
    input.readUnsignedShort()
    input.readUnsignedShort()
    int interfaceCount = input.readUnsignedShort()
    interfaceCount.times { input.readUnsignedShort() }

    def readMembers = {
        int memberCount = input.readUnsignedShort()
        def members = [:]
        memberCount.times {
            int access = input.readUnsignedShort()
            String name = utf8[input.readUnsignedShort()]
            String descriptor = utf8[input.readUnsignedShort()]
            members["${name}${descriptor}"] = access
            int attributeCount = input.readUnsignedShort()
            attributeCount.times {
                input.readUnsignedShort()
                long length = Integer.toUnsignedLong(input.readInt())
                input.skipNBytes(length)
            }
        }
        members
    }

    [access: classAccess, fields: readMembers(), methods: readMembers()]
}

tasks.register('verifyForgeAccessTransformer') {
    group = 'verification'
    description = 'Validates curated Forge AT provenance and transformed 1.20.1 class members.'
    dependsOn prepareTargetModpackDependencies
    dependsOn tasks.named('createMcpToSrg')

    doLast {
        File upstreamAt = rootProject.file('common/src/main/resources/META-INF/accesstransformer.cfg')
        File curatedAt = file('src/main/resources/META-INF/accesstransformer-forge.cfg')
        File provenance = rootProject.file('ACCESS_TRANSFORMER_BACKPORT_MATRIX.md')
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile

        String provenanceText = provenance.getText('UTF-8')
        def upstreamRows = upstreamAt.readLines('UTF-8')
                .collect { it.trim() }
                .findAll { it && !it.startsWith('#') }
        def missingProvenance = upstreamRows.findAll { !provenanceText.contains("`${it}`") }
        if (!missingProvenance.isEmpty()) {
            throw new GradleException("AT entries missing provenance rows: ${missingProvenance}")
        }

        def mappings = [:]
        String currentClass = null
        mappingsFile.eachLine('UTF-8') { line ->
            if (!line.startsWith('\t')) {
                def parts = line.trim().split(/\s+/)
                if (parts.length >= 2 && parts[0] != 'tsrg2') {
                    currentClass = parts[0]
                    mappings[currentClass] = [fields: [:], methods: [:]]
                }
            } else if (currentClass != null && !line.startsWith('\t\t')) {
                def parts = line.trim().split(/\s+/)
                if (parts.length == 2) {
                    mappings[currentClass].fields[parts[1]] = parts[0]
                } else if (parts.length == 3 && parts[1].startsWith('(')) {
                    mappings[currentClass].methods["${parts[2]}${parts[1]}"] = parts[0]
                }
            }
        }

        def forgeArtifacts = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'net.minecraftforge' && artifact.name == 'forge'
        }
        if (forgeArtifacts.size() != 1) {
            throw new GradleException("Expected one mapped Forge artifact, found ${forgeArtifacts*.moduleVersion*.id}")
        }

        File mappedForge = forgeArtifacts.first().file.canonicalFile
        JarFile forgeJar = new JarFile(mappedForge)
        try {
            curatedAt.readLines('UTF-8').collect { it.trim() }.findAll { it && !it.startsWith('#') }.each { row ->
                def parts = row.split(/\s+/)
                String modifier = parts[0]
                String className = parts[1].replace('.', '/')
                String member = parts.length > 2 ? parts[2] : null
                def classEntry = forgeJar.getJarEntry("${className}.class")
                if (classEntry == null) {
                    throw new GradleException("AT class is absent from mapped Forge: ${className}")
                }

                def structure
                forgeJar.getInputStream(classEntry).withCloseable { stream ->
                    structure = readClassStructure(stream)
                }
                if ((structure.access & 0x0001) == 0) {
                    throw new GradleException("AT class was not made public: ${className}")
                }
                if (member == null) {
                    return
                }

                String officialName
                String descriptor
                Map targetMembers
                if (member.contains('(')) {
                    int descriptorStart = member.indexOf('(')
                    String srgName = member.substring(0, descriptorStart)
                    descriptor = member.substring(descriptorStart)
                    officialName = srgName == '<init>' ? srgName : mappings[className]?.methods["${srgName}${descriptor}"]
                    targetMembers = structure.methods
                } else {
                    descriptor = null
                    officialName = mappings[className]?.fields[member]
                    targetMembers = structure.fields
                }
                if (officialName == null) {
                    throw new GradleException("AT member has no exact 1.20.1 mapping: ${row}")
                }

                def matches = targetMembers.findAll { key, ignored ->
                    if (descriptor != null) {
                        return key == "${officialName}${descriptor}"
                    }
                    if (!key.startsWith(officialName)) {
                        return false
                    }
                    String fieldDescriptor = key.substring(officialName.length())
                    fieldDescriptor ==~ /\[*([BCDFIJSZ]|L.*;)/
                }
                if (matches.size() != 1) {
                    throw new GradleException("AT member does not resolve uniquely in mapped Forge: ${row} -> ${matches.keySet()}")
                }
                int access = matches.values().first() as int
                if ((access & 0x0001) == 0) {
                    throw new GradleException("AT member was not made public: ${row}")
                }
                if (modifier.contains('-f') && (access & 0x0010) != 0) {
                    throw new GradleException("AT member is still final: ${row}")
                }
            }
        } finally {
            forgeJar.close()
        }

        def localArtifacts = configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'local.target'
        }
        def createArtifact = localArtifacts.find { it.name == "create-${forge_minecraft_version}" }
        def ponderArtifact = localArtifacts.find { it.name == "Ponder-Forge-${forge_minecraft_version}" }
        if (createArtifact == null || ponderArtifact == null) {
            throw new GradleException('Mapped Create/Ponder artifacts are absent from compileClasspath')
        }
        JarFile createJar = new JarFile(createArtifact.file)
        try {
            String obsoleteClass = 'com/simibubi/create/foundation/utility/worldWrappers/WrappedServerWorld.class'
            if (createJar.getJarEntry(obsoleteClass) != null) {
                throw new GradleException("Create ${forge_create_version} unexpectedly retains ${obsoleteClass}")
            }
        } finally {
            createJar.close()
        }
        JarFile ponderJar = new JarFile(ponderArtifact.file)
        try {
            String wrappedClass = 'net/createmod/catnip/levelWrappers/WrappedServerLevel.class'
            if (ponderJar.getJarEntry(wrappedClass) == null) {
                throw new GradleException("Ponder ${forge_ponder_version} lacks ${wrappedClass}")
            }
        } finally {
            ponderJar.close()
        }

        logger.lifecycle("Verified ${curatedAt.readLines().findAll { it.trim() }.size()} Forge AT entries in ${mappedForge}")
        logger.lifecycle('Verified Ponder 1.0.91 WrappedServerLevel boundary and obsolete Create wrapper absence')
    }
}

