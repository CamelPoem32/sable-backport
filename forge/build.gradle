def sha256 = { File file ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) >= 0) {
            if (read > 0) {
                digest.update(buffer, 0, read)
            }
        }
    }
    digest.digest().collect { String.format('%02X', it & 0xFF) }.join()
}

def sha256Bytes = { byte[] bytes ->
    MessageDigest digest = MessageDigest.getInstance('SHA-256')
    digest.update(bytes)
    digest.digest().collect { String.format('%02X', it & 0xFF) }.join()
}

def prepareTargetModpackDependencies = tasks.register('prepareTargetModpackDependencies') {
    group = 'forge backport'
    description = 'Validates the exact Create JarJar inventory and stages four mapped target-modpack modules.'

    inputs.file(targetCreateJar)
    outputs.dir(targetModpackRepository)

    doLast {
        if (!targetCreateJar.isFile()) {
            throw new GradleException("Missing target Create jar: ${targetCreateJar}")
        }

        def createSpec = expectedTargetArtifacts.create
        if (sha256(targetCreateJar) != createSpec.sha256) {
            throw new GradleException("Unexpected SHA-256 for ${targetCreateJar.name}")
        }

        File repositoryDir = targetModpackRepository.get().asFile
        project.delete(repositoryDir)
        if (!repositoryDir.mkdirs() && !repositoryDir.isDirectory()) {
            throw new GradleException("Unable to create target dependency repository: ${repositoryDir}")
        }

        JarFile createJar = new JarFile(targetCreateJar)
        try {
            String implementationVersion = createJar.manifest?.mainAttributes?.getValue('Implementation-Version')
            if (implementationVersion != createSpec.version) {
                throw new GradleException("Expected Create ${createSpec.version}, found ${implementationVersion}")
            }
            String builtOnMinecraft = createJar.manifest?.mainAttributes?.getValue('Built-On-Minecraft')
            if (builtOnMinecraft != forge_minecraft_version) {
                throw new GradleException(
                        "Expected Create built for Minecraft ${forge_minecraft_version}, found ${builtOnMinecraft}"
                )
            }

            def modsEntry = createJar.getJarEntry('META-INF/mods.toml')
            if (modsEntry == null) {
                throw new GradleException('Create jar does not contain META-INF/mods.toml')
            }
            String createMetadata
            createJar.getInputStream(modsEntry).withCloseable { input ->
                createMetadata = input.getText('UTF-8')
            }
            [
                    'modId = "create"',
                    'version = "6.0.8"',
                    'modId = "flywheel"',
                    'versionRange = "[1.0.0,2.0)"',
                    'modId = "ponder"',
                    'versionRange = "[0.8,)"'
            ].each { expectedLine ->
                if (!createMetadata.contains(expectedLine)) {
                    throw new GradleException("Create metadata lacks exact baseline line: ${expectedLine}")
                }
            }

            Files.copy(
                    targetCreateJar.toPath(),
                    new File(repositoryDir, createSpec.file).toPath(),
                    StandardCopyOption.REPLACE_EXISTING
            )

            def metadataEntry = createJar.getJarEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('Create jar does not contain META-INF/jarjar/metadata.json')
            }

            def metadata
            createJar.getInputStream(metadataEntry).withCloseable { input ->
                metadata = new JsonSlurper().parse(input)
            }

            def expectedEmbedded = expectedTargetArtifacts.findAll { key, ignored -> key != 'create' }
            expectedEmbedded.putAll(expectedCreateLibraries)
            if (metadata.jars.size() != expectedEmbedded.size()) {
                throw new GradleException(
                        "Expected ${expectedEmbedded.size()} Create JarJar entries, found ${metadata.jars.size()}"
                )
            }

            expectedEmbedded.each { key, spec ->
                def embedded = metadata.jars.find { jar ->
                    jar.identifier.group == spec.group && jar.identifier.artifact == spec.artifact
                }
                if (embedded == null) {
                    throw new GradleException("Create jar does not contain ${spec.group}:${spec.artifact}")
                }
                if (embedded.version.artifactVersion != spec.version) {
                    throw new GradleException(
                            "Expected ${spec.artifact} ${spec.version}, found ${embedded.version.artifactVersion}"
                    )
                }
                if (embedded.version.range != spec.range || embedded.path != spec.path ||
                        embedded.isObfuscated != spec.obfuscated) {
                    throw new GradleException(
                            "Unexpected JarJar metadata for ${spec.group}:${spec.artifact}: ${embedded}"
                    )
                }

                def embeddedEntry = createJar.getJarEntry(embedded.path as String)
                if (embeddedEntry == null) {
                    throw new GradleException("Missing embedded jar entry: ${embedded.path}")
                }

                byte[] embeddedBytes
                createJar.getInputStream(embeddedEntry).withCloseable { input ->
                    embeddedBytes = input.readAllBytes()
                }
                if (sha256Bytes(embeddedBytes) != spec.sha256) {
                    throw new GradleException("Unexpected SHA-256 for embedded ${embedded.path}")
                }
                if (spec.nestedPath != null) {
                    byte[] nestedBytes = null
                    new ZipInputStream(new ByteArrayInputStream(embeddedBytes)).withCloseable { nestedJar ->
                        def nestedEntry
                        while ((nestedEntry = nestedJar.nextEntry) != null) {
                            if (nestedEntry.name == spec.nestedPath) {
                                nestedBytes = nestedJar.readAllBytes()
                                break
                            }
                        }
                    }
                    if (nestedBytes == null || sha256Bytes(nestedBytes) != spec.nestedSha256) {
                        throw new GradleException("Unexpected nested payload ${spec.nestedPath}")
                    }
                }
                if (spec.file != null) {
                    Files.write(new File(repositoryDir, spec.file).toPath(), embeddedBytes)
                }
            }
        } finally {
            createJar.close()
        }

        expectedTargetArtifacts.each { key, spec ->
            logger.lifecycle("Staged ${spec.group}:${spec.artifact}:${spec.version} (${spec.sha256})")
        }
        expectedCreateLibraries.each { key, spec ->
            logger.lifecycle("Validated embedded ${spec.group}:${spec.artifact}:${spec.version} (${spec.sha256})")
            if (spec.nestedPath != null) {
                logger.lifecycle("Validated nested ${spec.nestedPath} (${spec.nestedSha256})")
            }
        }
    }
}

