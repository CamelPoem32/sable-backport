tasks.register('verifyM13ContraptionMixinTargets') {
    group = 'forge backport'
    description = 'Verifies M13 Create 6.0.8 mixin targets exist with their mapped and production descriptors.'
    dependsOn tasks.named('prepareCreateDevelopmentRuntime')

    inputs.file(createDevelopmentRuntime)
    inputs.file(targetCreateJar)
    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/compatibility/create/contraptions/AbstractContraptionEntityMixin.java'))
    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/compatibility/create/contraptions/ControlledContraptionEntityMixin.java'))

    doLast {
        File mappedCreateJar = createDevelopmentRuntime.get().asFile
        if (!mappedCreateJar.isFile()) {
            throw new GradleException("Missing mapped Create 6.0.8 runtime for M13 mixin target verification: ${mappedCreateJar}")
        }
        if (!targetCreateJar.isFile()) {
            throw new GradleException("Missing production Create 6.0.8 jar for M13 mixin target verification: ${targetCreateJar}")
        }

        String targetClass = 'com/simibubi/create/content/contraptions/AbstractContraptionEntity.class'
        def expectedMapped = [
                'contraptionInitialize()V',
                'remove(Lnet/minecraft/world/entity/Entity$RemovalReason;)V',
                'moveCollidedEntitiesOnDisassembly(Lcom/simibubi/create/content/contraptions/StructureTransform;)V',
                'toLocalVector(Lnet/minecraft/world/phys/Vec3;F)Lnet/minecraft/world/phys/Vec3;'
        ] as Set
        def expectedProduction = [
                'contraptionInitialize()V',
                'm_8119_()V',
                'm_142687_(Lnet/minecraft/world/entity/Entity$RemovalReason;)V',
                'moveCollidedEntitiesOnDisassembly(Lcom/simibubi/create/content/contraptions/StructureTransform;)V',
                'toLocalVector(Lnet/minecraft/world/phys/Vec3;F)Lnet/minecraft/world/phys/Vec3;'
        ] as Set

        def readMethods = { File jarPath, Set<String> expected, String label ->
            JarFile jarFile = new JarFile(jarPath)
            try {
                def entry = jarFile.getJarEntry(targetClass)
                if (entry == null) {
                    throw new GradleException("${label} Create jar is missing ${targetClass}")
                }
                def structure = jarFile.getInputStream(entry).withCloseable { stream -> readClassStructure(stream) }
                def actual = structure.methods.keySet() as Set
                expected.each { method ->
                    if (!actual.contains(method)) {
                        throw new GradleException("${label} Create 6.0.8 target lacks ${method}; actual methods were ${actual}")
                    }
                }
                structure
            } finally {
                jarFile.close()
            }
        }

        readMethods(mappedCreateJar, expectedMapped, 'mapped-dev')
        def productionStructure = readMethods(targetCreateJar, expectedProduction, 'production')
        if (productionStructure.methods.containsKey('tick()V')) {
            throw new GradleException('Production Create 6.0.8 AbstractContraptionEntity unexpectedly exposes tick()V; verify the target artifact before changing M13 injection names')
        }

        String controlledTargetClass = 'com/simibubi/create/content/contraptions/ControlledContraptionEntity.class'
        def expectedControlled = [
                'tickContraption()V',
                'getController()Lcom/simibubi/create/content/contraptions/IControlContraption;',
                'setAngle(F)V',
                'getRotationState()Lcom/simibubi/create/content/contraptions/AbstractContraptionEntity$ContraptionRotationState;',
                'applyLocalTransforms(Lcom/mojang/blaze3d/vertex/PoseStack;F)V'
        ] as Set
        [mappedCreateJar: mappedCreateJar, production: targetCreateJar].each { label, jarPath ->
            JarFile jarFile = new JarFile(jarPath)
            try {
                def entry = jarFile.getJarEntry(controlledTargetClass)
                if (entry == null) {
                    throw new GradleException("${label} Create jar is missing ${controlledTargetClass}")
                }
                def structure = jarFile.getInputStream(entry).withCloseable { stream -> readClassStructure(stream) }
                def actual = structure.methods.keySet() as Set
                expectedControlled.each { method ->
                    if (!actual.contains(method)) {
                        throw new GradleException("${label} Create 6.0.8 ControlledContraptionEntity lacks ${method}; actual methods were ${actual}")
                    }
                }
            } finally {
                jarFile.close()
            }
        }

        String mixinText = rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/compatibility/create/contraptions/AbstractContraptionEntityMixin.java').getText('UTF-8')
        String controlledMixinText = rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/compatibility/create/contraptions/ControlledContraptionEntityMixin.java').getText('UTF-8')
        if (mixinText.contains('@Inject(method = "tick"')) {
            throw new GradleException('M13 mixin still targets AbstractContraptionEntity#tick; production Create uses obfuscated m_8119_() and initialization belongs at contraptionInitialize()')
        }
        [
                '@Inject(method = "contraptionInitialize", at = @At("HEAD"))',
                '@Inject(method = {"remove", "m_142687_"}, at = @At("HEAD"), remap = false)',
                'moveCollidedEntitiesOnDisassembly',
                'toLocalVector'
        ].each { canary ->
            if (!mixinText.contains(canary)) {
                throw new GradleException("M13 mixin target declaration lost canary: ${canary}")
            }
        }
        [
                '@Redirect(method = "tickContraption"',
                '@Redirect(method = "getController"',
                'Level;isLoaded',
                'Level;getBlockEntity'
        ].each { canary ->
            if (!controlledMixinText.contains(canary)) {
                throw new GradleException("M13 controlled contraption mixin target declaration lost canary: ${canary}")
            }
        }

        logger.lifecycle('verifyM13ContraptionMixinTargets PASS: Create 6.0.8 mapped-dev and production '
                + 'AbstractContraptionEntity and ControlledContraptionEntity expose all M13 target methods/descriptors; no inherited tick target remains')
    }
}

