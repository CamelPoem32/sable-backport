                .replace('/tags/block/', '/tags/blocks/')
                .replace('/tags/entity_type/', '/tags/entity_types/')
                .replace('/tags/item/', '/tags/items/')
                .replace('/structure/', '/structures/')
        details.path = remapped
    }
    filesMatching(['data/sable/tags/block/*.json', 'data/sable/tags/blocks/*.json']) {
        filter { line ->
            line.replace('"#c:storage_blocks"', '"#forge:storage_blocks"')
                    .replace('"#c:glass_panes"', '"#forge:glass_panes"')
                    .replace('"#c:fence_gates"', '"#forge:fence_gates"')
                    .replace('"#c:chests/wooden"', '"#forge:chests/wooden"')
                    .replace('"#c:stones"', '"#forge:stone"')
                    .replace('"#c:cobblestones"', '"#forge:cobblestone"')
                    .replace('"#c:clusters"', '{ "id": "#c:clusters", "required": false }')
                    .replace('"minecraft:heavy_core"', '{ "id": "minecraft:heavy_core", "required": false }')
                    .replace('"minecraft:tuff_slab"', '{ "id": "minecraft:tuff_slab", "required": false }')
        }
