tasks.register('verifyRapierBackportStatic') {
    group = 'verification'
    description = 'Compiles and verifies the isolated Java 17 Rapier backport staging boundary.'
    dependsOn tasks.named('rapierBackportClasses')

    doLast {
        File rapierJavaRoot = rootProject.file('sable_rapier/src/main/java')
        File rapierResourcesRoot = rootProject.file('sable_rapier/src/main/resources')
        File companionClassesRoot = project(':sable_companion_1_20').sourceSets.main.output.classesDirs.singleFile
        String physicsProviderService = 'META-INF/services/dev.ryanhcode.sable.api.physics.PhysicsPipelineProvider'
        String rapierProvider = 'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipelineProvider'
        String rapierProviderClass = rapierProvider.replace('.', '/') + '.class'
        File nativePayload = new File(rapierResourcesRoot, 'natives/sable_rapier/sable_rapier_binaries.zip.l4z')

        def sourceFiles = fileTree(rapierJavaRoot).matching { include '**/*.java' }.files.sort()
        if (sourceFiles.size() != 14) {
            throw new GradleException("Expected 14 staged Rapier Java source files, found ${sourceFiles.size()}")
        }

        def forbiddenSourcePatterns = [
                ~/case\s+final\s+/,
                ~/\bSequenced(Collection|Map|Set)?\b/,
                ~/\.reversed\s*\(/,
                ~/\.getFirst\s*\(/,
                ~/\.getLast\s*\(/,
                ~/\.removeFirst\s*\(/,
                ~/\.removeLast\s*\(/
        ]
        def java21Hits = []
        def neoforgeHits = []
        sourceFiles.each { sourceFile ->
            String relative = rapierJavaRoot.toPath().relativize(sourceFile.toPath()).toString().replace('\\', '/')
            String text = sourceFile.getText('UTF-8')
            forbiddenSourcePatterns.each { pattern ->
                def matcher = text =~ pattern
                if (matcher.find()) {
                    java21Hits << "${relative}: ${matcher.group()}"
                }
            }
            def platformMatcher = text =~ /\b(net\.neoforged|NeoForge|neoforge)\b/
            if (platformMatcher.find()) {
                neoforgeHits << "${relative}: ${platformMatcher.group()}"
            }
        }
        if (!java21Hits.isEmpty()) {
            throw new GradleException("Java 21-only Rapier source constructs remain: ${java21Hits}")
        }
        if (!neoforgeHits.isEmpty()) {
            throw new GradleException("NeoForge-only references remain in staged Rapier Java: ${neoforgeHits}")
        }
        if (rapierLz4Jar == null || !rapierLz4Jar.isFile()) {
            throw new GradleException("Cached at.yawk.lz4:lz4-java:1.11.0 jar is missing; checked ${rapierLz4JarCandidates}")
        }
        String rapierLz4Sha = sha256(rapierLz4Jar)
        if (rapierLz4Sha != rapierLz4Sha256) {
            throw new GradleException("Unexpected at.yawk.lz4:lz4-java:1.11.0 SHA-256: ${rapierLz4Sha}")
        }

        def rapierClassFiles = sourceSets.rapierBackport.output.classesDirs.files.collectMany { classesDir ->
            if (!classesDir.isDirectory()) {
                return []
            }
            fileTree(classesDir).matching { include '**/*.class' }.files.collect { classFile ->
                [root: classesDir, file: classFile]
            }
        }
        if (!rapierClassFiles.any { row ->
            row.root.toPath().relativize(row.file.toPath()).toString().replace('\\', '/') == rapierProviderClass
        }) {
            throw new GradleException("Staged Rapier provider class is missing: ${rapierProviderClass}")
        }
        def incompatibleRapierClasses = rapierClassFiles.findAll { row ->
            byte[] bytes = Files.readAllBytes(row.file.toPath())
            if (bytes.length < 8) {
                throw new GradleException("Staged Rapier class has no class header: ${row.file}")
            }
            int major = ((bytes[6] & 0xFF) << 8) | (bytes[7] & 0xFF)
            major != 61
        }.collect { row -> row.root.toPath().relativize(row.file.toPath()).toString().replace('\\', '/') }
        if (!incompatibleRapierClasses.isEmpty()) {
            throw new GradleException("Staged Rapier classes are not Java 17 major 61: ${incompatibleRapierClasses}")
        }

        File stagedService = new File(sourceSets.rapierBackport.output.resourcesDir, physicsProviderService)
        if (!stagedService.isFile()) {
            throw new GradleException("Staged Rapier service descriptor is missing: ${stagedService}")
        }
        def serviceProviders = stagedService.getText('UTF-8')
                .readLines()
                .collect { it.trim() }
                .findAll { !it.isEmpty() && !it.startsWith('#') }
        if (serviceProviders != [rapierProvider]) {
            throw new GradleException("Unexpected staged Rapier service descriptor providers: ${serviceProviders}")
        }

        File providerApiSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/api/physics/PhysicsPipelineProvider.java')
        File rapierProviderSource = new File(rapierJavaRoot, 'dev/ryanhcode/sable/physics/impl/rapier/RapierPhysicsPipelineProvider.java')
        File staticProviderSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/physics/impl/none/StaticPhysicsPipelineProvider.java')
        if (!providerApiSource.getText('UTF-8').contains('int value() default 1000;')) {
            throw new GradleException('PhysicsPipelineProvider default priority is no longer 1000')
        }
        if (!rapierProviderSource.getText('UTF-8').contains('@PhysicsPipelineProvider.LoadPriority()')) {
            throw new GradleException('RapierPhysicsPipelineProvider no longer uses default priority 1000')
        }
        if (!staticProviderSource.getText('UTF-8').contains('@PhysicsPipelineProvider.LoadPriority(900)')) {
            throw new GradleException('StaticPhysicsPipelineProvider no longer declares fallback priority 900')
        }

        if (!nativePayload.isFile()) {
            throw new GradleException("Opaque Rapier native payload is missing: ${nativePayload}")
        }
        File stagedNativePayload = new File(sourceSets.rapierBackport.output.resourcesDir, 'natives/sable_rapier/sable_rapier_binaries.zip.l4z')
        if (!stagedNativePayload.isFile()) {
            throw new GradleException("Staged Rapier native payload is missing: ${stagedNativePayload}")
        }
        if (sha256(nativePayload) != sha256(stagedNativePayload)) {
            throw new GradleException('Staged Rapier native payload differs from upstream opaque payload')
        }

        def packagesInClassRoots = { Collection<File> roots ->
            roots.collectMany { classesDir ->
                if (!classesDir.isDirectory()) {
                    return []
                }
                fileTree(classesDir).matching { include '**/*.class' }.files.collect { classFile ->
                    String relative = classesDir.toPath().relativize(classFile.toPath()).toString().replace('\\', '/')
                    int slash = relative.lastIndexOf('/')
                    slash < 0 ? '<default>' : relative.substring(0, slash).replace('/', '.')
                }
            }.toSet()
        }
        def rapierPackages = packagesInClassRoots(sourceSets.rapierBackport.output.classesDirs.files)
        def mainPackages = packagesInClassRoots(sourceSets.main.output.classesDirs.files)
        def companionPackages = packagesInClassRoots([companionClassesRoot])
        def mainSplit = rapierPackages.intersect(mainPackages).sort()
        def companionSplit = rapierPackages.intersect(companionPackages).sort()
        if (!mainSplit.isEmpty()) {
            throw new GradleException("Staged Rapier and outer Sable share Java packages: ${mainSplit}")
        }
        if (!companionSplit.isEmpty()) {
            throw new GradleException("Staged Rapier and Companion share Java packages: ${companionSplit}")
        }

        def rapierOutputRoots = (sourceSets.rapierBackport.output.classesDirs.files
                + [sourceSets.rapierBackport.output.resourcesDir])
                .findAll { it != null }
                .collect { it.canonicalFile }
                .toSet()
        def mainOutputLeaks = sourceSets.main.output.files
                .collect { it.canonicalFile }
                .findAll { rapierOutputRoots.contains(it) }
        if (!mainOutputLeaks.isEmpty()) {
            throw new GradleException("Rapier staging output leaked into sourceSets.main output: ${mainOutputLeaks}")
        }
        def mainRuntimeDependencyLeaks = configurations.runtimeClasspath.dependencies.findAll { dependency ->
            String marker = "${dependency.group}:${dependency.name}:${dependency.version}".toLowerCase(Locale.ROOT)
            marker.contains('sable_rapier') || marker.contains('rapierbackport')
        }
        if (!mainRuntimeDependencyLeaks.isEmpty()) {
            throw new GradleException("Rapier staging dependency leaked into main runtimeClasspath: ${mainRuntimeDependencyLeaks}")
        }
        def mainSourceRoots = sourceSets.main.java.srcDirs.collect { it.canonicalFile }.toSet()
        if (mainSourceRoots.contains(rapierJavaRoot.canonicalFile)) {
            throw new GradleException('Rapier Java root is attached to sourceSets.main')
        }
        def mainRapierClasses = sourceSets.main.output.classesDirs.files.findAll { classesDir ->
            new File(classesDir, rapierProviderClass).exists()
        }
        if (!mainRapierClasses.isEmpty()) {
            throw new GradleException("Rapier provider leaked into sourceSets.main output: ${mainRapierClasses}")
        }

        logger.lifecycle("verifyRapierBackportStatic PASS: rapierSources=${sourceFiles.size()}, "
                + "rapierClasses=${rapierClassFiles.size()}, providerPriority=1000, "
                + "staticFallbackPriority=900, nativePayload=${nativePayload.length()} bytes, "
                + "splitPackages=0")
    }
}

tasks.register('verifyRapierNativeBackportStatic') {
    group = 'verification'
    description = 'Statically verifies the upstream Rapier native payload, JNI symbol surface, and packaging boundary.'

    doLast {
        File rapierJavaRoot = rootProject.file('sable_rapier/src/main/java')
        File rapierRustRoot = rootProject.file('sable_rapier/src/main/rust')
        File rapierResourcesRoot = rootProject.file('sable_rapier/src/main/resources')
        File nativePayload = new File(rapierResourcesRoot, 'natives/sable_rapier/sable_rapier_binaries.zip.l4z')
        File nativeReadme = new File(rapierResourcesRoot, 'natives/sable_rapier/README.md')
        File rapierLicense = new File(rapierResourcesRoot, 'natives/sable_rapier/LICENSE-RAPIER')
        File sableLicense = rootProject.file('LICENSE.md')
        File rapier3DSource = new File(rapierJavaRoot, 'dev/ryanhcode/sable/physics/impl/rapier/Rapier3D.java')
        File rapierCargo = new File(rapierRustRoot, 'rapier/Cargo.toml')
        File rustToolchain = new File(rapierRustRoot, 'rust-toolchain.toml')
        File cargoLock = new File(rapierRustRoot, 'Cargo.lock')
        String nativePrefix = 'Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_'
        String archiveResourcePath = '/natives/sable_rapier/sable_rapier_binaries.zip.l4z'
        def expectedNativeFiles = [
                'sable_rapier_x86_64_windows.dll',
                'sable_rapier_aarch64_windows.dll',
                'sable_rapier_x86_64_linux.so',
                'sable_rapier_aarch64_linux.so',
                'sable_rapier_x86_64_macos.dylib',
                'sable_rapier_aarch64_macos.dylib'
        ]

        if (!nativePayload.isFile()) {
            throw new GradleException("Rapier native payload is missing: ${nativePayload}")
        }
        if (rapierLz4Jar == null || !rapierLz4Jar.isFile()) {
            throw new GradleException("Cached at.yawk.lz4:lz4-java:1.11.0 jar is missing; checked ${rapierLz4JarCandidates}")
        }

        def readNativeArchive = {
            URLClassLoader loader = new URLClassLoader([rapierLz4Jar.toURI().toURL()] as URL[], (ClassLoader) null)
            try {
                Class<?> lz4InputType = loader.loadClass('net.jpountz.lz4.LZ4FrameInputStream')
                InputStream fileInput = Files.newInputStream(nativePayload.toPath())
                InputStream lz4Input = (InputStream) lz4InputType
                        .getConstructor(InputStream)
                        .newInstance(fileInput)
                Map<String, byte[]> entries = new LinkedHashMap<>()
                try (ZipInputStream zipInput = new ZipInputStream(lz4Input)) {
                    ZipEntry entry
                    while ((entry = zipInput.nextEntry) != null) {
                        if (entry.directory) {
                            continue
                        }
                        ByteArrayOutputStream output = new ByteArrayOutputStream()
                        byte[] buffer = new byte[8192]
                        int read
                        while ((read = zipInput.read(buffer)) >= 0) {
                            if (read > 0) {
                                output.write(buffer, 0, read)
                            }
                        }
                        if (entries.put(entry.name, output.toByteArray()) != null) {
                            throw new GradleException("Duplicate native archive entry: ${entry.name}")
                        }
                    }
                }
                return entries
            } finally {
                loader.close()
            }
        }

        def nativeEntries = readNativeArchive()
        if ((nativeEntries.keySet() as Set) != (expectedNativeFiles as Set)) {
            throw new GradleException(
                    "Unexpected Rapier native archive entries. expected=${expectedNativeFiles}, actual=${nativeEntries.keySet().sort()}"
            )
        }

        String rapier3DText = rapier3DSource.getText('UTF-8')
        Set<String> javaNativeMethods = new TreeSet<>()
        def nativeLines = rapier3DText.readLines().findAll { it.contains(' native ') }
        nativeLines.each { String line ->
            def matcher = line =~ /\bnative\s+[A-Za-z0-9_<>\[\].?]+\s+([A-Za-z0-9_]+)\s*\(/
            if (!matcher.find()) {
                throw new GradleException("Could not parse Rapier3D native declaration: ${line}")
            }
            javaNativeMethods.add(matcher.group(1))
        }
        int rawNativeKeywordCount = nativeLines.size()
        if (javaNativeMethods.size() != rawNativeKeywordCount) {
            throw new GradleException(
                    "Rapier3D native method parser found ${javaNativeMethods.size()} static natives, "
                            + "but source contains ${rawNativeKeywordCount} native keywords"
            )
        }
        if (javaNativeMethods.size() != 53) {
            throw new GradleException("Expected 53 Rapier3D native methods, found ${javaNativeMethods.size()}: ${javaNativeMethods}")
        }

        Set<String> expectedJniExports = javaNativeMethods.collect { ("${nativePrefix}${it}").toString() } as Set
        String rustSourceText = fileTree(new File(rapierRustRoot, 'rapier/src'))
                .matching { include '**/*.rs' }
                .files
                .sort()
                .collect { it.getText('UTF-8') }
                .join('\n')
        Set<String> rustJniExports = new TreeSet<>()
        (rustSourceText =~ /Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_[A-Za-z0-9_]+/)
                .each { match -> rustJniExports.add(match.toString()) }
        def missingRustExports = expectedJniExports - rustJniExports
        def unexpectedRustExports = rustJniExports.findAll { it.startsWith(nativePrefix) && !expectedJniExports.contains(it) }.sort()
        if (!missingRustExports.isEmpty()) {
            throw new GradleException("Rust source is missing JNI exports: ${missingRustExports.sort()}")
        }
        if (!unexpectedRustExports.isEmpty()) {
            throw new GradleException("Rust source declares unexpected Sable Rapier JNI exports: ${unexpectedRustExports}")
        }
        def receiverMismatches = []
        expectedJniExports.each { String exportName ->
            def signatureMatcher = rustSourceText =~ /(?s)pub\s+extern\s+"system"\s+fn\s+${java.util.regex.Pattern.quote(exportName)}(?:<[^>]+>)?\s*\((.*?)\)\s*(?:->|\{)/
            if (!signatureMatcher.find()) {
                receiverMismatches << "${exportName}: signature not found"
                return
            }
            String params = signatureMatcher.group(1)
                    .replace('\r', '')
                    .replace('\n', ' ')
                    .replaceAll(/\s+/, ' ')
            if (!(params =~ /^\s*(?:mut\s+)?_?env\s*:\s*JNIEnv(?:<[^>]+>)?\s*,\s*_class\s*:\s*JClass(?:<[^>]+>)?\s*,/).find()) {
                receiverMismatches << "${exportName}: ${params}"
            }
        }
        if (!receiverMismatches.isEmpty()) {
            throw new GradleException(
                    "Rapier3D Java natives are static, but Rust JNI receiver signatures are unexpected: ${receiverMismatches}"
            )
        }

        def extractJniSymbols = { byte[] bytes ->
            StringBuilder current = new StringBuilder()
            Set<String> symbols = new TreeSet<>()
            Set<String> unexpected = new TreeSet<>()
            def expectedByLength = expectedJniExports.sort { a, b -> b.length() <=> a.length() }
            def flush = {
                if (current.length() >= nativePrefix.length()) {
                    String text = current.toString()
                    int start = text.indexOf(nativePrefix)
                    while (start >= 0) {
                        String tail = text.substring(start)
                        String matched = expectedByLength.find { tail.startsWith(it) }
                        if (matched != null) {
                            symbols.add(matched)
                        } else {
                            def matcher = tail =~ /Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_[A-Za-z0-9_]+/
                            if (matcher.find()) {
                                unexpected.add(matcher.group(0))
                            }
                        }
                        start = text.indexOf(nativePrefix, start + nativePrefix.length())
                    }
                }
                current.setLength(0)
            }
            bytes.each { byte raw ->
                int value = raw & 0xFF
                if (value >= 32 && value <= 126) {
                    current.append((char) value)
                } else {
                    flush()
                }
            }
            flush()
            [expected: symbols, unexpected: unexpected]
        }

        def binaryCoverage = [:]
        nativeEntries.each { name, bytes ->
            def scan = extractJniSymbols(bytes)
            def symbols = scan.expected
            def missing = (expectedJniExports - symbols).sort()
            def unexpected = scan.unexpected.sort()
            if (!missing.isEmpty()) {
                throw new GradleException("${name} is missing JNI exports: ${missing}")
            }
            if (!unexpected.isEmpty()) {
                throw new GradleException("${name} contains unexpected Sable Rapier JNI exports: ${unexpected}")
            }
            binaryCoverage[name] = [
                    size   : bytes.length,
                    sha256 : sha256Bytes(bytes),
                    exports: symbols.intersect(expectedJniExports).size()
            ]
        }

        def requiredLoaderSnippets = [
                "private static final String NATIVE_DIR = \".sable/natives\";",
                "private static final String LIB_ZIP_NAME = \"sable_rapier_binaries.zip.l4z\";",
                "private static final String LIB_NAME = \"sable_rapier\";",
                "Rapier3D.class.getResourceAsStream(\"/natives/\" + LIB_NAME + \"/\" + LIB_ZIP_NAME)",
                "System.getProperty(\"os.arch\").equals(\"arm\") || System.getProperty(\"os.arch\").startsWith(\"aarch64\")",
                "LIB_NAME + \"_\" + arch + \"_windows.dll\"",
                "LIB_NAME + \"_\" + arch + \"_macos.dylib\"",
                "LIB_NAME + \"_\" + arch + \"_linux.so\"",
                "Sable.LOGGER.error(\"Unknown platform",
                'Files.copy(ti, tempFile, StandardCopyOption.REPLACE_EXISTING)',
                "System.load(tempFile.toAbsolutePath().toString())"
        ]
        def missingLoaderSnippets = requiredLoaderSnippets.findAll { !rapier3DText.contains(it) }
        if (!missingLoaderSnippets.isEmpty()) {
            throw new GradleException("Rapier native loader no longer matches the audited static shape: ${missingLoaderSnippets}")
        }

        if (!sableLicense.isFile()) {
            throw new GradleException("Sable license is missing: ${sableLicense}")
        }
        if (!rapierLicense.isFile()) {
            throw new GradleException("Rapier native license is missing: ${rapierLicense}")
        }
        if (!nativeReadme.isFile() || !nativeReadme.getText('UTF-8').contains('LICENSE-RAPIER')) {
            throw new GradleException("Rapier native README/provenance is missing LICENSE-RAPIER guidance")
        }
        if (!rapierCargo.getText('UTF-8').contains('rev = "38e92f117590862481a53df6fc69a5d893e29186"')) {
            throw new GradleException('Rapier Cargo.toml no longer pins the expected Rapier git revision')
        }
        if (!rapierCargo.getText('UTF-8').contains('"simd-nightly"')
                || !rapierCargo.getText('UTF-8').contains('"parallel"')) {
            throw new GradleException('Rapier Cargo.toml no longer enables the expected Rapier features')
        }
        if (!rustToolchain.getText('UTF-8').contains('nightly-2026-01-29')) {
            throw new GradleException('Rapier Rust toolchain no longer pins nightly-2026-01-29')
        }
        if (!cargoLock.getText('UTF-8').contains('git+https://github.com/ryanhcode/rapier?rev=38e92f117590862481a53df6fc69a5d893e29186')) {
            throw new GradleException('Cargo.lock no longer records the expected pinned Rapier source')
        }

        String physicsProviderService = 'META-INF/services/dev.ryanhcode.sable.api.physics.PhysicsPipelineProvider'
        File rapierService = new File(rapierResourcesRoot, physicsProviderService)
        File staticService = rootProject.file("common/src/main/resources/${physicsProviderService}")
        if (rapierService.getText('UTF-8').trim() != 'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipelineProvider') {
            throw new GradleException("Unexpected Rapier service descriptor: ${rapierService.getText('UTF-8')}")
        }
        if (!staticService.getText('UTF-8').contains('dev.ryanhcode.sable.physics.impl.none.StaticPhysicsPipelineProvider')
                || staticService.getText('UTF-8').contains('RapierPhysicsPipelineProvider')) {
            throw new GradleException('Final common service descriptor has already switched to Rapier or lost Static fallback ownership')
        }
        if (sourceSets.main.java.srcDirs.collect { it.canonicalFile }.contains(rapierJavaRoot.canonicalFile)) {
            throw new GradleException('Rapier Java root is unexpectedly attached to sourceSets.main')
        }
        def duplicateNativePayloads = fileTree(rootProject.projectDir).matching {
            include '**/sable_rapier_binaries.zip.l4z'
            exclude '**/build/**'
            exclude '**/.gradle/**'
        }.files.collect { it.canonicalFile }.unique()
        if (duplicateNativePayloads != [nativePayload.canonicalFile]) {
            throw new GradleException("Unexpected Rapier native payload owners: ${duplicateNativePayloads}")
        }
        def forbiddenBundledModResources = fileTree(rapierResourcesRoot).matching {
            include '**/*.jar'
        }.files.findAll { File resource ->
            String name = resource.name.toLowerCase(Locale.ROOT)
            name.contains('create') || name.contains('flywheel') || name.contains('ponder') || name.contains('veil')
        }
        if (!forbiddenBundledModResources.isEmpty()) {
            throw new GradleException("Rapier resources unexpectedly bundle target runtime mods: ${forbiddenBundledModResources}")
        }

        logger.lifecycle('verifyRapierNativeBackportStatic inventory:')
        expectedNativeFiles.each { name ->
            def row = binaryCoverage[name]
            logger.lifecycle("  ${name} size=${row.size} sha256=${row.sha256} jniExports=${row.exports}/${javaNativeMethods.size()}")
        }
        logger.lifecycle("verifyRapierNativeBackportStatic PASS: archiveSha256=${sha256(nativePayload)}, "
                + "archiveBytes=${nativePayload.length()}, nativeFiles=${nativeEntries.size()}, "
                + "javaNativeMethods=${javaNativeMethods.size()}, rustJniExports=${rustJniExports.size()}, "
                + "loaderResource=${archiveResourcePath}, extractionDir=.sable/natives, "
                + "rapierRevision=38e92f117590862481a53df6fc69a5d893e29186, "
                + "rustToolchain=nightly-2026-01-29, serviceRuntimeStillStatic=true")
    }
}

tasks.register('jarRapierBackportLibrary') {
    group = 'forge backport'
    description = 'Packages the isolated Java 17 Rapier backport classes/resources as a named intermediate common library.'

    outputs.file(rapierBackportNamedJar)

    doLast {
        File providerClass = sourceSets.rapierBackport.output.classesDirs.files
                .collect { new File(it, 'dev/ryanhcode/sable/physics/impl/rapier/RapierPhysicsPipelineProvider.class') }
                .find { it.isFile() }
        if (providerClass == null) {
            throw new GradleException(
                    'Rapier backport classes are missing; run :forge:verifyRapierBackportStatic when ForgeGradle infrastructure is available'
            )
        }
        File serviceDescriptor = new File(
                sourceSets.rapierBackport.output.resourcesDir,
                'META-INF/services/dev.ryanhcode.sable.api.physics.PhysicsPipelineProvider')
        if (!serviceDescriptor.isFile()) {
            throw new GradleException("Rapier backport service descriptor is missing: ${serviceDescriptor}")
        }

        File outputJar = rapierBackportNamedJar.get().asFile
        outputJar.parentFile.mkdirs()
        def entries = [:]
        (sourceSets.rapierBackport.output.classesDirs.files + [sourceSets.rapierBackport.output.resourcesDir])
                .findAll { it != null && it.isDirectory() }
                .each { root ->
                    fileTree(root).files.each { file ->
                        String relative = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                        if (relative in [
                                'META-INF/mods.toml',
                                'META-INF/neoforge.mods.toml',
                                'META-INF/accesstransformer.cfg',
                                'fabric.mod.json'
                        ]) {
                            return
                        }
                        if (entries.containsKey(relative)) {
                            throw new GradleException("Duplicate Rapier library entry while packaging ${relative}")
                        }
                        entries[relative] = Files.readAllBytes(file.toPath())
                    }
                }
        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputJar)))
        try {
            entries.keySet().sort().each { name ->
                ZipEntry outputEntry = new ZipEntry(name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                output.write(entries[name])
                output.closeEntry()
            }
        } finally {
            output.close()
        }
        logger.lifecycle("jarRapierBackportLibrary PASS: ${outputJar.name} entries=${entries.size()}")
    }
}

tasks.register('remapRapierBackportJarToProduction') {
    group = 'forge backport'
    description = 'Maps the isolated Rapier common library from named/userdev bytecode to Forge production SRG namespace.'
    dependsOn tasks.named('jarRapierBackportLibrary')
    dependsOn tasks.named('createMcpToSrg')

    inputs.file(rapierBackportNamedJar)
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    outputs.file(rapierBackportProductionJar)

    doLast {
        File namedJar = rapierBackportNamedJar.get().asFile
        File productionJar = rapierBackportProductionJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        if (!namedJar.isFile()) {
            throw new GradleException("Named Rapier backport jar is missing: ${namedJar}")
        }
        if (!mappingsFile.isFile()) {
            throw new GradleException("Rapier production remap requires ${mappingsFile}")
        }
        def result = RapierProductionJarMapper.mapNamedToProduction(namedJar, mappingsFile, productionJar)
        if (!result.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    "Rapier production jar still contains named Minecraft member references: "
                            + result.namedMinecraftMemberReferences.take(20)
            )
        }
        if (result.minecraftReferenceOwners.isEmpty() || result.productionMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    'Rapier production remap did not prove any Minecraft member references; namespace check would be vacuous'
            )
        }
        logger.lifecycle("remapRapierBackportJarToProduction PASS: inputSha256=${result.inputSha256}, "
                + "outputSha256=${result.outputSha256}, transformedClasses=${result.transformedClasses}, "
                + "memberReferenceRemaps=${result.memberReferenceRemaps}, "
                + "handleReferenceRemaps=${result.invokedynamicHandleRemaps}, "
                + "minecraftOwners=${result.minecraftReferenceOwners.size()}, "
                + "productionMemberRefs=${result.productionMinecraftMemberReferences.size()}")
    }
}

tasks.register('packageRapierIntoFinalForgeArtifact') {
    group = 'forge backport'
    description = 'Nests the production Rapier library and its LZ4 runtime dependency into the existing final Sable all-jar.'
    dependsOn tasks.named('reobfJarJar')
    dependsOn tasks.named('remapRapierBackportJarToProduction')

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(rapierBackportProductionJar)
    inputs.file(rapierLz4Jar ?: file('missing-lz4-java-1.11.0.jar'))
    outputs.upToDateWhen { false }

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File rapierJar = rapierBackportProductionJar.get().asFile
        if (!finalJar.isFile()) {
            throw new GradleException(
                    "M8.3 packaging requires the already-built final Sable all-jar: ${finalJar}"
            )
        }
        if (!rapierJar.isFile()) {
            throw new GradleException("Production Rapier nested jar is missing: ${rapierJar}")
        }
        if (rapierLz4Jar == null || !rapierLz4Jar.isFile()) {
            throw new GradleException("Cached at.yawk.lz4:lz4-java:${rapierLz4Version} jar is missing")
        }
        if (sha256(rapierLz4Jar) != rapierLz4Sha256) {
            throw new GradleException("Unexpected LZ4 runtime jar SHA-256: ${sha256(rapierLz4Jar)}")
        }

        File tempJar = new File(finalJar.parentFile, finalJar.name + '.m8.3.tmp')
        def entries = [:]
        def metadata = null
        ZipInputStream input = new ZipInputStream(new BufferedInputStream(new FileInputStream(finalJar)))
        try {
            def entry
            while ((entry = input.nextEntry) != null) {
                if (entry.directory) {
                    continue
                }
                byte[] contents = input.readAllBytes()
                if (entry.name == rapierBackportJarJarPath || entry.name == rapierLz4JarJarPath) {
                    continue
                }
                if (entry.name == 'META-INF/jarjar/metadata.json') {
                    metadata = new JsonSlurper().parseText(new String(contents, 'UTF-8'))
                    continue
                }
                entries[entry.name] = contents
            }
        } finally {
            input.close()
        }
        if (metadata == null) {
            throw new GradleException('Final Sable all-jar is missing META-INF/jarjar/metadata.json')
        }

        metadata.jars.removeAll { row ->
            (row.identifier.group == rapierBackportGroup && row.identifier.artifact == rapierBackportArtifact)
                    || (row.identifier.group == 'at.yawk.lz4' && row.identifier.artifact == 'lz4-java')
        }
        metadata.jars << [
                identifier  : [group: rapierBackportGroup, artifact: rapierBackportArtifact],
                version     : [range: "[${version},)", artifactVersion: version.toString()],
                path        : rapierBackportJarJarPath,
                isObfuscated: true
        ]
        metadata.jars << [
                identifier  : [group: 'at.yawk.lz4', artifact: 'lz4-java'],
                version     : [range: "[${rapierLz4Version},)", artifactVersion: rapierLz4Version],
                path        : rapierLz4JarJarPath,
                isObfuscated: false
        ]

        entries['META-INF/jarjar/metadata.json'] = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(metadata)).getBytes('UTF-8')
        entries[rapierBackportJarJarPath] = Files.readAllBytes(rapierJar.toPath())
        entries[rapierLz4JarJarPath] = Files.readAllBytes(rapierLz4Jar.toPath())

        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempJar)))
        try {
            entries.keySet().sort().each { name ->
                ZipEntry outputEntry = new ZipEntry(name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                output.write(entries[name])
                output.closeEntry()
            }
        } finally {
            output.close()
        }
        Files.move(tempJar.toPath(), finalJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("packageRapierIntoFinalForgeArtifact PASS: nested ${rapierBackportJarJarPath} "
                + "and ${rapierLz4JarJarPath} into ${finalJar.name}")
    }
}

tasks.register('verifyRapierPackagedArtifact') {
    group = 'verification'
    description = 'Verifies M8.3 Rapier JarJar packaging, provider selection, namespace, native ownership, and dependency boundary.'
    dependsOn tasks.named('packageRapierIntoFinalForgeArtifact')

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File rapierJar = rapierBackportProductionJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        String physicsProviderService = 'META-INF/services/dev.ryanhcode.sable.api.physics.PhysicsPipelineProvider'
        String rapierProvider = 'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipelineProvider'
        String staticProvider = 'dev.ryanhcode.sable.physics.impl.none.StaticPhysicsPipelineProvider'
        String rapierProviderClass = rapierProvider.replace('.', '/') + '.class'
        String staticProviderClass = staticProvider.replace('.', '/') + '.class'
        String nativePayloadPath = 'natives/sable_rapier/sable_rapier_binaries.zip.l4z'

        def readNestedJar = { JarFile outer, String path ->
            def nestedEntry = outer.getJarEntry(path)
            if (nestedEntry == null) {
                throw new GradleException("Final artifact is missing nested jar ${path}")
            }
            byte[] nestedBytes = outer.getInputStream(nestedEntry).readAllBytes()
            def nestedEntries = [:]
            new java.util.jar.JarInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nested ->
                def entry
                while ((entry = nested.nextJarEntry) != null) {
                    if (!entry.directory) {
                        nestedEntries[entry.name] = nested.readAllBytes()
                    }
                }
            }
            [bytes: nestedBytes, entries: nestedEntries]
        }
        def providersFrom = { byte[] bytes ->
            new String(bytes, 'UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() && !it.startsWith('#') }
        }
        def packageOf = { String classEntry ->
            int slash = classEntry.lastIndexOf('/')
            slash < 0 ? '<default>' : classEntry.substring(0, slash).replace('/', '.')
        }
        def classPackages = { Collection<String> entries ->
            entries.findAll { it.endsWith('.class') }.collect { packageOf(it) }.toSet()
        }
        def containsAnyText = { Map<String, byte[]> entries, List<String> needles ->
            entries.findAll { name, bytes ->
                if (!name.endsWith('.class')) {
                    return false
                }
                String text = new String(bytes, StandardCharsets.ISO_8859_1)
                needles.any { text.contains(it) }
            }.keySet().sort()
        }

        JarFile outer = new JarFile(finalJar)
        try {
            def outerEntries = outer.entries().toList()
            def outerEntryNames = outerEntries.collect { it.name }
            def metadataEntry = outer.getJarEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('Final artifact is missing JarJar metadata')
            }
            def metadata = new JsonSlurper().parse(outer.getInputStream(metadataEntry))
            def nestedRows = metadata.jars ?: []
            def rapierRows = nestedRows.findAll { row ->
                row.identifier.group == rapierBackportGroup && row.identifier.artifact == rapierBackportArtifact
            }
            if (rapierRows.size() != 1 || rapierRows[0].path != rapierBackportJarJarPath
                    || rapierRows[0].version.artifactVersion != version.toString()
                    || rapierRows[0].isObfuscated != true) {
                throw new GradleException("Unexpected Rapier JarJar metadata row: ${rapierRows}")
            }
            def lz4Rows = nestedRows.findAll { row ->
                row.identifier.group == 'at.yawk.lz4' && row.identifier.artifact == 'lz4-java'
            }
            if (lz4Rows.size() != 1 || lz4Rows[0].path != rapierLz4JarJarPath
                    || lz4Rows[0].version.artifactVersion != rapierLz4Version
                    || lz4Rows[0].isObfuscated != false) {
                throw new GradleException("Unexpected LZ4 JarJar metadata row: ${lz4Rows}")
            }
            if (nestedRows.findAll { it.identifier.group == 'dev.ryanhcode.sable-companion' }.size() != 1) {
                throw new GradleException('Companion JarJar metadata row is no longer exactly one')
            }
            if (nestedRows.findAll { it.identifier.group == 'io.github.llamalad7'
                    && it.identifier.artifact == 'mixinextras-forge' }.size() != 1) {
                throw new GradleException('MixinExtras JarJar metadata row is no longer exactly one')
            }
            def forbiddenRows = nestedRows.findAll { row ->
                String coordinates = "${row.identifier.group}:${row.identifier.artifact}:${row.version.artifactVersion}".toLowerCase(Locale.ROOT)
                coordinates.contains('create') || coordinates.contains('flywheel')
                        || coordinates.contains('ponder') || coordinates.contains('registrate')
                        || coordinates.contains('veil')
            }
            if (!forbiddenRows.isEmpty()) {
                throw new GradleException("Target runtime dependency was bundled into Sable: ${forbiddenRows}")
            }

            def rapierNested = readNestedJar(outer, rapierBackportJarJarPath)
            def lz4Nested = readNestedJar(outer, rapierLz4JarJarPath)
            def companionRow = nestedRows.find { it.identifier.group == 'dev.ryanhcode.sable-companion' }
            def companionNested = readNestedJar(outer, companionRow.path as String)

            def outerClasses = outerEntryNames.findAll {
                it.endsWith('.class') && !it.startsWith('META-INF/jarjar/')
            }
            def rapierClasses = rapierNested.entries.keySet().findAll { it.endsWith('.class') }.sort()
            if (rapierClasses.size() != 16) {
                throw new GradleException("Expected 16 Rapier classes, found ${rapierClasses.size()}: ${rapierClasses}")
            }
            if (!rapierNested.entries.containsKey(rapierProviderClass)) {
                throw new GradleException("Nested Rapier jar is missing provider class ${rapierProviderClass}")
            }
            if (outerClasses.contains(rapierProviderClass)
                    || outerClasses.any { it.startsWith('dev/ryanhcode/sable/physics/impl/rapier/') }) {
                throw new GradleException('Rapier classes leaked into the outer Sable jar')
            }
            if (outer.getJarEntry(staticProviderClass) == null) {
                throw new GradleException("Outer Sable jar is missing static fallback provider ${staticProviderClass}")
            }
            if (companionNested.entries.keySet().any { it.startsWith('dev/ryanhcode/sable/physics/impl/rapier/') }) {
                throw new GradleException('Rapier classes leaked into nested Companion jar')
            }
            if (rapierNested.entries.keySet().any { it.startsWith('dev/ryanhcode/sable/companion/') }) {
                throw new GradleException('Companion classes leaked into nested Rapier jar')
            }
            if (rapierNested.entries.containsKey('META-INF/mods.toml')
                    || rapierNested.entries.containsKey('META-INF/neoforge.mods.toml')) {
                throw new GradleException('Nested Rapier library unexpectedly contains mod metadata')
            }

            def outerServiceEntry = outer.getJarEntry(physicsProviderService)
            if (outerServiceEntry == null) {
                throw new GradleException("Outer Sable jar is missing ${physicsProviderService}")
            }
            def outerProviders = providersFrom(outer.getInputStream(outerServiceEntry).readAllBytes())
            if (outerProviders != [staticProvider]) {
                throw new GradleException("Unexpected outer physics providers: ${outerProviders}")
            }
            if (!rapierNested.entries.containsKey(physicsProviderService)) {
                throw new GradleException('Nested Rapier jar is missing physics provider service descriptor')
            }
            def rapierProviders = providersFrom(rapierNested.entries[physicsProviderService])
            if (rapierProviders != [rapierProvider]) {
                throw new GradleException("Unexpected nested Rapier physics providers: ${rapierProviders}")
            }
            def effectiveProviders = (outerProviders + rapierProviders).toSet()
            if (effectiveProviders != ([staticProvider, rapierProvider] as Set)) {
                throw new GradleException("Unexpected effective physics provider set: ${effectiveProviders}")
            }
            File providerApiSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/api/physics/PhysicsPipelineProvider.java')
            File rapierProviderSource = rootProject.file('sable_rapier/src/main/java/dev/ryanhcode/sable/physics/impl/rapier/RapierPhysicsPipelineProvider.java')
            File staticProviderSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/physics/impl/none/StaticPhysicsPipelineProvider.java')
            if (!providerApiSource.getText('UTF-8').contains('.stream().max(Comparator.comparingInt')) {
                throw new GradleException('Physics provider selection is no longer max-priority based')
            }
            if (!rapierProviderSource.getText('UTF-8').contains('@PhysicsPipelineProvider.LoadPriority()')
                    || !providerApiSource.getText('UTF-8').contains('int value() default 1000;')) {
                throw new GradleException('Rapier provider priority 1000 is no longer statically proven')
            }
            if (!staticProviderSource.getText('UTF-8').contains('@PhysicsPipelineProvider.LoadPriority(900)')) {
                throw new GradleException('Static fallback priority 900 is no longer statically proven')
            }

            def nativeOwners = []
            if (outer.getJarEntry(nativePayloadPath) != null) {
                nativeOwners << 'outer'
            }
            if (rapierNested.entries.containsKey(nativePayloadPath)) {
                nativeOwners << 'rapier'
            }
            if (companionNested.entries.containsKey(nativePayloadPath)) {
                nativeOwners << 'companion'
            }
            if (nativeOwners != ['rapier']) {
                throw new GradleException("Rapier native archive owners were ${nativeOwners}, expected [rapier]")
            }
            if (sha256Bytes(rapierNested.entries[nativePayloadPath]) != rapierNativeSha256) {
                throw new GradleException("Unexpected nested Rapier native archive SHA-256: "
                        + sha256Bytes(rapierNested.entries[nativePayloadPath]))
            }
            def extractedNativeLeaks = (outerEntryNames + rapierNested.entries.keySet()
                    + companionNested.entries.keySet()).findAll { entry ->
                entry ==~ /(?i).*\.(dll|so|dylib)$/
            }
            if (!extractedNativeLeaks.isEmpty()) {
                throw new GradleException("Extracted Rapier/Sable native binary leaked outside the native archive: ${extractedNativeLeaks}")
            }

            if (!lz4Nested.entries.containsKey('net/jpountz/lz4/LZ4FrameInputStream.class')) {
                throw new GradleException('Nested LZ4 runtime jar does not contain LZ4FrameInputStream')
            }
            if (sha256Bytes(lz4Nested.bytes) != rapierLz4Sha256) {
                throw new GradleException("Nested LZ4 runtime jar SHA mismatch: ${sha256Bytes(lz4Nested.bytes)}")
            }
            def jpountzLeaks = (outerClasses + rapierClasses + companionNested.entries.keySet()).findAll {
                it.startsWith('net/jpountz/')
            }
            if (!jpountzLeaks.isEmpty()) {
                throw new GradleException("LZ4 classes leaked outside nested LZ4 jar: ${jpountzLeaks}")
            }

            def mavenRuntimeHits = containsAnyText(rapierNested.entries, ['org/apache/maven', 'org.apache.maven'])
            if (!mavenRuntimeHits.isEmpty()) {
                throw new GradleException("Rapier runtime bytecode still references Maven Artifact classes: ${mavenRuntimeHits}")
            }
            if (nestedRows.any { row -> "${row.identifier.group}:${row.identifier.artifact}".contains('maven') }) {
                throw new GradleException('Maven Artifact was unexpectedly packaged at runtime')
            }

            def outerPackages = classPackages(outerClasses)
            def companionPackages = classPackages(companionNested.entries.keySet())
            def rapierPackages = classPackages(rapierClasses)
            def splitPackages = [
                    'outer/companion': outerPackages.intersect(companionPackages).sort(),
                    'outer/rapier'   : outerPackages.intersect(rapierPackages).sort(),
                    'companion/rapier': companionPackages.intersect(rapierPackages).sort()
            ].findAll { ignored, packages -> !packages.isEmpty() }
            if (!splitPackages.isEmpty()) {
                throw new GradleException("Package split between nested libraries and outer Sable: ${splitPackages}")
            }

            def devLeaks = (outerEntryNames + rapierNested.entries.keySet() + companionNested.entries.keySet()).findAll { entry ->
                entry.contains('build/classes') || entry.contains('build/resources')
                        || entry.contains('.gradle/') || entry.endsWith('.java')
            }
            if (!devLeaks.isEmpty()) {
                throw new GradleException("Development output/source leaked into packaged artifact: ${devLeaks}")
            }

            if (sha256Bytes(rapierNested.bytes) != sha256(rapierJar)) {
                throw new GradleException('Nested Rapier jar bytes differ from remapped production Rapier jar output')
            }
            def referenceReport = RapierProductionJarMapper.referenceReport(rapierJar, mappingsFile)
            if (referenceReport.minecraftReferenceOwners.isEmpty()
                    || referenceReport.productionMinecraftMemberReferences.isEmpty()
                    || !referenceReport.namedMinecraftMemberReferences.isEmpty()) {
                throw new GradleException("Rapier production namespace verification failed: "
                        + "owners=${referenceReport.minecraftReferenceOwners.size()}, "
                        + "productionRefs=${referenceReport.productionMinecraftMemberReferences.size()}, "
                        + "namedRefs=${referenceReport.namedMinecraftMemberReferences.take(20)}")
            }

            logger.lifecycle("verifyRapierPackagedArtifact PASS: nested=${rapierBackportGroup}:${rapierBackportArtifact}:${version}, "
                    + "rapierClasses=${rapierClasses.size()}, productionMinecraftRefs="
                    + "${referenceReport.productionMinecraftMemberReferences.size()}, nativeSha256=${rapierNativeSha256}, "
                    + "lz4=${rapierLz4JarJarPath}, mavenArtifactRuntime=false, providers=[Rapier:1000, Static:900], "
                    + "winner=${rapierProvider}, splitPackages=0")
        } finally {
            outer.close()
        }
    }
}

tasks.named('processM6SableRunResources') {
    dependsOn tasks.named('processResources')
}

tasks.register('verifyRunClientClasspath') {
    group = 'verification'
    description = 'Verifies the exact Create 6 target runtime and the retained optional-linkage boundary.'
    dependsOn tasks.named('classes')
    dependsOn project(':sable_companion_1_20').tasks.named('classes')
    dependsOn prepareCreateDevelopmentRuntime
    dependsOn prepareVeilDevelopmentRuntime

    doLast {
        Set<File> runtimeFiles = sourceSets.main.runtimeClasspath.files.collect { it.canonicalFile } as Set
        def containsEntry = { File classpathEntry, String entry ->
            if (classpathEntry.isDirectory()) {
                return new File(classpathEntry, entry).isFile()
            }
            if (!classpathEntry.isFile() || !classpathEntry.name.endsWith('.jar')) {
                return false
            }
            JarFile jar = new JarFile(classpathEntry)
            try {
                return jar.getJarEntry(entry) != null
            } finally {
                jar.close()
            }
        }

        def requireEntry = { String entry ->
            if (!runtimeFiles.any { containsEntry(it, entry) }) {
                throw new GradleException("runClient runtime classpath is missing ${entry}")
            }
        }

        requireEntry('dev/ryanhcode/sable/companion/SableCompanion.class')
        requireEntry('dev/ryanhcode/sable/companion/impl/DefaultSableCompanion.class')
        requireEntry('META-INF/services/dev.ryanhcode.sable.companion.SableCompanion')
        requireEntry('dev/ryanhcode/sable/ActiveSableCompanion.class')
        requireEntry('foundry/veil/api/client/render/VeilRenderSystem.class')
        requireEntry('gg/moonflower/molangcompiler/api/MolangCompiler.class')
        requireEntry('imgui/glfw/ImGuiImplGlfw.class')

        String companionService = 'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion'
        Set<String> companionProviders = [] as Set
        runtimeFiles.each { classpathEntry ->
            if (classpathEntry.isDirectory()) {
                File descriptor = new File(classpathEntry, companionService)
                if (descriptor.isFile()) {
                    companionProviders.addAll(descriptor.readLines('UTF-8').collect { it.trim() }.findAll { it })
                }
            } else if (classpathEntry.isFile() && classpathEntry.name.endsWith('.jar')) {
                JarFile jar = new JarFile(classpathEntry)
                try {
                    def descriptor = jar.getJarEntry(companionService)
                    if (descriptor != null) {
                        companionProviders.addAll(jar.getInputStream(descriptor).getText('UTF-8')
                                .readLines().collect { it.trim() }.findAll { it })
                    }
                } finally {
                    jar.close()
                }
            }
        }
        Set<String> expectedCompanionProviders = [
                'dev.ryanhcode.sable.ActiveSableCompanion',
                'dev.ryanhcode.sable.companion.impl.DefaultSableCompanion'
        ] as Set
        if (companionProviders != expectedCompanionProviders) {
            throw new GradleException("Unexpected runClient Companion providers: ${companionProviders}")
        }
        File forgeCompanionDescriptor = new File(sourceSets.main.output.resourcesDir, companionService)
        Set<String> forgeCompanionProviders = forgeCompanionDescriptor.readLines('UTF-8')
                .collect { it.trim() }.findAll { it } as Set
        if (forgeCompanionProviders != expectedCompanionProviders) {
            throw new GradleException(
                    "Forge-visible Companion descriptor is not merged deterministically: ${forgeCompanionProviders}"
            )
        }

        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        def artifactIds = artifacts.collect {
            "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}"
        }
        File patchedCreate = createDevelopmentRuntime.get().asFile.canonicalFile
        if (!runtimeFiles.contains(patchedCreate)) {
            throw new GradleException('Filtered mapped Create 6.0.8 is absent from runClient runtimeClasspath')
        }
        def leakedCreateFiles = runtimeFiles.findAll { runtimeFile ->
            runtimeFile.name.toLowerCase(Locale.ROOT).contains("create-${forge_minecraft_version}")
                    && runtimeFile.canonicalFile != patchedCreate
        }
        if (!leakedCreateFiles.isEmpty()) {
            throw new GradleException("Raw or unfiltered Create artifact leaked onto runClient: ${leakedCreateFiles}")
        }
        File patchedVeil = veilDevelopmentRuntime.get().asFile.canonicalFile
        if (!runtimeFiles.any { it.canonicalFile == patchedVeil }) {
            throw new GradleException('Patched mapped Veil 1.20 is absent from runClient runtimeClasspath')
        }
        if (runtimeFiles.any { it.name.contains('Veil-forge-1.20.1') && it.canonicalFile != patchedVeil }) {
            throw new GradleException('Unpatched Veil artifact leaked onto runClient runtimeClasspath')
        }
        JarFile patchedVeilJar = new JarFile(patchedVeil)
        try {
            if (patchedVeilJar.entries().any { it.name.startsWith('org/lwjgl/') && it.name.endsWith('.class') }) {
                throw new GradleException('Filtered Veil development runtime still contains split-package LWJGL classes')
            }
        } finally {
            patchedVeilJar.close()
        }
        Map<String, String> expectedRuntimeModules = [
                ("flywheel-forge-${forge_minecraft_version}".toString()) : forge_flywheel_version.toString(),
                ("Ponder-Forge-${forge_minecraft_version}".toString())    : forge_ponder_version.toString()
        ]
        def targetRuntimeArtifacts = artifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'local.target'
        }
        if ((targetRuntimeArtifacts.collect { it.name } as Set) != expectedRuntimeModules.keySet()) {
            throw new GradleException(
                    "Expected exact target runtime modules ${expectedRuntimeModules.keySet()}, resolved "
                            + "${targetRuntimeArtifacts.collect { it.moduleVersion.id }}"
            )
        }
        File targetRepository = targetModpackRepository.get().asFile.canonicalFile
        targetRuntimeArtifacts.each { artifact ->
            String expectedVersion = expectedRuntimeModules[artifact.name]
            String resolvedVersion = artifact.moduleVersion.id.version
            String expectedMappedVersion = "${expectedVersion}_mapped_official_${forge_minecraft_version}"
            File resolvedFile = artifact.file.canonicalFile
            if (resolvedVersion != expectedMappedVersion) {
                throw new GradleException(
                        "Unexpected mapped runtime version for ${artifact.name}: ${artifact.moduleVersion.id}; "
                                + "expected ${expectedMappedVersion}"
                )
            }
            if (resolvedFile.toPath().startsWith(targetRepository.toPath())) {
                throw new GradleException("Raw target artifact leaked onto runClient runtimeClasspath: ${resolvedFile}")
            }
            if (!runtimeFiles.contains(resolvedFile)) {
                throw new GradleException("Mapped target artifact is absent from sourceSets.main.runtimeClasspath: ${resolvedFile}")
            }
        }
        def obsoleteArtifacts = artifactIds.findAll { coordinate ->
            coordinate.contains(':create-1.20.1:0.5.1.j') ||
                    coordinate.contains(':flywheel-forge-1.20.1:0.6.11-13')
        }
        def obsoleteFiles = runtimeFiles.findAll { runtimeFile ->
            runtimeFile.name.contains('0.5.1.j') || runtimeFile.name.contains('0.6.11-13')
        }
        if (!obsoleteArtifacts.isEmpty() || !obsoleteFiles.isEmpty()) {
            throw new GradleException(
                    "Obsolete Create/Flywheel runtime detected: artifacts=${obsoleteArtifacts}, files=${obsoleteFiles}"
            )
        }

        requireEntry('com/simibubi/create/Create.class')
        requireEntry('dev/engine_room/flywheel/api/visualization/VisualizationManager.class')
        requireEntry('net/createmod/catnip/levelWrappers/WrappedServerLevel.class')

        JarFile mappedCreateJar = new JarFile(patchedCreate)
        try {
            def jarJarMetadataEntry = mappedCreateJar.getJarEntry('META-INF/jarjar/metadata.json')
            if (jarJarMetadataEntry == null) {
                throw new GradleException('Filtered mapped Create runtime lacks JarJar metadata')
            }
            def createJarJarMetadata = new JsonSlurper().parse(
                    mappedCreateJar.getInputStream(jarJarMetadataEntry))
            Set<String> actualNestedCoordinates = createJarJarMetadata.jars.collect { nested ->
                "${nested.identifier.group}:${nested.identifier.artifact}:${nested.version.artifactVersion}".toString()
            } as Set
            Set<String> expectedNestedCoordinates = [
                    "${expectedTargetArtifacts.registrate.group}:${expectedTargetArtifacts.registrate.artifact}:${expectedTargetArtifacts.registrate.version}",
                    "${expectedTargetArtifacts.flywheel.group}:${expectedTargetArtifacts.flywheel.artifact}:${expectedTargetArtifacts.flywheel.version}",
                    "${expectedTargetArtifacts.ponder.group}:${expectedTargetArtifacts.ponder.artifact}:${expectedTargetArtifacts.ponder.version}"
            ] as Set
            if (actualNestedCoordinates != expectedNestedCoordinates) {
                throw new GradleException(
                        "Filtered Create JarJar inventory differs from the exact development baseline: "
                                + "${actualNestedCoordinates}"
                )
            }
            if (mappedCreateJar.getJarEntry(expectedCreateLibraries.mixinextras.path) != null) {
                throw new GradleException('Create MixinExtras 0.4.1 wrapper remains in the development runtime')
            }
            String registratePath = expectedTargetArtifacts.registrate.path
            def registrateEntry = mappedCreateJar.getJarEntry(registratePath)
            if (registrateEntry == null) {
                throw new GradleException("Mapped Create runtime is missing nested ${registratePath}")
            }
            byte[] registrateBytes = mappedCreateJar.getInputStream(registrateEntry).readAllBytes()
            String mappedRegistrateHash = 'AB90001E9EC42922DA4E499CDAFF6D7F1F6E78432CE71555397931804E94E5FB'
            if (sha256Bytes(registrateBytes) != mappedRegistrateHash) {
                throw new GradleException("Mapped Create runtime has an unexpected nested Registrate payload")
            }
            ZipInputStream registrateZip = new ZipInputStream(new ByteArrayInputStream(registrateBytes))
            try {
                boolean foundCanary = false
                def entry
                while ((entry = registrateZip.nextEntry) != null) {
                    if (entry.name == 'com/tterrag/registrate/AbstractRegistrate.class') {
                        foundCanary = true
                        break
                    }
                }
                if (!foundCanary) {
                    throw new GradleException('Nested Registrate runtime lacks AbstractRegistrate.class')
                }
            } finally {
                registrateZip.close()
            }
        } finally {
            mappedCreateJar.close()
        }

        File classesDir = sourceSets.main.output.classesDirs.singleFile
        String wrappedLevelName = 'net/createmod/catnip/levelWrappers/WrappedServerLevel'
        def classReferences = { String needle ->
            fileTree(classesDir).matching { include '**/*.class' }.files.findAll { classFile ->
                new String(Files.readAllBytes(classFile.toPath()), java.nio.charset.StandardCharsets.ISO_8859_1)
                        .toLowerCase(Locale.ROOT)
                        .contains(needle.toLowerCase(Locale.ROOT))
            }.collect { classesDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort()
        }
        def wrappedLevelReferences = classReferences(wrappedLevelName)
        def expectedWrappedLevelReference = [
                'dev/ryanhcode/sable/forge/platform/SablePlatformImpl$PonderWrappedLevelCheck.class'
        ]
        if (wrappedLevelReferences != expectedWrappedLevelReference) {
            throw new GradleException("Unexpected selected-core Ponder references: ${wrappedLevelReferences}")
        }
        def flywheelReferences = (classReferences('com/jozufozu/flywheel')
                + classReferences('dev/engine_room/flywheel')).unique().sort()
        if (!flywheelReferences.isEmpty()) {
            throw new GradleException("Flywheel references leaked into selected core classes: ${flywheelReferences}")
        }
        def createReferences = classReferences('com/simibubi/create')
        if (!createReferences.isEmpty()) {
            throw new GradleException("Create references leaked into selected core classes: ${createReferences}")
        }
        def catnipReferences = classReferences('net/createmod')
        if (catnipReferences != expectedWrappedLevelReference) {
            throw new GradleException("Unexpected selected-core Catnip/Ponder references: ${catnipReferences}")
        }

        File outerPlatform = new File(classesDir,
                'dev/ryanhcode/sable/forge/platform/SablePlatformImpl.class')
        String outerBytes = new String(Files.readAllBytes(outerPlatform.toPath()),
                java.nio.charset.StandardCharsets.ISO_8859_1)
        if (outerBytes.contains('WrappedServerLevel')) {
            throw new GradleException('Ponder WrappedServerLevel leaked into the outer SablePlatformImpl class')
        }

        File modsToml = file('src/main/resources/META-INF/mods.toml')
        String metadata = modsToml.getText('UTF-8')
        ['create', 'flywheel'].each { mod ->
            def dependencyBlock = metadata.split('\\[\\[dependencies\\.sable]]').find {
                it.contains("modId = \"${mod}\"")
            }
            if (dependencyBlock == null || !dependencyBlock.contains('mandatory = false')) {
                throw new GradleException("${mod} is not explicitly optional in Forge mods.toml")
            }
        }
        def curatedMixins = new JsonSlurper().parse(file('src/main/resources/sable-common-forge.mixins.json'))
        def selectedMixins = (curatedMixins.mixins + curatedMixins.client)*.toString()
        def createMixins = selectedMixins.findAll { it.toLowerCase(Locale.ROOT).contains('create') }
        if (!createMixins.isEmpty()) {
            throw new GradleException("Create Mixins leaked into the generated Forge runtime config: ${createMixins}")
        }

        File resourcesDir = sourceSets.main.output.resourcesDir
        [
                'data/sable/tags/blocks/normal.json',
                'data/sable/tags/entity_types/retain_in_sub_level.json',
                'data/sable/tags/items/paddles.json',
                'data/sable/structures/physicstest.gravity.nbt'
        ].each { path ->
            if (!new File(resourcesDir, path).isFile()) {
                throw new GradleException("Missing remapped Minecraft 1.20.1 resource: ${path}")
            }
        }
        [
                'data/sable/tags/block',
                'data/sable/tags/entity_type',
                'data/sable/tags/item',
                'data/sable/structure'
        ].each { path ->
            if (new File(resourcesDir, path).exists()) {
                throw new GradleException("Minecraft 1.21 resource path leaked into Forge output: ${path}")
            }
        }
        Map<String, List<String>> expectedTagLines = [
                'super_heavy.json': ['"#forge:storage_blocks"', '"id": "minecraft:heavy_core", "required": false'],
                'super_light.json': ['"#forge:glass_panes"', '"#forge:fence_gates"'],
                'quarter_volume.json': ['"#forge:glass_panes"', '"#forge:fence_gates"'],
                'light.json'      : ['"id": "#c:clusters", "required": false', '"#forge:chests/wooden"'],
                'heavy.json'      : ['"#forge:stone"', '"#forge:cobblestone"'],
                'normal_slabs.json': ['"id": "minecraft:tuff_slab", "required": false']
        ]
        expectedTagLines.each { name, expectedLines ->
            String contents = new File(resourcesDir, "data/sable/tags/blocks/${name}").getText('UTF-8')
            expectedLines.each { line ->
                if (!contents.contains(line)) {
                    throw new GradleException("Missing Forge 1.20.1 tag adaptation in ${name}: ${line}")
                }
            }
        }

        logger.lifecycle(
                'Verified target runClient: filtered mapped Create 6.0.8, mapped Flywheel 1.0.5/Ponder 1.0.91; '
                        + 'Create-owned Registrate MC1.20-1.3.3 JarJar; Sable MixinExtras 0.5.3; '
                        + 'mapped Veil artifact 1.0.0.296; old stack absent'
        )
        logger.lifecycle("Verified Ponder isolation: ${expectedWrappedLevelReference[0]} is the only compiled reference")
        logger.lifecycle('Verified Minecraft 1.21 data paths and tag references are adapted for Forge 1.20.1')
    }
}

