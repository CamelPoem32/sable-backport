def prepareCreateDevelopmentRuntime = tasks.register('prepareCreateDevelopmentRuntime') {
    group = 'forge backport'
    description = 'Removes Create\'s older MixinExtras wrapper and remaps its AT for mapped userdev runtime.'
    dependsOn prepareTargetModpackDependencies
    dependsOn tasks.named('createSrgToMcp')
    inputs.files(configurations.createRuntimeMapped)
    inputs.file(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    outputs.file(createDevelopmentRuntime)

    doLast {
        File inputJar = configurations.createRuntimeMapped.singleFile
        File outputJar = createDevelopmentRuntime.get().asFile
        File mappingsFile = layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile
        if (!mappingsFile.isFile()) {
            throw new GradleException(
                    "Create development runtime patching requires ${mappingsFile}; run :forge:createSrgToMcp first"
            )
        }
        outputJar.parentFile.mkdirs()
        String oldMixinExtras = expectedCreateLibraries.mixinextras.path
        int removedMetadataEntries = 0
        int removedPayloads = 0
        def accessTransformerPatch = null

        ZipInputStream input = new ZipInputStream(new BufferedInputStream(new FileInputStream(inputJar)))
        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputJar)))
        try {
            def entry
            while ((entry = input.nextEntry) != null) {
                if (entry.name == oldMixinExtras) {
                    removedPayloads++
                    continue
                }

                byte[] contents = input.readAllBytes()
                if (entry.name == 'META-INF/jarjar/metadata.json') {
                    def metadata = new JsonSlurper().parseText(new String(contents, 'UTF-8'))
                    int originalSize = metadata.jars.size()
                    metadata.jars.removeAll { nested ->
                        nested.identifier.group == expectedCreateLibraries.mixinextras.group
                                && nested.identifier.artifact == expectedCreateLibraries.mixinextras.artifact
                    }
                    removedMetadataEntries += originalSize - metadata.jars.size()
                    contents = groovy.json.JsonOutput.prettyPrint(
                            groovy.json.JsonOutput.toJson(metadata)).getBytes('UTF-8')
                }
                if (entry.name == 'META-INF/accesstransformer.cfg') {
                    accessTransformerPatch = VeilDevelopmentRuntimePatcher.remapAccessTransformer(contents, mappingsFile)
                    contents = accessTransformerPatch.bytes
                }

                ZipEntry outputEntry = new ZipEntry(entry.name)
                outputEntry.time = entry.time
                output.putNextEntry(outputEntry)
                output.write(contents)
                output.closeEntry()
            }
        } finally {
            input.close()
            output.close()
        }

        if (removedMetadataEntries != 1 || removedPayloads != 1) {
            throw new GradleException(
                    "Expected to suppress one Create MixinExtras metadata row and payload, removed "
                            + "metadata=${removedMetadataEntries}, payloads=${removedPayloads}"
            )
        }
        if (accessTransformerPatch == null) {
            throw new GradleException('Create development runtime is missing META-INF/accesstransformer.cfg')
        }
        if (accessTransformerPatch.unresolvedKnownMembers != 0) {
            throw new GradleException(
                    "Create access transformer has unresolved mapped SRG members: "
                            + accessTransformerPatch.unresolvedKnownMembers
            )
        }
        logger.lifecycle("Prepared Create development runtime without nested MixinExtras 0.4.1 and with "
                + "${accessTransformerPatch.remappedMembers}/${accessTransformerPatch.memberEntries} "
                + "remapped AT member entries (unresolved known=${accessTransformerPatch.unresolvedKnownMembers}): "
                + "${outputJar}")
    }
}

