            String rendererClassEntry = 'dev/ryanhcode/sable/mixin/compatibility/create/contraptions/ContraptionEntityRendererMixin.class'
            String colliderClassEntry = 'dev/ryanhcode/sable/mixin/compatibility/create/contraptions/ContraptionColliderMixin.class'
            String matrixAccessorClassEntry = 'dev/ryanhcode/sable/mixin/compatibility/create/contraptions/Matrix3dAccessor.class'
            String controllerAccessorClassEntry = 'dev/ryanhcode/sable/mixin/compatibility/create/contraptions/ControlledContraptionEntityAccessor.class'
            String helperClassEntry = 'dev/ryanhcode/sable/compatibility/create/contraptions/SableCreateContraptionControllerLookup.class'
            String staleRemovalClassEntry = 'dev/ryanhcode/sable/mixin/compatibility/create/contraptions/EntityContraptionRemovalMixin.class'
            if (jarFile.getJarEntry(classEntry) == null) {
                throw new GradleException("${jar.name} is missing ${classEntry}")
            }
            if (jarFile.getJarEntry(controlledClassEntry) == null) {
                throw new GradleException("${jar.name} is missing ${controlledClassEntry}")
            }
            if (jarFile.getJarEntry(rendererClassEntry) == null) {
                throw new GradleException("${jar.name} is missing ${rendererClassEntry}")
            }
            [colliderClassEntry, matrixAccessorClassEntry, controllerAccessorClassEntry].each { requiredEntry ->
                if (jarFile.getJarEntry(requiredEntry) == null) {
                    throw new GradleException("${jar.name} is missing required M13 contraption support ${requiredEntry}")
                }
            }
            if (jarFile.getJarEntry(helperClassEntry) == null) {
                throw new GradleException("${jar.name} is missing ${helperClassEntry}")
            }
            if (jarFile.getJarEntry(staleRemovalClassEntry) != null) {
                throw new GradleException("${jar.name} still contains deleted stale M13 removal mixin ${staleRemovalClassEntry}")
            }
            def configEntry = jarFile.getJarEntry('sable-common-forge.mixins.json')
            if (configEntry == null) {
                throw new GradleException("${jar.name} is missing sable-common-forge.mixins.json")
            }
            String configText = jarFile.getInputStream(configEntry).getText('UTF-8')
            if (!configText.contains('"compatibility.create.contraptions.AbstractContraptionEntityMixin"')) {
                throw new GradleException("${jar.name} mixin config does not reference M13 AbstractContraptionEntityMixin")
            }
            if (!configText.contains('"compatibility.create.contraptions.ControlledContraptionEntityMixin"')) {
                throw new GradleException("${jar.name} mixin config does not reference M13 ControlledContraptionEntityMixin")
            }
            if (!configText.contains('"compatibility.create.contraptions.ContraptionEntityRendererMixin"')) {
                throw new GradleException("${jar.name} mixin config does not reference M13 ContraptionEntityRendererMixin")
            }
            [
                    '"compatibility.create.contraptions.ContraptionColliderMixin"',
                    '"compatibility.create.contraptions.Matrix3dAccessor"',
                    '"compatibility.create.contraptions.ControlledContraptionEntityAccessor"'
            ].each { requiredEntry ->
                if (!configText.contains(requiredEntry)) {
                    throw new GradleException("${jar.name} mixin config does not reference ${requiredEntry}")
                }
            }
            def entries = jarFile.entries().toList()
            def duplicates = entries.findAll {
                it.name.endsWith('AbstractContraptionEntityMixin.class')
                        || it.name.endsWith('ControlledContraptionEntityMixin.class')
                        || it.name.endsWith('ContraptionEntityRendererMixin.class')
                        || it.name.endsWith('ContraptionColliderMixin.class')
                        || it.name.endsWith('Matrix3dAccessor.class')
                        || it.name.endsWith('ControlledContraptionEntityAccessor.class')
            }
            def expected = [classEntry, controlledClassEntry, rendererClassEntry, colliderClassEntry,
                            matrixAccessorClassEntry, controllerAccessorClassEntry] as Set
            if (duplicates.size() != expected.size() || duplicates.any { !expected.contains(it.name) }) {
                throw new GradleException("Unexpected duplicate/mispackaged M13 contraption mixin classes: ${duplicates*.name}")
            }
        } finally {
            jarFile.close()
        }

        String pluginText = rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/AbstractSableMixinPlugin.java').getText('UTF-8')
        if (!pluginText.contains('mixinClassName.startsWith("dev.ryanhcode.sable.mixin.compatibility.")')
                || !pluginText.contains('final String modId = parts[3].equals("mixin") ? parts[5] : parts[6]')) {
            throw new GradleException('M13 packaged mixin is not covered by the existing optional compatibility Create gating')
        }

        logger.lifecycle("verifyM13PackagedContraptionMixinBoundary PASS: ${jar.name} contains the M13 contraption adapter and matching Create-gated config entry")
    }
}

