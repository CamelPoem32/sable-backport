tasks.register('verifyGameRendererMixinBoundary') {
    group = 'forge backport'
    description = 'Bytecode-verifies the Forge 1.20.1 GameRenderer mixin target used for Sable picking.'

    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/clip_overwrite/GameRendererMixin.java'))
    inputs.file('src/main/resources/sable-common-forge.mixins.json')

    doLast {
        File forgeMappedClasses = layout.buildDirectory.dir('compileClasspath/forgeMappedClasses').get().asFile
        if (!forgeMappedClasses.isDirectory()) {
            throw new GradleException("Missing staged mapped Minecraft classes for GameRenderer verification: ${forgeMappedClasses}")
        }
        File javap = new File(System.getProperty('java.home'),
                'bin/javap' + (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? '.exe' : ''))
        if (!javap.isFile()) {
            throw new GradleException("Could not find javap executable at ${javap}")
        }

        def disassemble = { List<String> javapArgs ->
            ByteArrayOutputStream output = new ByteArrayOutputStream()
            exec {
                executable = javap.absolutePath
                args javapArgs
                standardOutput = output
            }
            output.toString('UTF-8')
        }
        def section = { String text, String start, String end ->
            int begin = text.indexOf(start)
            if (begin < 0) {
                throw new GradleException("GameRenderer bytecode verifier could not find method section start: ${start}")
            }
            int finish = text.indexOf(end, begin + start.length())
            if (finish < 0) {
                finish = text.length()
            }
            text.substring(begin, finish)
        }

        String mixinText = rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/clip_overwrite/GameRendererMixin.java').getText('UTF-8')
        String mixinConfigText = file('src/main/resources/sable-common-forge.mixins.json').getText('UTF-8')
        String gameRendererMethods = disassemble(['-classpath', forgeMappedClasses.absolutePath, '-p',
                'net.minecraft.client.renderer.GameRenderer'])
        String gameRendererBytecode = disassemble(['-classpath', forgeMappedClasses.absolutePath, '-c', '-p',
                'net.minecraft.client.renderer.GameRenderer'])
        String renderLevel = section(gameRendererBytecode,
                'public void renderLevel(float, long, com.mojang.blaze3d.vertex.PoseStack);',
                'public void resetData')

        if (gameRendererMethods.contains('filterHitResult')) {
            throw new GradleException('Forge 1.20.1 GameRenderer unexpectedly declares filterHitResult; re-audit before restoring that hook')
        }
        if (gameRendererMethods.contains('pick(net.minecraft.world.entity.Entity, double, double, float)')) {
            throw new GradleException('Forge 1.20.1 GameRenderer unexpectedly declares pick(Entity,double,double,float); re-audit before restoring that hook')
        }
        if (!gameRendererMethods.contains('public void pick(float);')) {
            throw new GradleException('Forge 1.20.1 GameRenderer lost public pick(float), the retained renderLevel hook must be re-audited')
        }
        if (!renderLevel.contains('Method pick:(F)V')) {
            throw new GradleException('GameRenderer#renderLevel no longer invokes GameRenderer#pick(float); retained hook would match 0/1')
        }

        [
                'method = "filterHitResult"',
                'pick(Lnet/minecraft/world/entity/Entity;DDF)Lnet/minecraft/world/phys/HitResult;',
                '@Redirect',
                'sable$closerThan',
                'sable$distanceToSqr',
                'sable$getEyePosition'
        ].each { stale ->
            if (mixinText.contains(stale)) {
                throw new GradleException("GameRendererMixin still contains stale 1.21 picking hook: ${stale}")
            }
        }
        [
                '@WrapOperation(method = "renderLevel"',
                'target = "Lnet/minecraft/client/renderer/GameRenderer;pick(F)V"',
                'extension.sable$pushPoseSupplier',
                'try {',
                'original.call(instance, f)',
                'finally',
                'extension.sable$popPoseSupplier'
        ].each { canary ->
            if (!mixinText.contains(canary)) {
                throw new GradleException("GameRendererMixin lost retained 1.20.1 renderLevel pick bridge canary: ${canary}")
            }
        }
        if (mixinText.contains('remap = false')) {
            throw new GradleException('GameRendererMixin targets Minecraft-owned methods and must use normal remapping, not remap=false')
        }
        if (!mixinConfigText.contains('clip_overwrite.GameRendererMixin')) {
            throw new GradleException('Forge mixin config must include the retained GameRenderer render-time pick bridge')
        }

        logger.lifecycle('verifyGameRendererMixinBoundary PASS: Forge 1.20.1 GameRenderer has no '
                + 'filterHitResult or pick(Entity,double,double,float) target, the stale redirects are absent, '
                + 'and the retained renderLevel hook bytecode-matches the real GameRenderer#pick(float) call')
    }
}

