                'enabled='
        ].each { canary ->
            if (!m10Text.contains(canary)) {
                throw new GradleException("M10 angular-velocity diagnostics lost canary: ${canary}")
            }
        }
        [
                'default void setLinearAndAngularVelocity',
                'this.resetVelocity(body)',
                'default double getAngularDamping',
                'default Boolean isSleeping',
                'default Boolean canSleep',
                'default String getRigidBodyType',
                'default Boolean isEnabled'
        ].each { canary ->
            if (!pipelineText.contains(canary)) {
                throw new GradleException("Generic physics API lost velocity/diagnostic canary: ${canary}")
            }
        }
        if (!handleText.contains('this.physicsSystem.getPipeline().setLinearAndAngularVelocity(this.body, linearVelocity, angularVelocity)')) {
            throw new GradleException('RigidBodyHandle no longer delegates setLinearAndAngularVelocity through the generic pipeline')
        }
        [
                'public static native void addLinearAngularVelocities'
        ].each { canary ->
            if (!rapier3DText.contains(canary)) {
                throw new GradleException("Rapier3D Java velocity surface lost canary: ${canary}")
            }
        }
        [
                'public static native void setLinearAngularVelocities',
                'public static native boolean isSleeping'
        ].each { forbidden ->
            if (rapier3DText.contains(forbidden)) {
                throw new GradleException("Temporary native sleep/direct-set experiment must remain removed: ${forbidden}")
            }
        }
        [
                'private double universalDrag = Double.NaN',
                'this.universalDrag = universalDrag',
                'public void addLinearAndAngularVelocity',
                'Rapier3D.addLinearAngularVelocities(this.scene.handle(), Rapier3D.getID(body)',
                'public Boolean isSleeping(final PhysicsPipelineBody body) {',
                'return null',
                'return this.universalDrag',
                'return "dynamic"'
        ].each { canary ->
            if (!rapierPipelineText.contains(canary)) {
                throw new GradleException("Rapier pipeline lost direct set/diagnostic canary: ${canary}")
            }
        }
        if (rapierPipelineText.contains('public void setLinearAndAngularVelocity')
                || rapierPipelineText.contains('Rapier3D.setLinearAngularVelocities')) {
            throw new GradleException('Rapier pipeline must not carry the temporary direct native set velocity override')
        }
        [
                'activation_params.angular_threshold = 0.15',
                'activation_params.normalized_linear_threshold = 0.15',
                'rb.set_angvel(',
                'Vec3::new(angular_x as Real, angular_y as Real, angular_z as Real)',
                'wake_up > 0'
        ].each { canary ->
            if (!rapierRustText.contains(canary)) {
                throw new GradleException("Rapier native angular persistence boundary lost canary: ${canary}")
            }
        }
        [
                'SUB_LEVEL_ANGULAR_SLEEP_THRESHOLD',
                'SUB_LEVEL_NORMALIZED_LINEAR_SLEEP_THRESHOLD',
                'Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_setLinearAngularVelocities',
                'Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_isSleeping'
        ].each { forbidden ->
            if (rapierRustText.contains(forbidden)) {
                throw new GradleException("Temporary native sleep experiment must remain removed: ${forbidden}")
            }
        }
        if (!dimensionPhysicsText.contains('private static final float DEFAULT_UNIVERSAL_DRAG = 0.09f')) {
            throw new GradleException('Default universal drag changed; update the M10.2 decay expectation')
        }

        double initial = Math.toRadians(15.0d)
        double damping = 0.09d
        double afterHalfSecond = initial * Math.exp(-damping * 0.5d)
        double oneDegreePerSecond = Math.toRadians(1.0d)
        if (afterHalfSecond <= oneDegreePerSecond) {
            throw new GradleException("15 deg/s damping expectation unexpectedly reaches sleep threshold: ${afterHalfSecond}")
        }
        logger.lifecycle('verifyM10AngularVelocityPersistenceBoundary PASS: set_velocity converts deg/s to rad/s '
                + 'once and uses RigidBodyHandle -> PhysicsPipeline; Rapier uses the generic reset/add velocity API, '
                + 'the temporary direct native setter/sleep probe is absent, and upstream activation thresholds are restored')
    }
}

