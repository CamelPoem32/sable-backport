tasks.register('verifyPackagedMixinImplementationClasses') {
    group = 'forge backport'
    description = 'Verifies every packaged Sable mixin config entry has its implementation class in the same runtime artifact.'
    dependsOn tasks.named('packageRapierIntoFinalForgeArtifact')

    inputs.file(standaloneProductionSableArtifact)

    doLast {
        File jar = standaloneProductionSableArtifact.get().asFile
        if (!jar.isFile()) {
            throw new GradleException("Missing final production artifact for packaged mixin verification: ${jar}")
        }

        JarFile jarFile = new JarFile(jar)
        try {
            def entries = jarFile.entries().toList()
            def mixinConfigs = entries.findAll {
                !it.directory && it.name.endsWith('.mixins.json')
            }
            if (mixinConfigs.isEmpty()) {
                throw new GradleException("${jar.name} contains no mixin configs")
            }

            def missing = []
            mixinConfigs.each { configEntry ->
                def parsed = new JsonSlurper().parse(jarFile.getInputStream(configEntry))
                String packagePrefix = parsed.package?.toString()
                if (packagePrefix == null || packagePrefix.isBlank()) {
                    throw new GradleException("${configEntry.name} has no package field")
                }

                ((parsed.mixins ?: []) + (parsed.client ?: []) + (parsed.server ?: [])).each { mixinName ->
                    String fullName = packagePrefix + '.' + mixinName.toString()
                    String classEntry = fullName.replace('.', '/') + '.class'
                    if (jarFile.getJarEntry(classEntry) == null) {
                        missing.add("${configEntry.name}:${mixinName} -> ${classEntry}")
                    }
                }
            }

            if (!missing.isEmpty()) {
                throw new GradleException("Packaged mixin configs reference missing implementation classes: ${missing}")
            }
        } finally {
            jarFile.close()
        }

        logger.lifecycle("verifyPackagedMixinImplementationClasses PASS: all packaged mixin config entries in ${jar.name} have implementation classes")
    }
}

