tasks.register('verifyRunClientClasspath') {
    group = 'verification'
    description = 'Verifies the exact Create 6 target runtime and the retained optional-linkage boundary.'
    dependsOn tasks.named('classes')
    dependsOn project(':sable_companion_1_20').tasks.named('classes')
    dependsOn prepareCreateDevelopmentRuntime
    dependsOn prepareVeilDevelopmentRuntime

    doLast {
        Set<File> runtimeFiles = sourceSets.main.runtimeClasspath.files.collect { it.canonicalFile } as Set
        def containsEntry = { File classpathEntry, String entry ->
            if (classpathEntry.isDirectory()) {
                return new File(classpathEntry, entry).isFile()
            }
            if (!classpathEntry.isFile() || !classpathEntry.name.endsWith('.jar')) {
                return false
            }
            JarFile jar = new JarFile(classpathEntry)
            try {
                return jar.getJarEntry(entry) != null
            } finally {
                jar.close()
            }
        }

        def requireEntry = { String entry ->
            if (!runtimeFiles.any { containsEntry(it, entry) }) {
                throw new GradleException("runClient runtime classpath is missing ${entry}")
            }
        }

        requireEntry('dev/ryanhcode/sable/companion/SableCompanion.class')
        requireEntry('dev/ryanhcode/sable/companion/impl/DefaultSableCompanion.class')
        requireEntry('META-INF/services/dev.ryanhcode.sable.companion.SableCompanion')
        requireEntry('dev/ryanhcode/sable/ActiveSableCompanion.class')
        requireEntry('foundry/veil/api/client/render/VeilRenderSystem.class')
        requireEntry('gg/moonflower/molangcompiler/api/MolangCompiler.class')
        requireEntry('imgui/glfw/ImGuiImplGlfw.class')

        String companionService = 'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion'
        Set<String> companionProviders = [] as Set
        runtimeFiles.each { classpathEntry ->
            if (classpathEntry.isDirectory()) {
                File descriptor = new File(classpathEntry, companionService)
                if (descriptor.isFile()) {
                    companionProviders.addAll(descriptor.readLines('UTF-8').collect { it.trim() }.findAll { it })
                }
            } else if (classpathEntry.isFile() && classpathEntry.name.endsWith('.jar')) {
                JarFile jar = new JarFile(classpathEntry)
                try {
                    def descriptor = jar.getJarEntry(companionService)
                    if (descriptor != null) {
                        companionProviders.addAll(jar.getInputStream(descriptor).getText('UTF-8')
                                .readLines().collect { it.trim() }.findAll { it })
                    }
                } finally {
                    jar.close()
                }
            }
        }
        Set<String> expectedCompanionProviders = [
                'dev.ryanhcode.sable.ActiveSableCompanion',
                'dev.ryanhcode.sable.companion.impl.DefaultSableCompanion'
        ] as Set
        if (companionProviders != expectedCompanionProviders) {
            throw new GradleException("Unexpected runClient Companion providers: ${companionProviders}")
        }
        File forgeCompanionDescriptor = new File(sourceSets.main.output.resourcesDir, companionService)
        Set<String> forgeCompanionProviders = forgeCompanionDescriptor.readLines('UTF-8')
                .collect { it.trim() }.findAll { it } as Set
        if (forgeCompanionProviders != expectedCompanionProviders) {
            throw new GradleException(
                    "Forge-visible Companion descriptor is not merged deterministically: ${forgeCompanionProviders}"
            )
        }

        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        def artifactIds = artifacts.collect {
            "${it.moduleVersion.id.group}:${it.name}:${it.moduleVersion.id.version}"
        }
        File patchedCreate = createDevelopmentRuntime.get().asFile.canonicalFile
        if (!runtimeFiles.contains(patchedCreate)) {
            throw new GradleException('Filtered mapped Create 6.0.8 is absent from runClient runtimeClasspath')
        }
        def leakedCreateFiles = runtimeFiles.findAll { runtimeFile ->
            runtimeFile.name.toLowerCase(Locale.ROOT).contains("create-${forge_minecraft_version}")
                    && runtimeFile.canonicalFile != patchedCreate
        }
        if (!leakedCreateFiles.isEmpty()) {
            throw new GradleException("Raw or unfiltered Create artifact leaked onto runClient: ${leakedCreateFiles}")
        }
        File patchedVeil = veilDevelopmentRuntime.get().asFile.canonicalFile
        if (!runtimeFiles.any { it.canonicalFile == patchedVeil }) {
            throw new GradleException('Patched mapped Veil 1.20 is absent from runClient runtimeClasspath')
        }
        if (runtimeFiles.any { it.name.contains('Veil-forge-1.20.1') && it.canonicalFile != patchedVeil }) {
            throw new GradleException('Unpatched Veil artifact leaked onto runClient runtimeClasspath')
        }
        JarFile patchedVeilJar = new JarFile(patchedVeil)
        try {
            if (patchedVeilJar.entries().any { it.name.startsWith('org/lwjgl/') && it.name.endsWith('.class') }) {
                throw new GradleException('Filtered Veil development runtime still contains split-package LWJGL classes')
            }
        } finally {
            patchedVeilJar.close()
        }
        Map<String, String> expectedRuntimeModules = [
                ("flywheel-forge-${forge_minecraft_version}".toString()) : forge_flywheel_version.toString(),
                ("Ponder-Forge-${forge_minecraft_version}".toString())    : forge_ponder_version.toString()
        ]
        def targetRuntimeArtifacts = artifacts.findAll { artifact ->
            artifact.moduleVersion.id.group == 'local.target'
        }
        if ((targetRuntimeArtifacts.collect { it.name } as Set) != expectedRuntimeModules.keySet()) {
            throw new GradleException(
                    "Expected exact target runtime modules ${expectedRuntimeModules.keySet()}, resolved "
                            + "${targetRuntimeArtifacts.collect { it.moduleVersion.id }}"
            )
        }
        File targetRepository = targetModpackRepository.get().asFile.canonicalFile
        targetRuntimeArtifacts.each { artifact ->
            String expectedVersion = expectedRuntimeModules[artifact.name]
            String resolvedVersion = artifact.moduleVersion.id.version
            String expectedMappedVersion = "${expectedVersion}_mapped_official_${forge_minecraft_version}"
            File resolvedFile = artifact.file.canonicalFile
            if (resolvedVersion != expectedMappedVersion) {
                throw new GradleException(
                        "Unexpected mapped runtime version for ${artifact.name}: ${artifact.moduleVersion.id}; "
                                + "expected ${expectedMappedVersion}"
                )
            }
            if (resolvedFile.toPath().startsWith(targetRepository.toPath())) {
                throw new GradleException("Raw target artifact leaked onto runClient runtimeClasspath: ${resolvedFile}")
            }
            if (!runtimeFiles.contains(resolvedFile)) {
                throw new GradleException("Mapped target artifact is absent from sourceSets.main.runtimeClasspath: ${resolvedFile}")
            }
        }
        def obsoleteArtifacts = artifactIds.findAll { coordinate ->
            coordinate.contains(':create-1.20.1:0.5.1.j') ||
                    coordinate.contains(':flywheel-forge-1.20.1:0.6.11-13')
        }
        def obsoleteFiles = runtimeFiles.findAll { runtimeFile ->
            runtimeFile.name.contains('0.5.1.j') || runtimeFile.name.contains('0.6.11-13')
        }
        if (!obsoleteArtifacts.isEmpty() || !obsoleteFiles.isEmpty()) {
            throw new GradleException(
                    "Obsolete Create/Flywheel runtime detected: artifacts=${obsoleteArtifacts}, files=${obsoleteFiles}"
            )
        }

        requireEntry('com/simibubi/create/Create.class')
        requireEntry('dev/engine_room/flywheel/api/visualization/VisualizationManager.class')
        requireEntry('net/createmod/catnip/levelWrappers/WrappedServerLevel.class')

        JarFile mappedCreateJar = new JarFile(patchedCreate)
        try {
            def jarJarMetadataEntry = mappedCreateJar.getJarEntry('META-INF/jarjar/metadata.json')
            if (jarJarMetadataEntry == null) {
                throw new GradleException('Filtered mapped Create runtime lacks JarJar metadata')
            }
            def createJarJarMetadata = new JsonSlurper().parse(
                    mappedCreateJar.getInputStream(jarJarMetadataEntry))
            Set<String> actualNestedCoordinates = createJarJarMetadata.jars.collect { nested ->
                "${nested.identifier.group}:${nested.identifier.artifact}:${nested.version.artifactVersion}".toString()
            } as Set
            Set<String> expectedNestedCoordinates = [
                    "${expectedTargetArtifacts.registrate.group}:${expectedTargetArtifacts.registrate.artifact}:${expectedTargetArtifacts.registrate.version}",
                    "${expectedTargetArtifacts.flywheel.group}:${expectedTargetArtifacts.flywheel.artifact}:${expectedTargetArtifacts.flywheel.version}",
                    "${expectedTargetArtifacts.ponder.group}:${expectedTargetArtifacts.ponder.artifact}:${expectedTargetArtifacts.ponder.version}"
            ] as Set
            if (actualNestedCoordinates != expectedNestedCoordinates) {
                throw new GradleException(
                        "Filtered Create JarJar inventory differs from the exact development baseline: "
                                + "${actualNestedCoordinates}"
                )
            }
            if (mappedCreateJar.getJarEntry(expectedCreateLibraries.mixinextras.path) != null) {
                throw new GradleException('Create MixinExtras 0.4.1 wrapper remains in the development runtime')
            }
            String registratePath = expectedTargetArtifacts.registrate.path
            def registrateEntry = mappedCreateJar.getJarEntry(registratePath)
            if (registrateEntry == null) {
                throw new GradleException("Mapped Create runtime is missing nested ${registratePath}")
            }
            byte[] registrateBytes = mappedCreateJar.getInputStream(registrateEntry).readAllBytes()
            String mappedRegistrateHash = 'AB90001E9EC42922DA4E499CDAFF6D7F1F6E78432CE71555397931804E94E5FB'
            if (sha256Bytes(registrateBytes) != mappedRegistrateHash) {
                throw new GradleException("Mapped Create runtime has an unexpected nested Registrate payload")
            }
            ZipInputStream registrateZip = new ZipInputStream(new ByteArrayInputStream(registrateBytes))
            try {
                boolean foundCanary = false
                def entry
                while ((entry = registrateZip.nextEntry) != null) {
                    if (entry.name == 'com/tterrag/registrate/AbstractRegistrate.class') {
                        foundCanary = true
                        break
                    }
                }
                if (!foundCanary) {
                    throw new GradleException('Nested Registrate runtime lacks AbstractRegistrate.class')
                }
            } finally {
                registrateZip.close()
            }
        } finally {
            mappedCreateJar.close()
        }

        File classesDir = sourceSets.main.output.classesDirs.singleFile
        String wrappedLevelName = 'net/createmod/catnip/levelWrappers/WrappedServerLevel'
        def classReferences = { String needle ->
            fileTree(classesDir).matching { include '**/*.class' }.files.findAll { classFile ->
                new String(Files.readAllBytes(classFile.toPath()), java.nio.charset.StandardCharsets.ISO_8859_1)
                        .toLowerCase(Locale.ROOT)
                        .contains(needle.toLowerCase(Locale.ROOT))
            }.collect { classesDir.toPath().relativize(it.toPath()).toString().replace('\\', '/') }.sort()
        }
        def wrappedLevelReferences = classReferences(wrappedLevelName)
        def expectedWrappedLevelReference = [
                'dev/ryanhcode/sable/forge/platform/SablePlatformImpl$PonderWrappedLevelCheck.class'
        ]
        if (wrappedLevelReferences != expectedWrappedLevelReference) {
            throw new GradleException("Unexpected selected-core Ponder references: ${wrappedLevelReferences}")
        }
        def flywheelReferences = (classReferences('com/jozufozu/flywheel')
                + classReferences('dev/engine_room/flywheel')).unique().sort()
        if (!flywheelReferences.isEmpty()) {
            throw new GradleException("Flywheel references leaked into selected core classes: ${flywheelReferences}")
        }
        def createReferences = classReferences('com/simibubi/create')
        if (!createReferences.isEmpty()) {
            throw new GradleException("Create references leaked into selected core classes: ${createReferences}")
        }
        def catnipReferences = classReferences('net/createmod')
        if (catnipReferences != expectedWrappedLevelReference) {
            throw new GradleException("Unexpected selected-core Catnip/Ponder references: ${catnipReferences}")
        }

        File outerPlatform = new File(classesDir,
                'dev/ryanhcode/sable/forge/platform/SablePlatformImpl.class')
        String outerBytes = new String(Files.readAllBytes(outerPlatform.toPath()),
                java.nio.charset.StandardCharsets.ISO_8859_1)
        if (outerBytes.contains('WrappedServerLevel')) {
            throw new GradleException('Ponder WrappedServerLevel leaked into the outer SablePlatformImpl class')
        }

        File modsToml = file('src/main/resources/META-INF/mods.toml')
        String metadata = modsToml.getText('UTF-8')
        ['create', 'flywheel'].each { mod ->
            def dependencyBlock = metadata.split('\\[\\[dependencies\\.sable]]').find {
                it.contains("modId = \"${mod}\"")
            }
            if (dependencyBlock == null || !dependencyBlock.contains('mandatory = false')) {
                throw new GradleException("${mod} is not explicitly optional in Forge mods.toml")
            }
        }
        def curatedMixins = new JsonSlurper().parse(file('src/main/resources/sable-common-forge.mixins.json'))
        def selectedMixins = (curatedMixins.mixins + curatedMixins.client)*.toString()
        def createMixins = selectedMixins.findAll { it.toLowerCase(Locale.ROOT).contains('create') }
        def allowedCreateMixins = [
                'm11.create.BlockEntityConfigurationPacketAccessor',
                'm11.create.ValueSettingsPacketAccessor',
                'm11.create.ValueSettingsClientMixin',
                'm11.create.ValueSettingsScreenMixin',
                'm11.create.BracketedKineticBlockEntityRendererMixin',
                'm11.create.KineticBlockEntityRendererMixin'
        ]
        if (createMixins != allowedCreateMixins) {
            throw new GradleException("Unexpected Create mixin set in the Forge runtime config: ${createMixins}")
        }

        File resourcesDir = sourceSets.main.output.resourcesDir
        [
                'data/sable/tags/blocks/normal.json',
                'data/sable/tags/entity_types/retain_in_sub_level.json',
                'data/sable/tags/items/paddles.json',
                'data/sable/structures/physicstest.gravity.nbt'
        ].each { path ->
            if (!new File(resourcesDir, path).isFile()) {
                throw new GradleException("Missing remapped Minecraft 1.20.1 resource: ${path}")
            }
        }
        [
                'data/sable/tags/block',
                'data/sable/tags/entity_type',
                'data/sable/tags/item',
                'data/sable/structure'
        ].each { path ->
            if (new File(resourcesDir, path).exists()) {
                throw new GradleException("Minecraft 1.21 resource path leaked into Forge output: ${path}")
            }
        }
        Map<String, List<String>> expectedTagLines = [
                'super_heavy.json': ['"#forge:storage_blocks"', '"id": "minecraft:heavy_core", "required": false'],
                'super_light.json': ['"#forge:glass_panes"', '"#forge:fence_gates"'],
                'quarter_volume.json': ['"#forge:glass_panes"', '"#forge:fence_gates"'],
                'light.json'      : ['"id": "#c:clusters", "required": false', '"#forge:chests/wooden"'],
                'heavy.json'      : ['"#forge:stone"', '"#forge:cobblestone"'],
                'normal_slabs.json': ['"id": "minecraft:tuff_slab", "required": false']
        ]
        expectedTagLines.each { name, expectedLines ->
            String contents = new File(resourcesDir, "data/sable/tags/blocks/${name}").getText('UTF-8')
            expectedLines.each { line ->
                if (!contents.contains(line)) {
                    throw new GradleException("Missing Forge 1.20.1 tag adaptation in ${name}: ${line}")
                }
            }
        }

        logger.lifecycle(
                'Verified target runClient: filtered mapped Create 6.0.8, mapped Flywheel 1.0.5/Ponder 1.0.91; '
                        + 'Create-owned Registrate MC1.20-1.3.3 JarJar; Sable MixinExtras 0.5.3; '
                        + 'mapped Veil artifact 1.0.0.296; old stack absent'
        )
        logger.lifecycle("Verified Ponder isolation: ${expectedWrappedLevelReference[0]} is the only compiled reference")
        logger.lifecycle('Verified Minecraft 1.21 data paths and tag references are adapted for Forge 1.20.1')
    }
}

tasks.named('compileNetworkProtocolJava') {
    dependsOn ':sable_companion_1_20:classes'
    // ForgeGradle mutates Java source-set classpaths during configuration. Pin the task to the
    // filtered view; the Java 17 Companion sources are compiled into this isolated test slice.
