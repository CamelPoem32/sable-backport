        File rapier3DSource = new File(rapierJavaRoot,
                'dev/ryanhcode/sable/physics/impl/rapier/Rapier3D.java')
        String windowsEntryName = 'sable_rapier_x86_64_windows.dll'
        String nativePrefix = 'Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_'

        if (!nativePayload.isFile()) {
            throw new GradleException("Rapier native payload is missing: ${nativePayload}")
        }
        if (!builtWindowsDll.isFile()) {
            throw new GradleException("Built Windows x86_64 Rapier DLL is missing: ${builtWindowsDll}")
        }
        if (rapierLz4Jar == null || !rapierLz4Jar.isFile()) {
            throw new GradleException("Cached at.yawk.lz4:lz4-java:1.11.0 jar is missing; checked ${rapierLz4JarCandidates}")
        }

        def readNativeArchive = {
            URLClassLoader loader = new URLClassLoader([rapierLz4Jar.toURI().toURL()] as URL[], (ClassLoader) null)
            try {
                Class<?> lz4InputType = loader.loadClass('net.jpountz.lz4.LZ4FrameInputStream')
                InputStream fileInput = Files.newInputStream(nativePayload.toPath())
                InputStream lz4Input = (InputStream) lz4InputType
                        .getConstructor(InputStream)
                        .newInstance(fileInput)
                Map<String, byte[]> entries = new LinkedHashMap<>()
                try (ZipInputStream zipInput = new ZipInputStream(lz4Input)) {
                    ZipEntry entry
                    while ((entry = zipInput.nextEntry) != null) {
                        if (!entry.directory) {
                            entries[entry.name] = zipInput.readAllBytes()
                        }
                    }
                }
                return entries
            } finally {
                loader.close()
            }
        }

        def nativeEntries = readNativeArchive()
        if (nativeEntries.size() != 6 || !nativeEntries.containsKey(windowsEntryName)) {
            throw new GradleException(
                    "Expected mixed six-entry payload containing ${windowsEntryName}; actual=${nativeEntries.keySet().sort()}"
            )
        }
        byte[] payloadWindowsDll = nativeEntries[windowsEntryName]
        byte[] builtWindowsDllBytes = Files.readAllBytes(builtWindowsDll.toPath())
        if (sha256Bytes(payloadWindowsDll) != sha256Bytes(builtWindowsDllBytes)) {
            throw new GradleException("${windowsEntryName} in payload does not match the freshly built Windows DLL")
        }

        String rapier3DText = rapier3DSource.getText('UTF-8')
        Set<String> javaNativeMethods = new TreeSet<>()
        rapier3DText.readLines().findAll { it.contains(' native ') }.each { String line ->
            def matcher = line =~ /\bnative\s+[A-Za-z0-9_<>\[\].?]+\s+([A-Za-z0-9_]+)\s*\(/
            if (!matcher.find()) {
                throw new GradleException("Could not parse Rapier3D native declaration: ${line}")
            }
            javaNativeMethods.add(matcher.group(1))
        }
        if (javaNativeMethods.size() != 55) {
            throw new GradleException("Expected 55 Rapier3D native methods, found ${javaNativeMethods.size()}: ${javaNativeMethods}")
        }

        Set<String> expectedJniExports = javaNativeMethods.collect { ("${nativePrefix}${it}").toString() } as Set
        String rustSourceText = fileTree(new File(rapierRustRoot, 'rapier/src'))
                .matching { include '**/*.rs' }
                .files
                .sort()
                .collect { it.getText('UTF-8') }
                .join('\n')
        Set<String> rustJniExports = new TreeSet<>()
        (rustSourceText =~ /Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_[A-Za-z0-9_]+/)
                .each { match -> rustJniExports.add(match.toString()) }
        def missingRustExports = (expectedJniExports - rustJniExports).sort()
        if (!missingRustExports.isEmpty()) {
            throw new GradleException("Rust source is missing JNI exports: ${missingRustExports}")
        }

        def extractJniSymbols = { byte[] bytes ->
            StringBuilder current = new StringBuilder()
            Set<String> symbols = new TreeSet<>()
            Set<String> unexpected = new TreeSet<>()
            def expectedByLength = expectedJniExports.sort { a, b -> b.length() <=> a.length() }
            def flush = {
                if (current.length() >= nativePrefix.length()) {
                    String text = current.toString()
                    int start = text.indexOf(nativePrefix)
                    while (start >= 0) {
                        String tail = text.substring(start)
                        String matched = expectedByLength.find { tail.startsWith(it) }
                        if (matched != null) {
                            symbols.add(matched)
                        } else {
                            def matcher = tail =~ /Java_dev_ryanhcode_sable_physics_impl_rapier_Rapier3D_[A-Za-z0-9_]+/
                            if (matcher.find()) {
                                unexpected.add(matcher.group(0))
                            }
                        }
                        start = text.indexOf(nativePrefix, start + nativePrefix.length())
                    }
                }
                current.setLength(0)
            }
            bytes.each { byte raw ->
                int value = raw & 0xFF
                if (value >= 32 && value <= 126) {
                    current.append((char) value)
                } else {
                    flush()
                }
            }
            flush()
            [expected: symbols, unexpected: unexpected]
        }

        def scan = extractJniSymbols(payloadWindowsDll)
        def missingBinaryExports = (expectedJniExports - scan.expected).sort()
        if (!missingBinaryExports.isEmpty()) {
            throw new GradleException("${windowsEntryName} is missing JNI exports: ${missingBinaryExports}")
        }
        if (!scan.unexpected.isEmpty()) {
            throw new GradleException("${windowsEntryName} contains unexpected Sable Rapier JNI exports: ${scan.unexpected.sort()}")
        }

        logger.lifecycle("verifyRapierWindowsX64NativeValidationArtifact PASS: LOCAL M10.2 WINDOWS VALIDATION ONLY, "
                + "payloadSha256=${sha256(nativePayload)}, windowsDllSha256=${sha256Bytes(payloadWindowsDll)}, "
                + "jniExports=${scan.expected.size()}/${javaNativeMethods.size()}, nativeEntries=${nativeEntries.size()}")
    }
}

tasks.register('jarRapierBackportLibrary') {
    group = 'forge backport'
    description = 'Packages the isolated Java 17 Rapier backport classes/resources as a named intermediate common library.'

    outputs.file(rapierBackportNamedJar)

    doLast {
        File providerClass = sourceSets.rapierBackport.output.classesDirs.files
                .collect { new File(it, 'dev/ryanhcode/sable/physics/impl/rapier/RapierPhysicsPipelineProvider.class') }
                .find { it.isFile() }
        if (providerClass == null) {
            throw new GradleException(
                    'Rapier backport classes are missing; run :forge:verifyRapierBackportStatic when ForgeGradle infrastructure is available'
            )
        }
        File serviceDescriptor = new File(
                sourceSets.rapierBackport.output.resourcesDir,
                'META-INF/services/dev.ryanhcode.sable.api.physics.PhysicsPipelineProvider')
        if (!serviceDescriptor.isFile()) {
            throw new GradleException("Rapier backport service descriptor is missing: ${serviceDescriptor}")
        }

        File outputJar = rapierBackportNamedJar.get().asFile
        outputJar.parentFile.mkdirs()
        def entries = [:]
        (sourceSets.rapierBackport.output.classesDirs.files + [sourceSets.rapierBackport.output.resourcesDir])
                .findAll { it != null && it.isDirectory() }
                .each { root ->
                    fileTree(root).files.each { file ->
                        String relative = root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                        if (relative in [
                                'META-INF/mods.toml',
                                'META-INF/neoforge.mods.toml',
                                'META-INF/accesstransformer.cfg',
                                'fabric.mod.json'
                        ]) {
                            return
                        }
                        if (entries.containsKey(relative)) {
                            throw new GradleException("Duplicate Rapier library entry while packaging ${relative}")
                        }
                        entries[relative] = Files.readAllBytes(file.toPath())
                    }
                }
        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(outputJar)))
        try {
            entries.keySet().sort().each { name ->
                ZipEntry outputEntry = new ZipEntry(name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                output.write(entries[name])
                output.closeEntry()
            }
        } finally {
            output.close()
        }
        logger.lifecycle("jarRapierBackportLibrary PASS: ${outputJar.name} entries=${entries.size()}")
    }
}

tasks.register('remapCompanionBackportJarToProduction') {
    group = 'forge backport'
    description = 'Maps the nested Companion common library from named/userdev bytecode to Forge production SRG namespace.'
    dependsOn project(':sable_companion_1_20').tasks.named('jar')
    dependsOn tasks.named('compileJava')
    dependsOn tasks.named('createMcpToSrg')
    mustRunAfter tasks.named('reobfJarJar')

    inputs.file(provider { project(':sable_companion_1_20').tasks.named('jar').get().archiveFile.get().asFile })
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    inputs.files(configurations.compileClasspath)
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.file(companionBackportProductionJar)

    doLast {
        File namedJar = project(':sable_companion_1_20').tasks.named('jar').get().archiveFile.get().asFile
        File productionJar = companionBackportProductionJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        if (!namedJar.isFile()) {
            throw new GradleException("Named Companion jar is missing: ${namedJar}")
        }
        if (!mappingsFile.isFile()) {
            throw new GradleException("Companion production remap requires ${mappingsFile}")
        }
        def hierarchyClasspath = productionRemapHierarchyClasspath()
        def result = RapierProductionJarMapper.mapNamedToProduction(
                namedJar, mappingsFile, productionJar, hierarchyClasspath)
        if (result.productionMinecraftMemberReferences.isEmpty()) {
            throw new GradleException('Companion production remap did not prove any Minecraft member references')
        }
        if (!result.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    "Companion production jar still contains named Minecraft member references: "
                            + result.namedMinecraftMemberReferences.take(20)
            )
        }
        if (!result.unresolvedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    "Companion production jar contains unresolved Minecraft member references: "
                            + result.unresolvedMinecraftMemberReferences.take(20)
            )
        }
        logger.lifecycle("remapCompanionBackportJarToProduction PASS: inputSha256=${result.inputSha256}, "
                + "outputSha256=${result.outputSha256}, transformedClasses=${result.transformedClasses}, "
                + "memberReferenceRemaps=${result.memberReferenceRemaps}, "
                + "inheritedMemberReferenceRemaps=${result.inheritedMemberReferenceRemaps}, "
                + "handleReferenceRemaps=${result.invokedynamicHandleRemaps}, "
                + "indySamNameRemaps=${result.invokedynamicSamNameRemaps}, "
                + "productionMemberRefs=${result.productionMinecraftMemberReferences.size()}")
    }
}

tasks.register('packageCompanionIntoFinalForgeArtifact') {
    group = 'forge backport'
    description = 'Replaces the JarJar-packaged Companion common library in the final Sable all-jar with production/SRG bytecode.'
    dependsOn tasks.named('reobfJarJar')
    dependsOn tasks.named('remapCompanionBackportJarToProduction')

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(companionBackportProductionJar)
    outputs.upToDateWhen { false }

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File companionJar = companionBackportProductionJar.get().asFile
        if (!finalJar.isFile()) {
            throw new GradleException("Companion packaging requires final Sable all-jar: ${finalJar}")
        }
        if (!companionJar.isFile()) {
            throw new GradleException("Production Companion nested jar is missing: ${companionJar}")
        }

        File tempJar = new File(finalJar.parentFile, finalJar.name + '.m9.6-companion.tmp')
        def entries = [:]
        def metadata = null
        ZipInputStream input = new ZipInputStream(new BufferedInputStream(new FileInputStream(finalJar)))
        try {
            def entry
            while ((entry = input.nextEntry) != null) {
                if (entry.directory) {
                    continue
                }
                byte[] contents = input.readAllBytes()
                if (entry.name == companionBackportJarJarPath) {
                    continue
                }
                if (entry.name == 'META-INF/jarjar/metadata.json') {
                    metadata = new JsonSlurper().parseText(new String(contents, 'UTF-8'))
                    continue
                }
                entries[entry.name] = contents
            }
        } finally {
            input.close()
        }
        if (metadata == null) {
            throw new GradleException('Final Sable all-jar is missing META-INF/jarjar/metadata.json')
        }
        def companionRows = metadata.jars.findAll { row ->
            row.identifier.group == companionBackportGroup && row.identifier.artifact == companionBackportArtifact
        }
        if (companionRows.size() != 1 || companionRows[0].path != companionBackportJarJarPath
                || companionRows[0].version.artifactVersion != sable_companion_version) {
            throw new GradleException("Unexpected Companion JarJar metadata row before replacement: ${companionRows}")
        }
        companionRows[0].isObfuscated = true

        entries['META-INF/jarjar/metadata.json'] = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(metadata)).getBytes('UTF-8')
        entries[companionBackportJarJarPath] = Files.readAllBytes(companionJar.toPath())

        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempJar)))
        try {
            entries.keySet().sort().each { name ->
                ZipEntry outputEntry = new ZipEntry(name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                output.write(entries[name])
                output.closeEntry()
            }
        } finally {
            output.close()
        }
        Files.move(tempJar.toPath(), finalJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("packageCompanionIntoFinalForgeArtifact PASS: nested ${companionBackportJarJarPath} "
                + "is production/SRG mapped in ${finalJar.name}")
    }
}

tasks.register('remapRapierBackportJarToProduction') {
    group = 'forge backport'
    description = 'Maps the isolated Rapier common library from named/userdev bytecode to Forge production SRG namespace.'
    dependsOn tasks.named('jarRapierBackportLibrary')
    dependsOn tasks.named('syncMixinRefmap')
    dependsOn tasks.named('compileJava')
    dependsOn tasks.named('createMcpToSrg')

    inputs.file(rapierBackportNamedJar)
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    inputs.files(configurations.compileClasspath)
    inputs.files(sourceSets.main.output.classesDirs)
    outputs.file(rapierBackportProductionJar)

    doLast {
        File namedJar = rapierBackportNamedJar.get().asFile
        File productionJar = rapierBackportProductionJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        if (!namedJar.isFile()) {
            throw new GradleException("Named Rapier backport jar is missing: ${namedJar}")
        }
        if (!mappingsFile.isFile()) {
            throw new GradleException("Rapier production remap requires ${mappingsFile}")
        }
        def hierarchyClasspath = productionRemapHierarchyClasspath()
        def result = RapierProductionJarMapper.mapNamedToProduction(
                namedJar, mappingsFile, productionJar, hierarchyClasspath)
        if (!result.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    "Rapier production jar still contains named Minecraft member references: "
                            + result.namedMinecraftMemberReferences.take(20)
            )
        }
        if (result.minecraftReferenceOwners.isEmpty() || result.productionMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    'Rapier production remap did not prove any Minecraft member references; namespace check would be vacuous'
            )
        }
        if (!result.unresolvedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException(
                    "Rapier production jar contains unresolved Minecraft member references: "
                            + result.unresolvedMinecraftMemberReferences.take(20)
            )
        }
        logger.lifecycle("remapRapierBackportJarToProduction PASS: inputSha256=${result.inputSha256}, "
                + "outputSha256=${result.outputSha256}, transformedClasses=${result.transformedClasses}, "
                + "memberReferenceRemaps=${result.memberReferenceRemaps}, "
                + "inheritedMemberReferenceRemaps=${result.inheritedMemberReferenceRemaps}, "
                + "handleReferenceRemaps=${result.invokedynamicHandleRemaps}, "
                + "indySamNameRemaps=${result.invokedynamicSamNameRemaps}, "
                + "invokedynamicSites=${result.totalInvokedynamicSites}, "
                + "lambdaMetafactorySites=${result.lambdaMetafactorySites}, "
                + "minecraftLambdaSites=${result.minecraftLambdaMetafactorySites}, "
                + "minecraftOwners=${result.minecraftReferenceOwners.size()}, "
                + "productionMemberRefs=${result.productionMinecraftMemberReferences.size()}")
    }
}

tasks.register('packageRapierIntoFinalForgeArtifact') {
    group = 'forge backport'
    description = 'Nests the production Rapier library and its LZ4 runtime dependency into the existing final Sable all-jar.'
    dependsOn tasks.named('packageCompanionIntoFinalForgeArtifact')
    dependsOn tasks.named('remapRapierBackportJarToProduction')

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(rapierBackportProductionJar)
    inputs.file(rapierLz4Jar ?: file('missing-lz4-java-1.11.0.jar'))
    outputs.upToDateWhen { false }

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File rapierJar = rapierBackportProductionJar.get().asFile
        if (!finalJar.isFile()) {
            throw new GradleException(
                    "M8.3 packaging requires the already-built final Sable all-jar: ${finalJar}"
            )
        }
        if (!rapierJar.isFile()) {
            throw new GradleException("Production Rapier nested jar is missing: ${rapierJar}")
        }
        if (rapierLz4Jar == null || !rapierLz4Jar.isFile()) {
            throw new GradleException("Cached at.yawk.lz4:lz4-java:${rapierLz4Version} jar is missing")
        }
        if (sha256(rapierLz4Jar) != rapierLz4Sha256) {
            throw new GradleException("Unexpected LZ4 runtime jar SHA-256: ${sha256(rapierLz4Jar)}")
        }

        File tempJar = new File(finalJar.parentFile, finalJar.name + '.m8.3.tmp')
        def entries = [:]
        def metadata = null
        ZipInputStream input = new ZipInputStream(new BufferedInputStream(new FileInputStream(finalJar)))
        try {
            def entry
            while ((entry = input.nextEntry) != null) {
                if (entry.directory) {
                    continue
                }
                byte[] contents = input.readAllBytes()
                if (entry.name == rapierBackportJarJarPath || entry.name == rapierLz4JarJarPath) {
                    continue
                }
                if (entry.name == 'META-INF/jarjar/metadata.json') {
                    metadata = new JsonSlurper().parseText(new String(contents, 'UTF-8'))
                    continue
                }
                entries[entry.name] = contents
            }
        } finally {
            input.close()
        }
        if (metadata == null) {
            throw new GradleException('Final Sable all-jar is missing META-INF/jarjar/metadata.json')
        }

        metadata.jars.removeAll { row ->
            (row.identifier.group == rapierBackportGroup && row.identifier.artifact == rapierBackportArtifact)
                    || (row.identifier.group == 'at.yawk.lz4' && row.identifier.artifact == 'lz4-java')
        }
        metadata.jars << [
                identifier  : [group: rapierBackportGroup, artifact: rapierBackportArtifact],
                version     : [range: "[${version},)", artifactVersion: version.toString()],
                path        : rapierBackportJarJarPath,
                isObfuscated: true
        ]
        metadata.jars << [
                identifier  : [group: 'at.yawk.lz4', artifact: 'lz4-java'],
                version     : [range: "[${rapierLz4Version},)", artifactVersion: rapierLz4Version],
                path        : rapierLz4JarJarPath,
                isObfuscated: false
        ]

        entries['META-INF/jarjar/metadata.json'] = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(metadata)).getBytes('UTF-8')
        entries[rapierBackportJarJarPath] = Files.readAllBytes(rapierJar.toPath())
        entries[rapierLz4JarJarPath] = Files.readAllBytes(rapierLz4Jar.toPath())

        ZipOutputStream output = new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(tempJar)))
        try {
            entries.keySet().sort().each { name ->
                ZipEntry outputEntry = new ZipEntry(name)
                outputEntry.time = 0L
                output.putNextEntry(outputEntry)
                output.write(entries[name])
                output.closeEntry()
            }
        } finally {
            output.close()
        }
        Files.move(tempJar.toPath(), finalJar.toPath(), StandardCopyOption.REPLACE_EXISTING)
        logger.lifecycle("packageRapierIntoFinalForgeArtifact PASS: nested ${rapierBackportJarJarPath} "
                + "and ${rapierLz4JarJarPath} into ${finalJar.name}")
    }
}

tasks.register('verifyRapierPackagedArtifact') {
    group = 'verification'
    description = 'Verifies M8.3 Rapier JarJar packaging, provider selection, namespace, native ownership, and dependency boundary.'
    dependsOn tasks.named('packageRapierIntoFinalForgeArtifact')
    inputs.files(configurations.compileClasspath)
    inputs.files(sourceSets.main.output.classesDirs)

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File rapierJar = rapierBackportProductionJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        String physicsProviderService = 'META-INF/services/dev.ryanhcode.sable.api.physics.PhysicsPipelineProvider'
        String rapierProvider = 'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipelineProvider'
        String staticProvider = 'dev.ryanhcode.sable.physics.impl.none.StaticPhysicsPipelineProvider'
        String rapierProviderClass = rapierProvider.replace('.', '/') + '.class'
        String staticProviderClass = staticProvider.replace('.', '/') + '.class'
        String nativePayloadPath = 'natives/sable_rapier/sable_rapier_binaries.zip.l4z'

        def readNestedJar = { JarFile outer, String path ->
            def nestedEntry = outer.getJarEntry(path)
            if (nestedEntry == null) {
                throw new GradleException("Final artifact is missing nested jar ${path}")
            }
            byte[] nestedBytes = outer.getInputStream(nestedEntry).readAllBytes()
            def nestedEntries = [:]
            new java.util.jar.JarInputStream(new ByteArrayInputStream(nestedBytes)).withCloseable { nested ->
                def entry
                while ((entry = nested.nextJarEntry) != null) {
                    if (!entry.directory) {
                        nestedEntries[entry.name] = nested.readAllBytes()
                    }
                }
            }
            [bytes: nestedBytes, entries: nestedEntries]
        }
        def providersFrom = { byte[] bytes ->
            new String(bytes, 'UTF-8')
                    .readLines()
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() && !it.startsWith('#') }
        }
        def packageOf = { String classEntry ->
            int slash = classEntry.lastIndexOf('/')
            slash < 0 ? '<default>' : classEntry.substring(0, slash).replace('/', '.')
        }
        def classPackages = { Collection<String> entries ->
            entries.findAll { it.endsWith('.class') }.collect { packageOf(it) }.toSet()
        }
        def containsAnyText = { Map<String, byte[]> entries, List<String> needles ->
            entries.findAll { name, bytes ->
                if (!name.endsWith('.class')) {
                    return false
                }
                String text = new String(bytes, StandardCharsets.ISO_8859_1)
                needles.any { text.contains(it) }
            }.keySet().sort()
        }

        JarFile outer = new JarFile(finalJar)
        try {
            def outerEntries = outer.entries().toList()
            def outerEntryNames = outerEntries.collect { it.name }
            def metadataEntry = outer.getJarEntry('META-INF/jarjar/metadata.json')
            if (metadataEntry == null) {
                throw new GradleException('Final artifact is missing JarJar metadata')
            }
            def metadata = new JsonSlurper().parse(outer.getInputStream(metadataEntry))
            def nestedRows = metadata.jars ?: []
            def rapierRows = nestedRows.findAll { row ->
                row.identifier.group == rapierBackportGroup && row.identifier.artifact == rapierBackportArtifact
            }
            if (rapierRows.size() != 1 || rapierRows[0].path != rapierBackportJarJarPath
                    || rapierRows[0].version.artifactVersion != version.toString()
                    || rapierRows[0].isObfuscated != true) {
                throw new GradleException("Unexpected Rapier JarJar metadata row: ${rapierRows}")
            }
            def lz4Rows = nestedRows.findAll { row ->
                row.identifier.group == 'at.yawk.lz4' && row.identifier.artifact == 'lz4-java'
            }
            if (lz4Rows.size() != 1 || lz4Rows[0].path != rapierLz4JarJarPath
                    || lz4Rows[0].version.artifactVersion != rapierLz4Version
                    || lz4Rows[0].isObfuscated != false) {
                throw new GradleException("Unexpected LZ4 JarJar metadata row: ${lz4Rows}")
            }
            def companionRows = nestedRows.findAll {
                it.identifier.group == companionBackportGroup
                        && it.identifier.artifact == companionBackportArtifact
                        && it.path == companionBackportJarJarPath
                        && it.version.artifactVersion == sable_companion_version
                        && it.isObfuscated == true
            }
            if (companionRows.size() != 1) {
                throw new GradleException('Companion JarJar metadata row is no longer exactly one')
            }
            if (nestedRows.findAll { it.identifier.group == 'io.github.llamalad7'
                    && it.identifier.artifact == 'mixinextras-forge' }.size() != 1) {
                throw new GradleException('MixinExtras JarJar metadata row is no longer exactly one')
            }
            def forbiddenRows = nestedRows.findAll { row ->
                String coordinates = "${row.identifier.group}:${row.identifier.artifact}:${row.version.artifactVersion}".toLowerCase(Locale.ROOT)
                coordinates.contains('create') || coordinates.contains('flywheel')
                        || coordinates.contains('ponder') || coordinates.contains('registrate')
                        || coordinates.contains('veil')
            }
            if (!forbiddenRows.isEmpty()) {
                throw new GradleException("Target runtime dependency was bundled into Sable: ${forbiddenRows}")
            }

            def rapierNested = readNestedJar(outer, rapierBackportJarJarPath)
            def lz4Nested = readNestedJar(outer, rapierLz4JarJarPath)
            def companionRow = companionRows[0]
            def companionNested = readNestedJar(outer, companionRow.path as String)

            def outerClasses = outerEntryNames.findAll {
                it.endsWith('.class') && !it.startsWith('META-INF/jarjar/')
            }
            def rapierClasses = rapierNested.entries.keySet().findAll { it.endsWith('.class') }.sort()
            if (rapierClasses.size() != 16) {
                throw new GradleException("Expected 16 Rapier classes, found ${rapierClasses.size()}: ${rapierClasses}")
            }
            if (!rapierNested.entries.containsKey(rapierProviderClass)) {
                throw new GradleException("Nested Rapier jar is missing provider class ${rapierProviderClass}")
            }
            if (outerClasses.contains(rapierProviderClass)
                    || outerClasses.any { it.startsWith('dev/ryanhcode/sable/physics/impl/rapier/') }) {
                throw new GradleException('Rapier classes leaked into the outer Sable jar')
            }
            if (outer.getJarEntry(staticProviderClass) == null) {
                throw new GradleException("Outer Sable jar is missing static fallback provider ${staticProviderClass}")
            }
            if (companionNested.entries.keySet().any { it.startsWith('dev/ryanhcode/sable/physics/impl/rapier/') }) {
                throw new GradleException('Rapier classes leaked into nested Companion jar')
            }
            if (rapierNested.entries.keySet().any { it.startsWith('dev/ryanhcode/sable/companion/') }) {
                throw new GradleException('Companion classes leaked into nested Rapier jar')
            }
            if (rapierNested.entries.containsKey('META-INF/mods.toml')
                    || rapierNested.entries.containsKey('META-INF/neoforge.mods.toml')) {
                throw new GradleException('Nested Rapier library unexpectedly contains mod metadata')
            }

            def outerServiceEntry = outer.getJarEntry(physicsProviderService)
            if (outerServiceEntry == null) {
                throw new GradleException("Outer Sable jar is missing ${physicsProviderService}")
            }
            def outerProviders = providersFrom(outer.getInputStream(outerServiceEntry).readAllBytes())
            if (outerProviders != [staticProvider]) {
                throw new GradleException("Unexpected outer physics providers: ${outerProviders}")
            }
            if (!rapierNested.entries.containsKey(physicsProviderService)) {
                throw new GradleException('Nested Rapier jar is missing physics provider service descriptor')
            }
            def rapierProviders = providersFrom(rapierNested.entries[physicsProviderService])
            if (rapierProviders != [rapierProvider]) {
                throw new GradleException("Unexpected nested Rapier physics providers: ${rapierProviders}")
            }
            def effectiveProviders = (outerProviders + rapierProviders).toSet()
            if (effectiveProviders != ([staticProvider, rapierProvider] as Set)) {
                throw new GradleException("Unexpected effective physics provider set: ${effectiveProviders}")
            }
            File providerApiSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/api/physics/PhysicsPipelineProvider.java')
            File rapierProviderSource = rootProject.file('sable_rapier/src/main/java/dev/ryanhcode/sable/physics/impl/rapier/RapierPhysicsPipelineProvider.java')
            File staticProviderSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/physics/impl/none/StaticPhysicsPipelineProvider.java')
            if (!providerApiSource.getText('UTF-8').contains('.stream().max(Comparator.comparingInt')) {
                throw new GradleException('Physics provider selection is no longer max-priority based')
            }
            if (!rapierProviderSource.getText('UTF-8').contains('@PhysicsPipelineProvider.LoadPriority()')
                    || !providerApiSource.getText('UTF-8').contains('int value() default 1000;')) {
                throw new GradleException('Rapier provider priority 1000 is no longer statically proven')
            }
            if (!staticProviderSource.getText('UTF-8').contains('@PhysicsPipelineProvider.LoadPriority(900)')) {
                throw new GradleException('Static fallback priority 900 is no longer statically proven')
            }

            def nativeOwners = []
            if (outer.getJarEntry(nativePayloadPath) != null) {
                nativeOwners << 'outer'
            }
            if (rapierNested.entries.containsKey(nativePayloadPath)) {
                nativeOwners << 'rapier'
            }
            if (companionNested.entries.containsKey(nativePayloadPath)) {
                nativeOwners << 'companion'
            }
            if (nativeOwners != ['rapier']) {
                throw new GradleException("Rapier native archive owners were ${nativeOwners}, expected [rapier]")
            }
            if (sha256Bytes(rapierNested.entries[nativePayloadPath]) != rapierNativeSha256) {
                throw new GradleException("Unexpected nested Rapier native archive SHA-256: "
                        + sha256Bytes(rapierNested.entries[nativePayloadPath]))
            }
            def extractedNativeLeaks = (outerEntryNames + rapierNested.entries.keySet()
                    + companionNested.entries.keySet()).findAll { entry ->
                entry ==~ /(?i).*\.(dll|so|dylib)$/
            }
            if (!extractedNativeLeaks.isEmpty()) {
                throw new GradleException("Extracted Rapier/Sable native binary leaked outside the native archive: ${extractedNativeLeaks}")
            }

            if (!lz4Nested.entries.containsKey('net/jpountz/lz4/LZ4FrameInputStream.class')) {
                throw new GradleException('Nested LZ4 runtime jar does not contain LZ4FrameInputStream')
            }
            if (sha256Bytes(lz4Nested.bytes) != rapierLz4Sha256) {
                throw new GradleException("Nested LZ4 runtime jar SHA mismatch: ${sha256Bytes(lz4Nested.bytes)}")
            }
            def jpountzLeaks = (outerClasses + rapierClasses + companionNested.entries.keySet()).findAll {
                it.startsWith('net/jpountz/')
            }
            if (!jpountzLeaks.isEmpty()) {
                throw new GradleException("LZ4 classes leaked outside nested LZ4 jar: ${jpountzLeaks}")
            }

            def mavenRuntimeHits = containsAnyText(rapierNested.entries, ['org/apache/maven', 'org.apache.maven'])
            if (!mavenRuntimeHits.isEmpty()) {
                throw new GradleException("Rapier runtime bytecode still references Maven Artifact classes: ${mavenRuntimeHits}")
            }
            if (nestedRows.any { row -> "${row.identifier.group}:${row.identifier.artifact}".contains('maven') }) {
                throw new GradleException('Maven Artifact was unexpectedly packaged at runtime')
            }

            def outerPackages = classPackages(outerClasses)
            def companionPackages = classPackages(companionNested.entries.keySet())
            def rapierPackages = classPackages(rapierClasses)
            def splitPackages = [
                    'outer/companion': outerPackages.intersect(companionPackages).sort(),
                    'outer/rapier'   : outerPackages.intersect(rapierPackages).sort(),
                    'companion/rapier': companionPackages.intersect(rapierPackages).sort()
            ].findAll { ignored, packages -> !packages.isEmpty() }
            if (!splitPackages.isEmpty()) {
                throw new GradleException("Package split between nested libraries and outer Sable: ${splitPackages}")
            }

            def devLeaks = (outerEntryNames + rapierNested.entries.keySet() + companionNested.entries.keySet()).findAll { entry ->
                entry.contains('build/classes') || entry.contains('build/resources')
                        || entry.contains('.gradle/') || entry.endsWith('.java')
            }
            if (!devLeaks.isEmpty()) {
                throw new GradleException("Development output/source leaked into packaged artifact: ${devLeaks}")
            }

            if (sha256Bytes(rapierNested.bytes) != sha256(rapierJar)) {
                throw new GradleException('Nested Rapier jar bytes differ from remapped production Rapier jar output')
            }
            def hierarchyClasspath = productionRemapHierarchyClasspath()
            def referenceReport = RapierProductionJarMapper.referenceReport(
                    rapierJar, mappingsFile, hierarchyClasspath)
        if (referenceReport.minecraftReferenceOwners.isEmpty()
                || referenceReport.productionMinecraftMemberReferences.isEmpty()
                || !referenceReport.namedMinecraftMemberReferences.isEmpty()
                || !referenceReport.unresolvedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Rapier production namespace verification failed: "
                    + "owners=${referenceReport.minecraftReferenceOwners.size()}, "
                    + "productionRefs=${referenceReport.productionMinecraftMemberReferences.size()}, "
                    + "namedRefs=${referenceReport.namedMinecraftMemberReferences.take(20)}, "
                    + "unresolvedRefs=${referenceReport.unresolvedMinecraftMemberReferences.take(20)}, "
                    + "invokedynamicSites=${referenceReport.totalInvokedynamicSites}, "
                    + "lambdaMetafactorySites=${referenceReport.lambdaMetafactorySites}, "
                    + "minecraftLambdaSites=${referenceReport.minecraftLambdaMetafactorySites}")
            }

            logger.lifecycle("verifyRapierPackagedArtifact PASS: nested=${rapierBackportGroup}:${rapierBackportArtifact}:${version}, "
                    + "rapierClasses=${rapierClasses.size()}, productionMinecraftRefs="
                    + "${referenceReport.productionMinecraftMemberReferences.size()}, nativeSha256=${rapierNativeSha256}, "
                    + "lz4=${rapierLz4JarJarPath}, mavenArtifactRuntime=false, providers=[Rapier:1000, Static:900], "
                    + "winner=${rapierProvider}, splitPackages=0")
        } finally {
            outer.close()
        }
    }
}

tasks.register('verifyRapierProductionNamespace') {
    group = 'verification'
    description = 'Verifies every Minecraft member reference in the final nested Rapier jar against the production hierarchy.'
    dependsOn tasks.named('verifyRapierPackagedArtifact')

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    inputs.files(configurations.compileClasspath)
    inputs.files(sourceSets.main.output.classesDirs)

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        File extractedRapier = layout.buildDirectory.file(
                'verification/rapierProductionNamespace/sable-rapier-common-1.20.1-2.0.0.jar').get().asFile
        byte[] rapierBytes
        JarFile outer = new JarFile(finalJar)
        try {
            def rapierEntries = outer.entries().toList().findAll { it.name == rapierBackportJarJarPath }
            if (rapierEntries.size() != 1) {
                throw new GradleException("Expected one nested Rapier jar, found ${rapierEntries.size()}")
            }
            rapierBytes = outer.getInputStream(rapierEntries[0]).readAllBytes()
            [
                    'META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar',
                    rapierLz4JarJarPath
            ].each { nestedPath ->
                if (outer.entries().toList().count { it.name == nestedPath } != 1) {
                    throw new GradleException("Expected exactly one unchanged nested dependency ${nestedPath}")
                }
            }
        } finally {
            outer.close()
        }
        extractedRapier.parentFile.mkdirs()
        Files.write(extractedRapier.toPath(), rapierBytes)

        def hierarchyClasspath = productionRemapHierarchyClasspath()
        def report = RapierProductionJarMapper.referenceReport(
                extractedRapier, mappingsFile, hierarchyClasspath)
        if (!report.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Nested production Rapier contains stale named Minecraft references: "
                    + report.namedMinecraftMemberReferences.take(30))
        }
        if (!report.unresolvedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Nested production Rapier contains unresolved Minecraft references: "
                    + report.unresolvedMinecraftMemberReferences.take(30))
        }
        if (report.productionMinecraftMemberReferences.isEmpty()) {
            throw new GradleException('Nested production Rapier member verification would be vacuous')
        }

        String blockStateDescriptor = '(Lnet/minecraft/core/BlockPos;)Lnet/minecraft/world/level/block/state/BlockState;'
        String expectedBlockStateReference = 'METHOD net/minecraft/server/level/ServerLevel.m_8055_' + blockStateDescriptor
        String staleBlockStateReference = 'METHOD net/minecraft/server/level/ServerLevel.getBlockState' + blockStateDescriptor
        def handleBlockChangeReferences = RapierProductionJarMapper.instructionMemberReferences(
                extractedRapier,
                'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipeline',
                'handleBlockChange')
        if (!handleBlockChangeReferences.contains(expectedBlockStateReference)
                || handleBlockChangeReferences.contains(staleBlockStateReference)) {
            def blockStateReferences = handleBlockChangeReferences.findAll {
                it.contains('ServerLevel') && it.contains('BlockState')
            }
            throw new GradleException(
                    "RapierPhysicsPipeline.handleBlockChange has the wrong production ServerLevel "
                            + "block-state reference: ${blockStateReferences}")
        }

        String expectedLevelAcceleratorBlockStateReference =
                'METHOD dev/ryanhcode/sable/util/LevelAccelerator.m_8055_' + blockStateDescriptor
        String staleLevelAcceleratorBlockStateReference =
                'METHOD dev/ryanhcode/sable/util/LevelAccelerator.getBlockState' + blockStateDescriptor
        def handleChunkSectionAdditionReferences = RapierProductionJarMapper.instructionMemberReferences(
                extractedRapier,
                'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipeline',
                'handleChunkSectionAddition',
                '(Lnet/minecraft/world/level/chunk/LevelChunkSection;IIIZ)V')
        if (!handleChunkSectionAdditionReferences.contains(expectedLevelAcceleratorBlockStateReference)
                || handleChunkSectionAdditionReferences.contains(staleLevelAcceleratorBlockStateReference)) {
            def levelAcceleratorReferences = handleChunkSectionAdditionReferences.findAll {
                it.contains('LevelAccelerator') && it.contains('BlockState')
            }
            throw new GradleException(
                    "RapierPhysicsPipeline.handleChunkSectionAddition has the wrong production "
                            + "LevelAccelerator block-state reference: ${levelAcceleratorReferences}")
        }

        File extractedCompanion = layout.buildDirectory.file(
                "verification/rapierProductionNamespace/${companionBackportJarName}").get().asFile
        JarFile finalOuterForCompanion = new JarFile(finalJar)
        try {
            def companionEntries = finalOuterForCompanion.entries().toList().findAll {
                it.name == companionBackportJarJarPath
            }
            if (companionEntries.size() != 1) {
                throw new GradleException("Expected one nested Companion jar for ABI check, found ${companionEntries.size()}")
            }
            extractedCompanion.parentFile.mkdirs()
            Files.write(extractedCompanion.toPath(),
                    finalOuterForCompanion.getInputStream(companionEntries[0]).readAllBytes())
        } finally {
            finalOuterForCompanion.close()
        }
        def rapierSableAbi = RapierProductionJarMapper.crossArtifactAbiReport(
                extractedRapier,
                [finalJar, extractedCompanion],
                'dev/ryanhcode/sable/')
        if (!rapierSableAbi.passed()) {
            throw new GradleException("Nested Rapier has unresolved packaged Sable ABI references: "
                    + "classes=${rapierSableAbi.unresolvedClasses.take(20)}, "
                    + "methods=${rapierSableAbi.unresolvedMethods.take(20)}, "
                    + "fields=${rapierSableAbi.unresolvedFields.take(20)}")
        }
        if (!rapierSableAbi.resolvedMethods.contains(
                'dev/ryanhcode/sable/util/LevelAccelerator.m_8055_' + blockStateDescriptor)) {
            throw new GradleException('Nested Rapier did not prove linkage to production LevelAccelerator.m_8055_')
        }

        String expectedDoubleLineConsumerSam =
                'INDY_SAM net/minecraft/world/phys/shapes/Shapes$DoubleLineConsumer.m_83161_(DDDDDD)V'
        def staleDoubleLineConsumerSam = report.namedMinecraftMemberReferences.findAll {
            it.contains('INDY_SAM net/minecraft/world/phys/shapes/Shapes$DoubleLineConsumer.consume(DDDDDD)V')
        }
        if (!report.productionMinecraftMemberReferences.contains(expectedDoubleLineConsumerSam)
                || !staleDoubleLineConsumerSam.isEmpty()) {
            throw new GradleException(
                    "RapierVoxelColliderBakery DoubleLineConsumer lambda has the wrong production SAM name: "
                            + "expected=${expectedDoubleLineConsumerSam}, stale=${staleDoubleLineConsumerSam}")
        }

        JarFile rapier = new JarFile(extractedRapier)
        try {
            def nativeEntries = rapier.entries().toList().findAll {
                it.name == 'natives/sable_rapier/sable_rapier_binaries.zip.l4z'
            }
            if (nativeEntries.size() != 1
                    || sha256Bytes(rapier.getInputStream(nativeEntries[0]).readAllBytes()) != rapierNativeSha256) {
                throw new GradleException('Nested Rapier native ownership/hash changed during namespace repair')
            }
        } finally {
            rapier.close()
        }

        logger.lifecycle('verifyRapierProductionNamespace PASS: inherited ServerLevel.getBlockState -> '
                + 'BlockGetter.m_8055_, productionRefs='
                + "${report.productionMinecraftMemberReferences.size()}, namedRefs=0, unresolvedRefs=0, "
                + "rapierSableAbiClasses=${rapierSableAbi.resolvedClasses.size()}, "
                + "rapierSableAbiMethods=${rapierSableAbi.resolvedMethods.size()}, "
                + "rapierSableAbiFields=${rapierSableAbi.resolvedFields.size()}, "
                + "invokedynamicSites=${report.totalInvokedynamicSites}, "
                + "lambdaMetafactorySites=${report.lambdaMetafactorySites}, "
                + "minecraftLambdaSites=${report.minecraftLambdaMetafactorySites}, "
                + 'DoubleLineConsumer.consume -> m_83161_, '
                + 'handles/constantDynamic=verified, nestedRapier=1, Companion/LZ4/native unchanged')
    }
}

tasks.register('verifyCompanionProductionNamespace') {
    group = 'verification'
    description = 'Verifies every Minecraft member reference in the final nested Companion jar against the production hierarchy.'
    dependsOn tasks.named('packageRapierIntoFinalForgeArtifact')
    dependsOn prepareStandaloneSableUserdevArtifact

    inputs.file(standaloneProductionSableArtifact)
    inputs.file(standaloneMappedSableRuntime)
    inputs.file(layout.buildDirectory.file('createMcpToSrg/output.tsrg'))
    inputs.file(layout.buildDirectory.file('createSrgToMcp/output.srg'))
    inputs.files(configurations.compileClasspath)
    inputs.files(sourceSets.main.output.classesDirs)

    doLast {
        File finalJar = standaloneProductionSableArtifact.get().asFile
        File mappedSableJar = standaloneMappedSableRuntime.get().asFile
        File productionMappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        File userdevMappingsFile = layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile
        File remappedCompanionJar = companionBackportProductionJar.get().asFile
        File productionCompanion = layout.buildDirectory.file(
                "verification/companionProductionNamespace/${companionBackportJarName}").get().asFile
        File userdevCompanion = layout.buildDirectory.file(
                "verification/companionProductionNamespace/${companionBackportArtifact}-${sable_companion_version}-userdev.jar").get().asFile
        String companionService = 'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion'
        String companionProvider = 'dev.ryanhcode.sable.companion.impl.DefaultSableCompanion'

        def extractNestedJar = { File outerJar, String nestedPath, File destination ->
            JarFile outer = new JarFile(outerJar)
            try {
                def nestedEntries = outer.entries().toList().findAll { it.name == nestedPath }
                if (nestedEntries.size() != 1) {
                    throw new GradleException("Expected exactly one nested ${nestedPath} in ${outerJar.name}, "
                            + "found ${nestedEntries.size()}")
                }
                destination.parentFile.mkdirs()
                Files.write(destination.toPath(), outer.getInputStream(nestedEntries[0]).readAllBytes())
            } finally {
                outer.close()
            }
        }
        extractNestedJar(finalJar, companionBackportJarJarPath, productionCompanion)
        extractNestedJar(mappedSableJar, companionBackportJarJarPath, userdevCompanion)
        if (sha256(productionCompanion) != sha256(remappedCompanionJar)) {
            throw new GradleException('Final nested Companion jar bytes differ from remapped production Companion output')
        }

        def hierarchyClasspath = productionRemapHierarchyClasspath()
        def productionReport = RapierProductionJarMapper.referenceReport(
                productionCompanion, productionMappingsFile, hierarchyClasspath)
        if (productionReport.productionMinecraftMemberReferences.isEmpty()) {
            throw new GradleException('Nested Companion production namespace check would be vacuous')
        }
        if (!productionReport.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Nested production Companion contains stale named Minecraft references: "
                    + productionReport.namedMinecraftMemberReferences.take(30))
        }
        if (!productionReport.unresolvedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Nested production Companion contains unresolved Minecraft references: "
                    + productionReport.unresolvedMinecraftMemberReferences.take(30))
        }

        String feetPosDescriptor = '(Lnet/minecraft/world/entity/Entity;FLorg/joml/Quaterniondc;)Lorg/joml/Vector3d;'
        String positionDescriptor = '()Lnet/minecraft/world/phys/Vec3;'
        String expectedPositionReference = 'METHOD net/minecraft/world/entity/Entity.m_20182_' + positionDescriptor
        String stalePositionReference = 'METHOD net/minecraft/world/entity/Entity.position' + positionDescriptor
        def feetPosReferences = RapierProductionJarMapper.instructionMemberReferences(
                productionCompanion,
                'dev.ryanhcode.sable.companion.SableCompanion',
                'getFeetPos',
                feetPosDescriptor)
        if (!feetPosReferences.contains(expectedPositionReference)
                || feetPosReferences.contains(stalePositionReference)) {
            throw new GradleException("SableCompanion.getFeetPos has the wrong production Entity.position reference: "
                    + feetPosReferences.findAll { it.contains('net/minecraft/world/entity/Entity.') })
        }

        JarFile finalOuter = new JarFile(finalJar)
        try {
            def companionOuterClasses = finalOuter.entries().toList().findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/companion/') && entry.name.endsWith('.class')
            }
            if (!companionOuterClasses.isEmpty()) {
                throw new GradleException("Companion classes leaked outside JarJar: ${companionOuterClasses*.name}")
            }
        } finally {
            finalOuter.close()
        }

        JarFile productionCompanionJar = new JarFile(productionCompanion)
        try {
            def serviceEntry = productionCompanionJar.getJarEntry(companionService)
            if (serviceEntry == null) {
                throw new GradleException("Production Companion jar is missing ${companionService}")
            }
            String serviceText = productionCompanionJar.getInputStream(serviceEntry).getText('UTF-8').trim()
            if (serviceText != companionProvider) {
                throw new GradleException("Production Companion service descriptor changed: ${serviceText}")
            }
        } finally {
            productionCompanionJar.close()
        }

        def userdevStaleReferences = SableStandaloneUserdevMapper.staleKnownMemberReferences(
                userdevCompanion,
                userdevMappingsFile,
                hierarchyClasspath)
        if (!userdevStaleReferences.references.isEmpty()) {
            throw new GradleException("Standalone userdev nested Companion has stale SRG member references: "
                    + userdevStaleReferences.references.take(30))
        }
        def userdevFeetPosReferences = SableStandaloneUserdevMapper.classReferences(
                userdevCompanion,
                'dev/ryanhcode/sable/companion/SableCompanion.class')
        if (!userdevFeetPosReferences.methods.contains(
                'net/minecraft/world/entity/Entity.position' + positionDescriptor)
                || userdevFeetPosReferences.methods.any {
            it.contains('net/minecraft/world/entity/Entity.m_20182_' + positionDescriptor)
        }) {
            throw new GradleException("Standalone userdev Companion did not remap Entity.m_20182_ back to position: "
                    + userdevFeetPosReferences.methods.findAll { it.contains('net/minecraft/world/entity/Entity.') })
        }

        def companionClasses = RapierProductionJarMapper.classEntries(productionCompanion).findAll {
            it.startsWith('dev/ryanhcode/sable/companion/')
        }
        logger.lifecycle('verifyCompanionProductionNamespace PASS: Entity.position -> Entity.m_20182_, '
                + "companionClasses=${companionClasses.size()}, productionRefs="
                + "${productionReport.productionMinecraftMemberReferences.size()}, namedRefs=0, unresolvedRefs=0, "
                + "standaloneUserdevStaleRefs=0, service=${companionProvider}")
    }
}

