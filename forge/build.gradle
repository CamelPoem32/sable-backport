def sableCheapTaskInvocation = gradle.startParameter.taskNames.any { taskName ->
    taskName == 'spotlessApply'
            || taskName.endsWith(':spotlessApply')
            || taskName == 'verifyCheapTasksDoNotResolveCompileClasspath'
            || taskName.endsWith(':verifyCheapTasksDoNotResolveCompileClasspath')
}

if (sableCheapTaskInvocation) {
    // ForgeGradle 6 validates its Minecraft userdev repository from an
    // afterEvaluate callback. A source-only invocation must therefore stop before
    // that plugin is applied; the normal branch below still applies it unchanged.
    tasks.register('verifyCheapTasksDoNotResolveCompileClasspath') {
        group = 'forge backport'
        description = 'Guards source-only Forge tasks against configuration-time Minecraft/Companion resolution.'

        inputs.file(rootProject.file('sable_companion_1_20/build.gradle'))
        inputs.file(rootProject.file('settings.gradle'))
        inputs.file(rootProject.file('forge/build.gradle'))

        doLast {
            if (pluginManager.hasPlugin('net.minecraftforge.gradle')) {
                throw new GradleException('ForgeGradle was applied during a source-only invocation')
            }
            if (configurations.findByName('_compileJava_1') != null
                    || configurations.findByName('minecraft') != null) {
                throw new GradleException('Forge userdev configurations exist during a source-only invocation')
            }
            def companionProject = project(':sable_companion_1_20')
            if (companionProject.pluginManager.hasPlugin('net.minecraftforge.gradle')) {
                throw new GradleException('Companion applied ForgeGradle during a source-only invocation')
            }

            String forgeText = rootProject.file('forge/build.gradle').getText('UTF-8')
            String companionText = rootProject.file('sable_companion_1_20/build.gradle').getText('UTF-8')
            String forgeConfigurationText = forgeText.substring(
                    0,
                    forgeText.indexOf("tasks.register('verifyCheapTasksDoNotResolveCompileClasspath')")
            )
            String forgeNormalBranch = forgeText.substring(forgeText.indexOf("apply plugin: 'net.minecraftforge.gradle'"))

            if (forgeConfigurationText.contains("evaluationDependsOn(':sable_companion_1_20')")) {
                throw new GradleException('Forge must not eagerly evaluate the Companion project for source-only tasks')
            }
            if (!forgeText.contains('if (sableCheapTaskInvocation)')
                    || !forgeText.contains("apply plugin: 'net.minecraftforge.gradle'")) {
                throw new GradleException('ForgeGradle must remain available behind an explicit task-isolation boundary')
            }
            if (companionText.contains("id 'net.minecraftforge.gradle'")
                    || companionText.contains('minecraft "net.minecraftforge:forge')) {
                throw new GradleException('Companion must remain a plain Java library; ForgeGradle/Minecraft must not configure it eagerly')
            }
            if (!companionText.contains("tasks.named('compileJava')")
                    || !companionText.contains('doFirst')
                    || !companionText.contains("classpath = project(':forge').configurations.minecraft")) {
                throw new GradleException('Companion Minecraft classpath must be attached inside compileJava.doFirst')
            }
            if (!forgeNormalBranch.contains("project(':sable_companion_1_20').provider")) {
                throw new GradleException('Forge cross-project Companion output wiring is not provider-backed')
            }

            logger.lifecycle('verifyCheapTasksDoNotResolveCompileClasspath PASS: source-only branch '
                    + 'does not apply ForgeGradle; production compile/build branch retains lazy execution-scoped classpaths')
        }
    }

    return
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'org.spongepowered.mixin'

base {
    archivesName = "${mod_id}-forge-${forge_minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(forge_java_version)
    withSourcesJar()
}

sourceSets {
    m6SableRun {
        java.setSrcDirs([])
        resources.setSrcDirs([sourceSets.main.output.resourcesDir])
        output.classesDirs.setFrom(
                sourceSets.main.output.classesDirs,
                project(':sable_companion_1_20').provider {
                    project(':sable_companion_1_20').sourceSets.main.output.classesDirs
                }
        )
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
    standaloneRuntimeLauncher {
        java.setSrcDirs([])
        resources.setSrcDirs([])
        compileClasspath = files()
        runtimeClasspath = output
    }
    rapierBackport {
        java {
            srcDir rootProject.file('sable_rapier/src/main/java')
        }
        resources {
            srcDir rootProject.file('sable_rapier/src/main/resources')
        }
        compileClasspath += sourceSets.main.output
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath = output + compileClasspath
    }
}

minecraft {
    mappings channel: 'official', version: forge_minecraft_version
    accessTransformer = project.file('src/main/resources/META-INF/accesstransformer-forge.cfg')

    runs {
        client {
            workingDirectory project.file('run/m6-client')
            property 'forge.logging.console.level', 'info'
            property 'mixin.debug.verbose', 'true'
            property 'mixin.debug.countInjections', 'true'
            property 'sable.runtimeSmoke', 'true'
            property 'sable.targetRuntimeSmoke', 'true'
            property 'veil.disableImgui', 'true'

            mods {
                sable {
                    source sourceSets.m6SableRun
                }
            }
        }

        standaloneClient {
            client true
            main 'cpw.mods.bootstraplauncher.BootstrapLauncher'
            source sourceSets.standaloneRuntimeLauncher
            workingDirectory project.file('run/standalone-client')
            args '--launchTarget', 'forgeclientuserdev'
            args '--version', 'MOD_DEV'
            args '--assetIndex', '{asset_index}'
            args '--assetsDir', '{assets_root}'
            args '--gameDir', '.'
            args '--fml.forgeVersion', forge_version
            args '--fml.mcVersion', forge_minecraft_version
            args '--fml.forgeGroup', 'net.minecraftforge'
            args '--fml.mcpVersion', '20230612.114412'
            jvmArgs '-Djava.net.preferIPv6Addresses=system'
            jvmArgs '-p', '{modules}'
            jvmArgs '--add-modules', 'ALL-MODULE-PATH'
            jvmArgs '--add-opens', 'java.base/java.util.jar=cpw.mods.securejarhandler'
            jvmArgs '--add-opens', 'java.base/java.lang.invoke=cpw.mods.securejarhandler'
            jvmArgs '--add-exports', 'java.base/sun.security.util=cpw.mods.securejarhandler'
            jvmArgs '--add-exports', 'jdk.naming.dns/com.sun.jndi.dns=java.naming'
            property 'legacyClassPath.file', '{minecraft_classpath_file}'
            property 'ignoreList',
                    ('bootstraplauncher,securejarhandler,asm-commons,asm-util,asm-analysis,asm-tree,asm,'
                            + 'JarJarFileSystems,client-extra,fmlcore,javafmllanguage,lowcodelanguage,'
                            + 'mclanguage,forge-')
            property 'mergeModules', 'jna-5.10.0.jar,jna-platform-5.10.0.jar'
            property 'forge.enableGameTest', 'true'
            property 'forge.logging.console.level', 'info'
            property 'mixin.debug.verbose', 'true'
            property 'mixin.debug.countInjections', 'true'
            property 'sable.standaloneRuntimeSmoke', 'true'
            property 'veil.disableImgui', 'true'
        }
    }
}

