tasks.register('verifyStandaloneForgeArtifact') {
    group = 'verification'
    description = 'Statically verifies the final reobfuscated Forge artifact and its JarJar-packaged Companion library.'
    dependsOn tasks.named('reobfJarJar')
    dependsOn project(':sable_companion_1_20').tasks.named('jar')

    doLast {
        File forgeArchive = tasks.named('jarJar').get().archiveFile.get().asFile
        JarFile forgeJar = new JarFile(forgeArchive)
        try {
            def outerEntries = forgeJar.entries().toList()
            def requireEntry = { String entry ->
                if (forgeJar.getJarEntry(entry) == null) {
                    throw new GradleException("Final Forge artifact is missing ${entry}")
                }
            }
            def readText = { String entry ->
                def jarEntry = forgeJar.getJarEntry(entry)
                if (jarEntry == null) {
                    throw new GradleException("Final Forge artifact is missing ${entry}")
                }
                forgeJar.getInputStream(jarEntry).getText('UTF-8')
            }
            def readNestedJar = { String entry ->
                def jarEntry = forgeJar.getJarEntry(entry)
                if (jarEntry == null) {
                    throw new GradleException("Final Forge artifact is missing nested jar ${entry}")
                }
                byte[] bytes = forgeJar.getInputStream(jarEntry).readAllBytes()
                def nestedEntries = [:]
                def classMajors = [:]
                new java.util.jar.JarInputStream(new ByteArrayInputStream(bytes)).withCloseable { nested ->
                    def nestedEntry
                    while ((nestedEntry = nested.nextJarEntry) != null) {
                        if (nestedEntry.directory) {
                            continue
                        }
                        byte[] contents = nested.readAllBytes()
                        nestedEntries[nestedEntry.name] = contents
                        if (nestedEntry.name.endsWith('.class')) {
                            if (contents.length < 8) {
                                throw new GradleException("Nested class ${nestedEntry.name} has no class header")
                            }
                            int major = ((contents[6] & 0xFF) << 8) | (contents[7] & 0xFF)
                            classMajors[nestedEntry.name] = major
                        }
                    }
                }
                [entries: nestedEntries, classMajors: classMajors]
            }
            def packageName = { String classEntryName ->
                int slash = classEntryName.lastIndexOf('/')
                slash < 0 ? '<default>' : classEntryName.substring(0, slash).replace('/', '.')
            }
            def classPackages = { Collection<String> entryNames ->
                entryNames.findAll { it.endsWith('.class') }
                        .collect { packageName(it) }
                        .toSet()
            }
            def providerPackages = { Collection<String> providerNames ->
                providerNames.collect { provider ->
                    int dot = provider.lastIndexOf('.')
                    dot < 0 ? '<default>' : provider.substring(0, dot)
                }.toSet()
            }
            def serviceProviders = { byte[] bytes ->
                new String(bytes, 'UTF-8')
                        .readLines()
                        .collect { it.trim() }
                        .findAll { !it.isEmpty() && !it.startsWith('#') }
            }

            def requiredEntries = [
                    'dev/ryanhcode/sable/forge/SableForge.class',
                    'META-INF/mods.toml',
                    'META-INF/accesstransformer-forge.cfg',
                    'sable-common-forge.mixins.json',
                    'sable-forge.mixins.json',
                    'sable.refmap.json',
                    'META-INF/jarjar/metadata.json'
            ]
            requiredEntries.each(requireEntry)

            forgeServiceProviders.each { service, provider ->
                String servicePath = "META-INF/services/${service}"
                def entry = forgeJar.getJarEntry(servicePath)
                if (entry == null) {
                    throw new GradleException("Final Forge artifact is missing ${servicePath}")
                }
                String content = forgeJar.getInputStream(entry).getText('UTF-8').trim()
                if (content != provider) {
                    throw new GradleException("Unexpected provider in ${servicePath}: ${content}")
                }
                String providerClass = provider.replace('.', '/') + '.class'
                if (forgeJar.getJarEntry(providerClass) == null) {
                    throw new GradleException("Final Forge artifact is missing provider class ${providerClass}")
                }
            }

            String companionServicePath = 'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion'
            def companionProviders = readText(companionServicePath)
                    .readLines()
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() && !it.startsWith('#') }
            def expectedCompanionProviders = [
                    'dev.ryanhcode.sable.ActiveSableCompanion'
            ]
            if (companionProviders != expectedCompanionProviders) {
                throw new GradleException(
                        "Unexpected Companion providers in ${companionServicePath}: ${companionProviders}"
                )
            }

            if (forgeJar.manifest.mainAttributes.getValue('FMLAT') != 'accesstransformer-forge.cfg') {
                throw new GradleException('Final Forge artifact manifest has no curated FMLAT')
            }
            if (!file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java').getText('UTF-8').contains('@Mod(Sable.MOD_ID)')) {
                throw new GradleException('Forge bootstrap source is missing @Mod(Sable.MOD_ID)')
            }

            def deferredPrefixes = [
                    'dev/ryanhcode/sable/debug/',
                    'dev/ryanhcode/sable/render/dynamic_shade/',
                    'dev/ryanhcode/sable/render/region/',
                    'dev/ryanhcode/sable/sublevel/render/fancy/',
                    'dev/ryanhcode/sable/mixin/entity/entity_leashing/',
                    'dev/ryanhcode/sable/mixin/entity/entity_pathfinding/',
                    'dev/ryanhcode/sable/mixin/camera/camera_zoom/MouseHandlerMixin.class',
                    'dev/ryanhcode/sable/mixinhelpers/camera/new_camera_types/',
                    'dev/ryanhcode/sable/mixinterface/camera/camera_zoom/CameraZoomExtension.class',
                    'dev/ryanhcode/sable/mixin/sublevel_render/block_entity_render/',
                    'dev/ryanhcode/sable/mixin/loaded_chunk_debug/'
            ]
            def deferredEntries = forgeJar.entries().toList().findAll { entry ->
                deferredPrefixes.any { prefix -> entry.name.startsWith(prefix) }
            }
            if (!deferredEntries.isEmpty()) {
                throw new GradleException("Deferred classes leaked into final Forge artifact: ${deferredEntries*.name}")
            }

            def metadata = new JsonSlurper().parseText(readText('META-INF/jarjar/metadata.json'))
            def nestedRows = metadata.jars ?: []
            def companionRows = nestedRows.findAll { row ->
                row.identifier.group == 'dev.ryanhcode.sable-companion'
                        && row.version.artifactVersion == sable_companion_version
            }
            if (companionRows.size() != 1) {
                throw new GradleException("Expected one Companion JarJar metadata row, found ${companionRows}")
            }
            def mixinExtrasRows = nestedRows.findAll { row ->
                row.identifier.group == 'io.github.llamalad7'
                        && row.identifier.artifact == 'mixinextras-forge'
                        && row.version.artifactVersion == '0.5.3'
            }
            if (mixinExtrasRows.size() != 1) {
                throw new GradleException("Expected one MixinExtras Forge 0.5.3 JarJar row, found ${mixinExtrasRows}")
            }

            def forbiddenNestedRows = nestedRows.findAll { row ->
                String coordinates = "${row.identifier.group}:${row.identifier.artifact}:${row.version.artifactVersion}".toLowerCase(Locale.ROOT)
                coordinates.contains('create')
                        || coordinates.contains('flywheel')
                        || coordinates.contains('ponder')
                        || coordinates.contains('registrate')
                        || coordinates.contains('veil')
            }
            if (!forbiddenNestedRows.isEmpty()) {
                throw new GradleException("External target dependency was bundled into Sable: ${forbiddenNestedRows}")
            }

            def companionOuterClasses = outerEntries.findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/companion/') && entry.name.endsWith('.class')
            }
            if (!companionOuterClasses.isEmpty()) {
                throw new GradleException("Companion classes leaked outside JarJar: ${companionOuterClasses*.name}")
            }

            def outerClassPackages = classPackages(outerEntries.findAll {
                !it.name.startsWith('META-INF/jarjar/')
            }.collect { it.name })
            def outerServiceProviders = outerEntries.findAll {
                it.name.startsWith('META-INF/services/') && !it.directory
            }.collectMany { entry ->
                readText(entry.name)
                        .readLines()
                        .collect { it.trim() }
                        .findAll { !it.isEmpty() && !it.startsWith('#') }
            }
            def outerModulePackages = (outerClassPackages + providerPackages(outerServiceProviders)).toSet()

            def companionJar = readNestedJar(companionRows[0].path)
            [
                    'dev/ryanhcode/sable/companion/SableCompanion.class',
                    'dev/ryanhcode/sable/companion/impl/DefaultSableCompanion.class',
                    'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion',
                    'META-INF/LICENSE_sable_companion'
            ].each { entry ->
                if (!companionJar.entries.containsKey(entry)) {
                    throw new GradleException("Nested Companion library is missing ${entry}")
                }
            }
            if (companionJar.entries.containsKey('META-INF/mods.toml')
                    || companionJar.entries.containsKey('META-INF/neoforge.mods.toml')) {
                throw new GradleException('Nested Companion common library unexpectedly contains mod metadata')
            }
            String nestedProvider = new String(
                    companionJar.entries['META-INF/services/dev.ryanhcode.sable.companion.SableCompanion'],
                    'UTF-8'
            ).trim()
            if (nestedProvider != 'dev.ryanhcode.sable.companion.impl.DefaultSableCompanion') {
                throw new GradleException("Unexpected nested Companion provider: ${nestedProvider}")
            }
            def nestedCompanionProviders = serviceProviders(
                    companionJar.entries['META-INF/services/dev.ryanhcode.sable.companion.SableCompanion']
            )
            if (nestedCompanionProviders != ['dev.ryanhcode.sable.companion.impl.DefaultSableCompanion']) {
                throw new GradleException("Unexpected nested Companion providers: ${nestedCompanionProviders}")
            }
            if (companionJar.entries.containsKey('dev/ryanhcode/sable/ActiveSableCompanion.class')) {
                throw new GradleException('Nested Companion unexpectedly contains ActiveSableCompanion')
            }
            if (forgeJar.getJarEntry('dev/ryanhcode/sable/ActiveSableCompanion.class') == null) {
                throw new GradleException('Outer Sable artifact is missing ActiveSableCompanion')
            }
            if (forgeJar.getJarEntry('dev/ryanhcode/sable/companion/impl/DefaultSableCompanion.class') != null) {
                throw new GradleException('Outer Sable artifact unexpectedly contains DefaultSableCompanion')
            }
            if (file('../common/src/main/java/dev/ryanhcode/sable/ActiveSableCompanion.java')
                    .getText('UTF-8').contains('@SableCompanion.LoadPriority')) {
                throw new GradleException('ActiveSableCompanion should keep the default priority 1000')
            }
            if (!project(':sable_companion_1_20')
                    .file('src/main/java/dev/ryanhcode/sable/companion/impl/DefaultSableCompanion.java')
                    .getText('UTF-8').contains('@SableCompanion.LoadPriority(500)')) {
                throw new GradleException('DefaultSableCompanion no longer declares fallback priority 500')
            }
            def incompatibleCompanionClasses = companionJar.classMajors.findAll { name, major ->
                name.startsWith('dev/ryanhcode/sable/companion/') && major != 61
            }
            if (!incompatibleCompanionClasses.isEmpty()) {
                throw new GradleException("Companion classes are not Java 17 major 61: ${incompatibleCompanionClasses}")
            }

            def companionClassRows = nestedRows.findAll { row ->
                def nested = readNestedJar(row.path)
                nested.entries.containsKey('dev/ryanhcode/sable/companion/SableCompanion.class')
            }
            if (companionClassRows.size() != 1) {
                throw new GradleException(
                        "Expected exactly one nested Companion class provider, found ${companionClassRows}"
                )
            }

            def splitPackagesByNestedJar = nestedRows.collectEntries { row ->
                def nested = readNestedJar(row.path)
                def nestedPackages = classPackages(nested.entries.keySet())
                [(row.path): (outerModulePackages.intersect(nestedPackages).sort())]
            }.findAll { path, packages -> !packages.isEmpty() }
            if (!splitPackagesByNestedJar.isEmpty()) {
                throw new GradleException("Outer Sable and nested JarJar split packages: ${splitPackagesByNestedJar}")
            }
            def companionPackages = classPackages(companionJar.entries.keySet())
            def companionSplitPackages = outerModulePackages.intersect(companionPackages).sort()
            if (!companionSplitPackages.isEmpty()) {
                throw new GradleException(
                        "Outer Sable and nested Companion share Java packages: ${companionSplitPackages}"
                )
            }

            def forbiddenArtifactEntries = outerEntries.findAll { entry ->
                String name = entry.name.toLowerCase(Locale.ROOT)
                name.contains('create-1.20.1-0.5')
                        || name.contains('flywheel-0.6')
                        || name.contains('flywheel-forge-1.20.1')
                        || name.contains('ponder-forge-1.20.1')
                        || name.contains('registrate-mc1.20')
                        || name.contains('veil-forge-1.20.1')
            }
            if (!forbiddenArtifactEntries.isEmpty()) {
                throw new GradleException(
                        "Raw target/development dependency artifact leaked into final Sable jar: "
                                + forbiddenArtifactEntries*.name
                )
            }

            def configurableResources = outerEntries.findAll { entry ->
                !entry.directory && (
                        entry.name == 'META-INF/MANIFEST.MF'
                                || entry.name == 'META-INF/mods.toml'
                                || entry.name.startsWith('META-INF/services/')
                                || entry.name.endsWith('.json')
                                || entry.name.endsWith('.cfg')
                )
            }
            def smokeConfigLeaks = configurableResources.findAll { entry ->
                String content = forgeJar.getInputStream(entry).getText('UTF-8')
                content.contains('sable.runtimeSmoke')
                        || content.contains('sable.targetRuntimeSmoke')
                        || content.contains('sable.standaloneRuntimeSmoke')
            }
            if (!smokeConfigLeaks.isEmpty()) {
                throw new GradleException(
                        "Development smoke/probe configuration leaked into packaged resources: "
                                + smokeConfigLeaks*.name
                )
            }
        } finally {
            forgeJar.close()
        }

        logger.lifecycle("Verified final standalone Forge artifact ${forgeArchive.name}: Companion JarJar, "
                + "ServiceLoader resources, curated metadata, no bundled target mods")
    }
}

