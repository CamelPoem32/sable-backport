org.gradle.parallel=true

# ForgeGradle 6 adds mapped-version repository filters after MixinGradle has
# already resolved AP inputs. Gradle 8.14 freezes those descriptors earlier;
# the verification task below checks mapped local artifacts explicitly.
systemProp.net.minecraftforge.gradle.filter.repos=false

# Gradle 8.14's experimental HTML problems report mis-encodes this workspace's
# Cyrillic path on Windows. Disabling only that report keeps canonical commands reproducible.
org.gradle.problems.report=false

# This branch defaults to the isolated Forge 1.20.1 project graph. Set this to
# false only when inspecting the untouched upstream Java 21 modules.
sableForgeBackport=true

# Forge 1.20.1 backport target. Keep these isolated from the upstream
# 1.21.1 Fabric/NeoForge values so the original modules remain comparable.
