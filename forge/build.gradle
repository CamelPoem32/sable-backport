tasks.register('verifyAttributeRegistrationBoundary') {
    group = 'forge backport'
    description = 'Verifies M9.3 Forge attribute registration uses EntityAttributeModificationEvent, not AttributeSupplier internals.'

    inputs.file('src/main/java/dev/ryanhcode/sable/index/SableAttributes.java')
    inputs.file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java')
    inputs.file('src/main/resources/META-INF/accesstransformer-forge.cfg')
    inputs.dir(layout.buildDirectory.dir('classes/java/main'))
    inputs.file(layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}.jar"))
    inputs.file(layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}-all.jar"))

    doLast {
        File attributesSource = file('src/main/java/dev/ryanhcode/sable/index/SableAttributes.java')
        File forgeSource = file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java')
        File accessTransformer = file('src/main/resources/META-INF/accesstransformer-forge.cfg')

        String attributesText = attributesSource.getText('UTF-8')
        String compactAttributesText = attributesText.replaceAll(/\s+/, '')
        String forgeText = forgeSource.getText('UTF-8')
        String atText = accessTransformer.getText('UTF-8')

        if (!attributesText.contains('EntityAttributeModificationEvent')) {
            throw new GradleException('SableAttributes no longer registers through EntityAttributeModificationEvent')
        }
        if (!compactAttributesText.contains('event.add(EntityType.PLAYER,PUNCH_STRENGTH,1.0);')) {
            throw new GradleException('SableAttributes no longer adds PUNCH_STRENGTH to EntityType.PLAYER with base 1.0')
        }
        if (!compactAttributesText.contains('event.add(EntityType.PLAYER,PUNCH_COOLDOWN,0.0);')) {
            throw new GradleException('SableAttributes no longer adds PUNCH_COOLDOWN to EntityType.PLAYER with base 0.0')
        }
        [
                'AttributeSupplier',
                'DefaultAttributes',
                '.instances',
                'f_22241_',
                'getDeclaredField',
                'setAccessible'
        ].each { forbidden ->
            if (attributesText.contains(forbidden)) {
                throw new GradleException("SableAttributes still contains forbidden private-field registration canary: ${forbidden}")
            }
        }

        if (!forgeText.contains('modBus.addListener(SableAttributes::register);')) {
            throw new GradleException('SableForge does not register SableAttributes on the Forge mod event bus')
        }
        if (forgeText.contains('SableAttributes.register();')) {
            throw new GradleException('SableForge commonSetup still calls the obsolete private-field attribute mutation')
        }
        if (atText.contains('AttributeSupplier') || atText.contains('f_22241_')) {
            throw new GradleException('Forge access transformer still exposes AttributeSupplier.instances/f_22241_')
        }

        def checkClassBytes = { String label, byte[] bytes ->
            String text = new String(bytes, StandardCharsets.ISO_8859_1)
            [
                    'net/minecraft/world/entity/ai/attributes/AttributeSupplier',
                    'f_22241_',
                    'instances',
                    'getDeclaredField',
                    'setAccessible'
            ].each { forbidden ->
                if (text.contains(forbidden)) {
                    throw new GradleException("${label} still contains forbidden AttributeSupplier private access canary: ${forbidden}")
                }
            }
            [
                    'net/minecraftforge/event/entity/EntityAttributeModificationEvent',
                    'player.sub_level_punch_strength',
                    'player.sub_level_punch_cooldown'
            ].each { required ->
                if (!text.contains(required)) {
                    throw new GradleException("${label} lost required Forge event/attribute canary: ${required}")
                }
            }
        }

        File classesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
        File compiledAttributes = new File(classesDir, 'dev/ryanhcode/sable/index/SableAttributes.class')
        if (compiledAttributes.isFile()) {
            checkClassBytes('Compiled SableAttributes', Files.readAllBytes(compiledAttributes.toPath()))
        }

        [
                layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}.jar").get().asFile,
                layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}-all.jar").get().asFile
        ].each { jar ->
            if (!jar.isFile()) {
                throw new GradleException("Missing Forge production artifact for attribute-boundary verification: ${jar}")
            }
            JarFile jarFile = new JarFile(jar)
            try {
                def attributesEntry = jarFile.getJarEntry('dev/ryanhcode/sable/index/SableAttributes.class')
                if (attributesEntry == null) {
                    throw new GradleException("${jar.name} does not contain SableAttributes.class")
                }
                checkClassBytes("${jar.name}:SableAttributes", jarFile.getInputStream(attributesEntry).readAllBytes())

                def atEntry = jarFile.getJarEntry('META-INF/accesstransformer-forge.cfg')
                if (atEntry == null) {
                    throw new GradleException("${jar.name} does not contain the Forge access transformer")
                }
                String jarAtText = new String(jarFile.getInputStream(atEntry).readAllBytes(), StandardCharsets.UTF_8)
                if (jarAtText.contains('AttributeSupplier') || jarAtText.contains('f_22241_')) {
                    throw new GradleException("${jar.name} still ships the obsolete AttributeSupplier.instances AT entry")
                }
            } finally {
                jarFile.close()
            }
        }

        logger.lifecycle('verifyAttributeRegistrationBoundary PASS: EntityType.PLAYER receives '
                + 'PUNCH_STRENGTH=1.0 and PUNCH_COOLDOWN=0.0 via EntityAttributeModificationEvent; '
                + 'AttributeSupplier.instances/f_22241_ private access and AT entry absent')
    }
}

