                .getText('UTF-8')
        String rapierRustText = rootProject.file('sable_rapier/src/main/rust/rapier/src/lib.rs')
                .getText('UTF-8')

        int setVelocityStart = m10Text.indexOf('private static int setVelocity(')
        int stopStart = m10Text.indexOf('private static int stop(', setVelocityStart)
        if (setVelocityStart < 0 || stopStart < 0) {
            throw new GradleException('Unable to isolate M10 set_velocity handler')
        }
        String setVelocityText = m10Text.substring(setVelocityStart, stopStart)
        if (setVelocityText.count('Math.toRadians(DoubleArgumentType.getDouble(ctx, "wx_deg_s"))') != 1
                || setVelocityText.count('Math.toRadians(DoubleArgumentType.getDouble(ctx, "wy_deg_s"))') != 1
                || setVelocityText.count('Math.toRadians(DoubleArgumentType.getDouble(ctx, "wz_deg_s"))') != 1) {
            throw new GradleException('M10 set_velocity must convert each angular input from deg/s to rad/s exactly once')
        }
        [
                'handle.setLinearAndAngularVelocity(linearVelocity, angularVelocity)',
                'SABLE_M10_VELOCITY id={}',
