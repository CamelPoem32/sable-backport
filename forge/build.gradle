        }
        def managedModFiles = modsDir.listFiles()?.findAll { it.isFile() } ?: []
        def intendedModNames = managedModFiles*.name as Set
        def requiredIntendedModNames = [
                mappedSableJar.name,
                createDevelopmentRuntime.get().asFile.name,
                mappedFlywheel.name,
                mappedPonder.name,
                veilDevelopmentRuntime.get().asFile.name
        ] as Set
        if (intendedModNames != requiredIntendedModNames) {
            throw new GradleException("Standalone intended mods mismatch: ${intendedModNames}")
        }
        if (actualStandaloneMods.contains(productionSableJar.name)) {
            throw new GradleException("Standalone userdev mods directory must not contain production Sable jar: "
                    + productionSableJar.name)
        }
        JarFile mappedSableZip = new JarFile(mappedSableJar)
        try {
            [
                    'META-INF/mods.toml',
                    'sable.refmap.json',
                    'sable-common-forge.mixins.json',
                    'sable-forge.mixins.json',
                    'META-INF/accesstransformer-forge.cfg',
                    'META-INF/services/dev.ryanhcode.sable.companion.SableCompanion',
                    'META-INF/jarjar/metadata.json',
                    'META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar',
                    'META-INF/jarjar/mixinextras-forge-0.5.3.jar'
            ].each { entry ->
                if (mappedSableZip.getJarEntry(entry) == null) {
                    throw new GradleException("Standalone mapped Sable artifact lost required entry ${entry}")
                }
            }
            def companionOuterClasses = mappedSableZip.entries().toList().findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/companion/') && entry.name.endsWith('.class')
            }
            if (!companionOuterClasses.isEmpty()) {
                throw new GradleException("Standalone mapped Sable leaked Companion classes outside JarJar: "
                        + companionOuterClasses*.name)
            }
            def smokeEntry = mappedSableZip.getJarEntry(
                    'dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.class')
            if (smokeEntry == null) {
                throw new GradleException('Standalone mapped Sable artifact is missing standalone smoke harness')
            }
            String smokeClassText = new String(
                    mappedSableZip.getInputStream(smokeEntry).readAllBytes(),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            def parseStandaloneSmokeResourceUrl = { String rawUrl ->
                String path = java.net.URLDecoder.decode(
                        rawUrl,
                        java.nio.charset.StandardCharsets.UTF_8
                ).replace('\\', '/')
                if (path.startsWith('jar:')) {
                    path = path.substring('jar:'.length())
                }
                if (path.startsWith('union:')) {
                    path = path.substring('union:'.length())
                }
                if (path.startsWith('file:')) {
                    path = path.substring('file:'.length())
                }
                if (path.length() >= 3 && path.charAt(0) == '/' && path.charAt(2) == ':') {
                    path = path.substring(1)
                }
                def findJarEnd = { String candidatePath, int fromIndex ->
                    int jarName = candidatePath.indexOf('.jar', fromIndex)
                    while (jarName >= 0) {
                        int jarEnd = jarName + '.jar'.length()
                        if (jarEnd == candidatePath.length()
                                || candidatePath.charAt(jarEnd) == '#'
                                || candidatePath.charAt(jarEnd) == '!'
                                || candidatePath.charAt(jarEnd) == '/') {
                            return jarEnd
                        }
                        jarName = candidatePath.indexOf('.jar', jarEnd)
                    }
                    throw new GradleException("Standalone smoke URL canary did not contain a jar artifact: ${rawUrl}")
                }
                def stripSecureJarId = { String suffix ->
                    if (!suffix.startsWith('#')) {
                        return suffix
                    }
                    int index = 1
                    while (index < suffix.length() && Character.isDigit(suffix.charAt(index))) {
                        index++
                    }
                    if (index <= 1 || index >= suffix.length()
                            || !(suffix.charAt(index) == '!' || suffix.charAt(index) == '_')) {
                        throw new GradleException("Standalone smoke URL canary has invalid SecureJar id: ${rawUrl}")
                    }
                    suffix.charAt(index) == '_' ? suffix.substring(index + 1) : suffix.substring(index)
                }
                int outerJarEnd = findJarEnd(path, 0)
                String outerArtifact = path.substring(0, outerJarEnd)
                String suffix = stripSecureJarId(path.substring(outerJarEnd))
                if (suffix.startsWith('!/')) {
                    return [outer: outerArtifact, nested: null, resource: suffix.substring('!/'.length())]
                }
                if (suffix.startsWith('/')) {
                    String nestedAndResource = suffix.substring(1)
                    int nestedJarEnd = findJarEnd(nestedAndResource, 0)
                    String nestedEntry = nestedAndResource.substring(0, nestedJarEnd)
                    suffix = stripSecureJarId(nestedAndResource.substring(nestedJarEnd))
                    if (!suffix.startsWith('!/')) {
                        throw new GradleException("Standalone smoke nested URL canary lacks resource separator: ${rawUrl}")
                    }
                    return [outer: outerArtifact, nested: nestedEntry, resource: suffix.substring('!/'.length())]
                }
                throw new GradleException("Unsupported standalone smoke URL canary shape: ${rawUrl}")
            }
            String unionCanary = ('union:/C:/work/run/standalone-client/mods/'
                    + 'sable-forge-1.20.1-2.0.0-all-userdev.jar%23198!/dev/example/Class.class')
            def parsedUnionCanary = parseStandaloneSmokeResourceUrl(unionCanary)
            String expectedUnionCanary = ('C:/work/run/standalone-client/mods/'
                    + 'sable-forge-1.20.1-2.0.0-all-userdev.jar')
            if (parsedUnionCanary.outer != expectedUnionCanary
                    || parsedUnionCanary.nested != null
                    || parsedUnionCanary.resource != 'dev/example/Class.class') {
                throw new GradleException(
                        "Standalone smoke union URL canary parsed to ${parsedUnionCanary}, "
                                + "expected outer=${expectedUnionCanary}, nested=null, resource=dev/example/Class.class"
                )
            }
            String nestedUnionCanary = ('union:/C:/x/outer.jar%23198_/'
                    + 'META-INF/jarjar/inner.jar%23218!/dev/Y.class')
            def parsedNestedUnionCanary = parseStandaloneSmokeResourceUrl(nestedUnionCanary)
            if (parsedNestedUnionCanary.outer != 'C:/x/outer.jar'
                    || parsedNestedUnionCanary.nested != 'META-INF/jarjar/inner.jar'
                    || parsedNestedUnionCanary.resource != 'dev/Y.class') {
                throw new GradleException(
                        "Standalone smoke nested union URL canary parsed to ${parsedNestedUnionCanary}, "
                                + 'expected outer=C:/x/outer.jar, nested=META-INF/jarjar/inner.jar, '
                                + 'resource=dev/Y.class'
                )
            }
            if (!smokeClassText.contains('META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar')
                    || !smokeClassText.contains('requireNestedJarSource')
                    || !smokeClassText.contains('requireNoDevelopmentSource')
                    || !smokeClassText.contains(' did not resolve from ')
                    || !smokeClassText.contains(' inside the staged Sable artifact: ')
                    || !smokeClassText.contains('resolved from development output instead of packaged artifact')
                    || !smokeClassText.contains('SableCompanion')
                    || !smokeClassText.contains('DefaultSableCompanion')) {
                throw new GradleException('Standalone smoke harness no longer verifies nested Companion JarJar provenance')
            }
            if (!smokeClassText.contains('normalizeResourceUrl')
                    || !smokeClassText.contains('parseRuntimeResourceUrl')
                    || !smokeClassText.contains('ParsedRuntimeResource')
                    || !smokeClassText.contains('union:')
                    || !smokeClassText.contains('#')) {
                throw new GradleException(
                        'Standalone smoke harness no longer normalizes Forge/SecureJar union resource URLs'
                )
            }
            if (smokeClassText.contains('did not resolve from the final Sable all-jar')) {
                throw new GradleException('Standalone smoke harness still requires literal final all-jar filename')
            }
            def staleSelfReferences = []
            mappedSableZip.entries().toList().findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/mixin/')
                        && entry.name.endsWith('.class')
                        && !entry.name.contains('$')
            }.each { entry ->
                String owner = entry.name.substring(0, entry.name.length() - '.class'.length())
                def references = SableStandaloneUserdevMapper.classReferences(mappedSableJar, entry.name)
                references.fields.findAll { reference ->
                    reference.startsWith(owner + '.f_')
                }.each { reference ->
                    staleSelfReferences.add("${entry.name}: ${reference}")
                }
                references.methods.findAll { reference ->
                    reference.startsWith(owner + '.m_')
                }.each { reference ->
                    staleSelfReferences.add("${entry.name}: ${reference}")
                }
            }
            if (!staleSelfReferences.isEmpty()) {
                throw new GradleException(
                        'Standalone mapped Sable contains stale intra-Mixin SRG member references: '
                                + staleSelfReferences
                )
            }
        } finally {
            mappedSableZip.close()
        }
        File stagedCreate = new File(modsDir, createDevelopmentRuntime.get().asFile.name)
        int effectiveRegistrateSuppliers = 0
        String effectiveRegistrateSupplier = null
        JarFile stagedCreateJar = new JarFile(stagedCreate)
        try {
            String registratePath = expectedTargetArtifacts.registrate.path
            def nestedRegistrate = stagedCreateJar.getJarEntry(registratePath)
            if (nestedRegistrate == null) {
                throw new GradleException("Standalone Create runtime is missing nested ${registratePath}")
            }
            effectiveRegistrateSuppliers += 1
            effectiveRegistrateSupplier = "${stagedCreate.absolutePath}!/${registratePath}"
            ZipInputStream registrateZip = new ZipInputStream(stagedCreateJar.getInputStream(nestedRegistrate))
            try {
                boolean foundRegistrateLoot = false
                boolean foundAbstractRegistrate = false
                def entry
                while ((entry = registrateZip.nextEntry) != null) {
                    foundRegistrateLoot |= entry.name == 'com/tterrag/registrate/providers/loot/RegistrateLootTables.class'
                    foundAbstractRegistrate |= entry.name == 'com/tterrag/registrate/AbstractRegistrate.class'
                }
                if (!foundAbstractRegistrate || !foundRegistrateLoot) {
                    throw new GradleException(
                            "Nested Create Registrate lacks expected canaries: AbstractRegistrate="
                                    + "${foundAbstractRegistrate}, loot=${foundRegistrateLoot}"
                    )
                }
            } finally {
                registrateZip.close()
            }
        } finally {
            stagedCreateJar.close()
        }
        def unexpectedRegistrateFiles = (
                standaloneClasspath
                        + legacyClasspathEntries
                        + sourceSets.standaloneRuntimeLauncher.compileClasspath.files
                        + sourceSets.standaloneRuntimeLauncher.runtimeClasspath.files
        ).findAll { file ->
            file.name.toLowerCase(Locale.ROOT).contains('registrate')
        }
        if (!unexpectedRegistrateFiles.isEmpty()) {
            throw new GradleException("Unexpected standalone Registrate suppliers outside Create JarJar: "
                    + unexpectedRegistrateFiles*.absolutePath)
        }
        if (effectiveRegistrateSuppliers != 1) {
            throw new GradleException("Expected one effective Registrate supplier, found "
                    + effectiveRegistrateSuppliers)
        }
        logger.lifecycle("Verified standalone run configuration: main=${runConfig.main}, sources=${sourceNames}, "
                + "launchTarget=forgeclientuserdev, empty MOD_CLASSES roots exist, "
                + "mapped Sable userdev artifact derived from final all-jar sha256=${productionSableSha}, "
                + "no external Companion or target-mod classpath, legacy classpath clean, "
                + "Create-owned nested Registrate is the only standalone Registrate supplier: "
                + effectiveRegistrateSupplier)
    }
}

tasks.register('verifyRapierRuntimeSmokePreparation') {
    group = 'verification'
    description = 'Statically verifies M8.4 standalone Rapier userdev mapping, provenance, and smoke-probe wiring.'
    dependsOn prepareStandaloneSableUserdevArtifact
    dependsOn tasks.named('prepareStandaloneRuntimeLauncherRoots')

    doLast {
        File smokeSource = file('src/main/java/dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.java')
        String smokeSourceText = smokeSource.getText('UTF-8')
        [
                'm8_rapier_gravity_smoke',
                'SABLE_RAPIER_SMOKE phase={} status=PASS',
                'provider=RapierPhysicsPipelineProvider',
                'Rapier pipeline initialized; native/JNI init completed',
                'freshObject=',
                'rapierPass("gravity"',
                'rapierPass("collision"',
                'status=SKIP after failed M8 gate',
                'approximatelyStationary'
        ].each { canary ->
            if (!smokeSourceText.contains(canary)) {
                throw new GradleException("M8 Rapier smoke source lacks canary: ${canary}")
            }
        }
        [
                'requireSingleServerObject',
                'runServerGate',
                'create6_runtime_smoke',
                'Sublevel has nonzero linear velocity',
                'Sublevel has nonzero angular velocity',
                'phase=lifecycle status=PASS observed integrated server stop cycle='
        ].each { forbidden ->
            if (smokeSourceText.contains(forbidden)) {
                throw new GradleException("M8 Rapier smoke source still contains old M7 invariant/path: ${forbidden}")
            }
        }

        File productionSableJar = standaloneProductionSableArtifact.get().asFile
        File mappedSableJar = standaloneMappedSableRuntime.get().asFile
        File productionNestedRapier = standaloneRapierProductionNestedJar.get().asFile
        File userdevNestedRapier = standaloneRapierUserdevNestedJar.get().asFile
        File mappingsFile = layout.buildDirectory.file('createMcpToSrg/output.tsrg').get().asFile
        if (!productionSableJar.isFile() || !mappedSableJar.isFile()) {
            throw new GradleException('M8.4 requires final and standalone mapped Sable artifacts to exist')
        }
        if (!productionNestedRapier.isFile() || !userdevNestedRapier.isFile()) {
            throw new GradleException('M8.4 nested Rapier production/userdev artifacts were not prepared')
        }
        def verifyJarSmokeText = { String label, String smokeText ->
            [
                    'm8_rapier_gravity_smoke',
                    'SABLE_RAPIER_SMOKE',
                    'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipelineProvider',
                    'dev.ryanhcode.sable.physics.impl.rapier.RapierPhysicsPipeline',
                    'dev.ryanhcode.sable.physics.impl.rapier.Rapier3D',
                    'META-INF/jarjar/sable-rapier-common-1.20.1-2.0.0.jar',
                    'META-INF/jarjar/lz4-java-1.11.0.jar',
                    'freshObject=',
                    'gravity',
                    'collision',
                    'Rapier pipeline initialized; native/JNI init completed',
                    'M8 Rapier gravity/collision did not complete'
            ].each { canary ->
                if (!smokeText.contains(canary)) {
                    throw new GradleException("${label} lacks M8 canary: ${canary}")
                }
            }
            [
                    'create6_runtime_smoke',
                    'requireSingleServerObject',
                    'runServerGate',
                    'Sublevel has nonzero linear velocity',
                    'Sublevel has nonzero angular velocity'
            ].each { forbidden ->
                if (smokeText.contains(forbidden)) {
                    throw new GradleException("${label} still contains old M7 invariant/path: ${forbidden}")
                }
            }
        }
        JarFile productionOuter = new JarFile(productionSableJar)
        try {
            def productionSmokeEntry = productionOuter.getJarEntry(
                    'dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.class')
            if (productionSmokeEntry == null) {
                throw new GradleException('Final production Sable artifact is missing standalone smoke harness')
            }
            verifyJarSmokeText('Final production standalone smoke harness',
                    new String(productionOuter.getInputStream(productionSmokeEntry).readAllBytes(),
                            java.nio.charset.StandardCharsets.ISO_8859_1))
        } finally {
            productionOuter.close()
        }
        def standaloneHierarchyClasspath = configurations.compileClasspath.files.findAll {
            it.isFile() && it.name.endsWith('.jar')
        }

        def productionRapierReport = RapierProductionJarMapper.referenceReport(productionNestedRapier, mappingsFile)
        if (productionRapierReport.productionMinecraftMemberReferences.isEmpty()
                || !productionRapierReport.namedMinecraftMemberReferences.isEmpty()) {
            throw new GradleException("Production nested Rapier namespace proof failed: productionRefs="
                    + "${productionRapierReport.productionMinecraftMemberReferences.size()}, namedRefs="
                    + "${productionRapierReport.namedMinecraftMemberReferences.take(20)}")
        }
        def userdevRapierReport = RapierProductionJarMapper.referenceReport(userdevNestedRapier, mappingsFile)
        def userdevSrgLookingProductionRefs = userdevRapierReport.productionMinecraftMemberReferences.findAll {
            it.contains('.m_') || it.contains('.f_')
        }
        if (userdevRapierReport.namedMinecraftMemberReferences.isEmpty()
                || !userdevSrgLookingProductionRefs.isEmpty()) {
            throw new GradleException("Standalone userdev nested Rapier namespace proof failed: namedRefs="
                    + "${userdevRapierReport.namedMinecraftMemberReferences.size()}, staleSrgLookingProductionRefs="
                    + "${userdevSrgLookingProductionRefs.take(20)}")
        }
        def staleRapierRefs = SableStandaloneUserdevMapper.staleKnownMemberReferences(
                userdevNestedRapier,
                layout.buildDirectory.file('createSrgToMcp/output.srg').get().asFile,
                standaloneHierarchyClasspath)
        if (!staleRapierRefs.references.isEmpty()) {
            throw new GradleException("Standalone userdev nested Rapier has stale SRG member references: "
                    + staleRapierRefs.references.take(30))
        }

        JarFile mappedOuter = new JarFile(mappedSableJar)
        try {
            def mappedOuterEntries = mappedOuter.entries().toList()
            def mappedRapierEntry = mappedOuter.getJarEntry(rapierBackportJarJarPath)
            if (mappedRapierEntry == null) {
                throw new GradleException("Standalone mapped Sable lacks nested Rapier ${rapierBackportJarJarPath}")
            }
            if (sha256Bytes(mappedOuter.getInputStream(mappedRapierEntry).readAllBytes())
                    != sha256(userdevNestedRapier)) {
                throw new GradleException('Standalone mapped outer Sable does not contain the prepared userdev Rapier jar bytes')
            }
            def lz4Entry = mappedOuter.getJarEntry(rapierLz4JarJarPath)
            if (lz4Entry == null || sha256Bytes(mappedOuter.getInputStream(lz4Entry).readAllBytes()) != rapierLz4Sha256) {
                throw new GradleException('Standalone mapped Sable lost the exact nested LZ4 runtime jar')
            }
            [
                    'META-INF/jarjar/sable-companion-common-1.20.1-1.6.0.jar',
                    'META-INF/jarjar/mixinextras-forge-0.5.3.jar'
            ].each { entry ->
                if (mappedOuter.getJarEntry(entry) == null) {
                    throw new GradleException("Standalone mapped Sable lost nested ${entry}")
                }
            }
            def outerRapierClasses = mappedOuterEntries.findAll { entry ->
                entry.name.startsWith('dev/ryanhcode/sable/physics/impl/rapier/') && entry.name.endsWith('.class')
            }
            if (!outerRapierClasses.isEmpty()) {
                throw new GradleException("Rapier classes leaked into standalone outer Sable: ${outerRapierClasses*.name}")
            }
            def smokeEntry = mappedOuter.getJarEntry(
                    'dev/ryanhcode/sable/forge/SableForgeStandaloneRuntimeSmoke.class')
            if (smokeEntry == null) {
                throw new GradleException('Standalone mapped Sable artifact is missing standalone smoke harness')
            }
            String smokeClassText = new String(
                    mappedOuter.getInputStream(smokeEntry).readAllBytes(),
                    java.nio.charset.StandardCharsets.ISO_8859_1)
            verifyJarSmokeText('Standalone mapped smoke harness', smokeClassText)
        } finally {
            mappedOuter.close()
        }

        def launcherSurfaces = [
                'runStandaloneClient.classpath'                     : tasks.named('runStandaloneClient').get().classpath.files,
                'standaloneRuntimeLauncher.compileClasspath'        : sourceSets.standaloneRuntimeLauncher.compileClasspath.files,
                'standaloneRuntimeLauncher.runtimeClasspath'        : sourceSets.standaloneRuntimeLauncher.runtimeClasspath.files
        ]
        launcherSurfaces.each { surface, files ->
            def leaks = files.findAll { file ->
                String path = file.absolutePath.replace('\\', '/').toLowerCase(Locale.ROOT)
                path.contains('/classes/java/rapierbackport')
                        || path.contains('/resources/rapierbackport')
                        || path.contains('/rapierbackport/')
                        || path.contains('/sable_rapier/build/')
            }
            if (!leaks.isEmpty()) {
                throw new GradleException("${surface} leaks Rapier development output: ${leaks*.absolutePath}")
            }
        }
        File legacyClasspathFile = layout.buildDirectory.file(
                'classpath/forge_runStandaloneClient_minecraftClasspath.txt').get().asFile
        if (legacyClasspathFile.isFile()) {
            def legacyLeaks = legacyClasspathFile.getText('UTF-8')
                    .readLines()
                    .collectMany { line -> line.split(';') as List }
                    .collect { it.trim() }
                    .findAll { !it.isEmpty() }
                    .findAll { entry ->
                        String lower = entry.replace('\\', '/').toLowerCase(Locale.ROOT)
                        lower.contains('/classes/java/rapierbackport')
                                || lower.contains('/resources/rapierbackport')
                                || lower.contains('/rapierbackport/')
                                || lower.contains('/sable_rapier/build/')
                    }
            if (!legacyLeaks.isEmpty()) {
                throw new GradleException("Standalone legacy classpath leaks Rapier development output: ${legacyLeaks}")
            }
        }

        logger.lifecycle("verifyRapierRuntimeSmokePreparation PASS: productionRapierRefs="
                + "${productionRapierReport.productionMinecraftMemberReferences.size()}, "
                + "userdevNamedRefs=${userdevRapierReport.namedMinecraftMemberReferences.size()}, "
                + "staleRapierRefs=0, ordinary=${staleRapierRefs.ordinaryInstructionReferences}, "
                + "handles=${staleRapierRefs.handleReferences}, constantDynamicOrLdcHandles="
                + "${staleRapierRefs.constantDynamicOrLdcHandleReferences}, "
                + "rapierProvenance=${rapierBackportJarJarPath}, lz4=${rapierLz4JarJarPath}, "
                + "probe=m8_rapier_gravity_smoke")
    }
}

tasks.matching { it.name == 'runStandaloneClient' }.configureEach {
    dependsOn tasks.named('verifyStandaloneRunConfiguration')
    dependsOn tasks.named('prepareStandaloneRuntimeSmoke')
}

tasks.named('check') {
    dependsOn tasks.named('verifyForgeAccessTransformer')
    dependsOn tasks.named('verifyForgePackaging')
}

tasks.named('checkstyleMain') {
    mustRunAfter syncMixinRefmap
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    eachFile { details ->
        String remapped = details.path
                .replace('/tags/block/', '/tags/blocks/')
                .replace('/tags/entity_type/', '/tags/entity_types/')
                .replace('/tags/item/', '/tags/items/')
                .replace('/structure/', '/structures/')
        details.path = remapped
    }
    filesMatching(['data/sable/tags/block/*.json', 'data/sable/tags/blocks/*.json']) {
        filter { line ->
            line.replace('"#c:storage_blocks"', '"#forge:storage_blocks"')
                    .replace('"#c:glass_panes"', '"#forge:glass_panes"')
                    .replace('"#c:fence_gates"', '"#forge:fence_gates"')
                    .replace('"#c:chests/wooden"', '"#forge:chests/wooden"')
                    .replace('"#c:stones"', '"#forge:stone"')
                    .replace('"#c:cobblestones"', '"#forge:cobblestone"')
                    .replace('"#c:clusters"', '{ "id": "#c:clusters", "required": false }')
                    .replace('"minecraft:heavy_core"', '{ "id": "minecraft:heavy_core", "required": false }')
                    .replace('"minecraft:tuff_slab"', '{ "id": "minecraft:tuff_slab", "required": false }')
        }
    }
    doLast {
        [
                'data/sable/tags/block',
                'data/sable/tags/entity_type',
                'data/sable/tags/item',
                'data/sable/structure'
        ].each { path ->
            project.delete(new File(destinationDir, path))
        }
    }

    var expandProps = [
            'version'                   : rootProject.version,
            'group'                     : project.group,
            'minecraft_version'         : forge_minecraft_version,
            'minecraft_version_range'   : forge_minecraft_version_range,
            'forge_version'             : forge_version,
            'forge_loader_version_range': forge_loader_version_range,
            'create_version_range'      : forge_create_version_range,
            'flywheel_version_range'    : forge_flywheel_version_range,
            'veil_version_range'        : forge_veil_version_range,
            'mod_name'                  : mod_name,
            'mod_author'                : mod_author,
            'mod_id'                    : mod_id,
            'license'                   : license,
            'issues'                    : issues,
            'description'               : description,
            'credits'                   : credits,
            'java_version'              : forge_java_version
    ]

    filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
        expand expandProps
        filter { line -> line.replace('"compatibilityLevel": "JAVA_21"', '"compatibilityLevel": "JAVA_17"') }
    }
    inputs.properties(expandProps)
}

jar {
    dependsOn syncMixinRefmap
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(rootProject.file('LICENSE.md')) {
        rename { "${it}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : forge_minecraft_version,
                'FMLAT'                 : 'accesstransformer-forge.cfg'
        ])
    }
}

tasks.named('jarJar') {
    dependsOn syncMixinRefmap
}

tasks.named('sourcesJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

apply from: rootProject.file('gradle/runtime-preflight.gradle')
