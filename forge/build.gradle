                    throw new GradleException("${jar.name} SableSubLevelRenderPlatformImpl still directly accesses private/public-boundary fields: ${renderPlatformFieldAccesses}")
                }
                String renderPlatformClassText = new String(renderPlatformBytes, StandardCharsets.ISO_8859_1)
                if (!renderPlatformClassText.contains('m_110937_')
                        && !renderPlatformClassText.contains('getModelRenderer')) {
                    throw new GradleException("${jar.name} SableSubLevelRenderPlatformImpl does not use the public BlockRenderDispatcher model-renderer boundary")
                }
                if (renderPlatformClassText.contains('f_110900_') || renderPlatformClassText.contains('modelRenderer')) {
                    throw new GradleException("${jar.name} SableSubLevelRenderPlatformImpl still references the private BlockRenderDispatcher.modelRenderer field")
                }

                def configEntry = jarFile.getJarEntry('sable-common-forge.mixins.json')
                if (configEntry == null) {
                    throw new GradleException("${jar.name} is missing sable-common-forge.mixins.json")
                }
                String jarMixinConfigText = new String(jarFile.getInputStream(configEntry).readAllBytes(), StandardCharsets.UTF_8)
                if (!jarMixinConfigText.contains('"storage.DimensionDataStorageAccessor"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable DimensionDataStorageAccessor")
                }
                if (!jarMixinConfigText.contains('"plot.lighting.LevelLightEngineAccessor"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable LevelLightEngineAccessor")
                }
                if (!jarMixinConfigText.contains('"plot.ChunkHolderAccessor"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable ChunkHolderAccessor")
                }
                if (!jarMixinConfigText.contains('"plot.ChunkMapModifiedAccessor"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable ChunkMapModifiedAccessor")
                }
                if (!jarMixinConfigText.contains('"plot.ChunkMapStatusChangeInvoker"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable ChunkMapStatusChangeInvoker")
                }
                if (!jarMixinConfigText.contains('"udp.ServerGamePacketListenerImplAccessor"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable ServerGamePacketListenerImplAccessor")
                }
                if (!jarMixinConfigText.contains('"clip_overwrite.ClipContextAccessor"')) {
                    throw new GradleException("${jar.name} production mixin config does not enable ClipContextAccessor")
                }

                def refmapEntry = jarFile.getJarEntry('sable.refmap.json')
                if (refmapEntry == null) {
                    throw new GradleException("${jar.name} is missing sable.refmap.json")
                }
                String refmapText = new String(jarFile.getInputStream(refmapEntry).readAllBytes(), StandardCharsets.UTF_8)
                if (!refmapText.contains('DimensionDataStorageAccessor')) {
                    throw new GradleException("${jar.name} refmap does not mention DimensionDataStorageAccessor")
                }
                if (!refmapText.contains('LevelLightEngineAccessor')) {
                    throw new GradleException("${jar.name} refmap does not mention LevelLightEngineAccessor")
                }
                if (!refmapText.contains('ChunkHolderAccessor')) {
                    throw new GradleException("${jar.name} refmap does not mention ChunkHolderAccessor")
                }
                if (!refmapText.contains('ChunkMapModifiedAccessor')) {
                    throw new GradleException("${jar.name} refmap does not mention ChunkMapModifiedAccessor")
                }
                if (!refmapText.contains('ChunkMapStatusChangeInvoker')) {
                    throw new GradleException("${jar.name} refmap does not mention ChunkMapStatusChangeInvoker")
                }
                if (!refmapText.contains('ServerGamePacketListenerImplAccessor')) {
                    throw new GradleException("${jar.name} refmap does not mention ServerGamePacketListenerImplAccessor")
                }
                if (!refmapText.contains('ClipContextAccessor')) {
                    throw new GradleException("${jar.name} refmap does not mention ClipContextAccessor")
                }

                def atEntry = jarFile.getJarEntry('META-INF/accesstransformer-forge.cfg')
                if (atEntry == null) {
                    throw new GradleException("${jar.name} is missing META-INF/accesstransformer-forge.cfg")
                }
                String jarAtText = new String(jarFile.getInputStream(atEntry).readAllBytes(), StandardCharsets.UTF_8)
                if (jarAtText.contains('DimensionDataStorage') || jarAtText.contains('f_78146_')
                        || jarAtText.contains('AttributeSupplier') || jarAtText.contains('f_22241_')) {
                    throw new GradleException("${jar.name} still ships obsolete DimensionDataStorage/AttributeSupplier AT access")
                }
                if (jarAtText.contains('LevelLightEngine') || jarAtText.contains('f_75802_')
                        || jarAtText.contains('f_75803_')) {
                    throw new GradleException("${jar.name} still ships obsolete LevelLightEngine blockEngine/skyEngine AT access")
                }
                if (jarAtText.contains('ChunkHolder f_140002_') || jarAtText.contains('ChunkHolder f_140003_')
                        || jarAtText.contains('ChunkHolder f_140004_')
                        || jarAtText.contains('ChunkHolder fullChunkFuture')
                        || jarAtText.contains('ChunkHolder tickingChunkFuture')
                        || jarAtText.contains('ChunkHolder entityTickingChunkFuture')) {
                    throw new GradleException("${jar.name} still ships obsolete ChunkHolder loaded-future AT access")
                }
                if (jarAtText.contains('ChunkMap f_140140_') || jarAtText.contains('ChunkMap modified')) {
                    throw new GradleException("${jar.name} still ships obsolete ChunkMap.modified AT access")
                }
                if (jarAtText.contains('ChunkMap m_287285_')
                        || jarAtText.contains('ChunkMap onFullChunkStatusChange')) {
                    throw new GradleException("${jar.name} still ships obsolete ChunkMap.onFullChunkStatusChange AT access")
                }
                if (jarAtText.contains('ServerGamePacketListenerImpl f_9742_')
                        || jarAtText.contains('ServerGamePacketListenerImpl connection')) {
                    throw new GradleException("${jar.name} still ships obsolete ServerGamePacketListenerImpl.connection AT access")
                }
                if (jarAtText.contains('ClipContext f_45684_') || jarAtText.contains('ClipContext f_45685_')
                        || jarAtText.contains('ClipContext f_45686_') || jarAtText.contains('ClipContext block')
                        || jarAtText.contains('ClipContext fluid') || jarAtText.contains('ClipContext collisionContext')) {
                    throw new GradleException("${jar.name} still ships obsolete ClipContext block/fluid/collisionContext AT access")
                }

                File minecraftSrgJarRoot = new File(gradle.gradleUserHomeDir,
                        "caches/forge_gradle/mcp_repo/net/minecraft/joined")
                def minecraftSrgJars = minecraftSrgJarRoot.isDirectory()
                        ? fileTree(minecraftSrgJarRoot) {
                            include "**/joined-${forge_minecraft_version}-*-srg.jar"
                        }.files.sort { left, right -> left.absolutePath <=> right.absolutePath }
                        : []
                if (minecraftSrgJars.isEmpty()) {
                    throw new GradleException("Could not locate Minecraft ${forge_minecraft_version} production/SRG jar under ${minecraftSrgJarRoot}")
                }
                File minecraftSrgJar = minecraftSrgJars[-1]
                File forgeBinpatchedJar = layout.buildDirectory.file('tmp/m9-inspect-forge-binpatched.jar').get().asFile
                File forgeMappedClasses = layout.buildDirectory.dir('compileClasspath/forgeMappedClasses').get().asFile
                File forgeUniversalJar = new File(gradle.gradleUserHomeDir,
                        "caches/forge_gradle/maven_downloader/net/minecraftforge/forge/${forge_minecraft_version}-${forge_version}/forge-${forge_minecraft_version}-${forge_version}-universal.jar")
                List<File> minecraftVisibilityClasspath = [minecraftSrgJar]
                if (forgeBinpatchedJar.isFile()) {
                    minecraftVisibilityClasspath.add(forgeBinpatchedJar)
                }
                if (forgeUniversalJar.isFile()) {
                    minecraftVisibilityClasspath.add(forgeUniversalJar)
                }
                if (forgeMappedClasses.isDirectory()) {
                    minecraftVisibilityClasspath.add(forgeMappedClasses)
                }
                def minecraftVisibility = ProductionMinecraftAccessVerifier.loadMinecraftVisibilityDatabase(
                        minecraftVisibilityClasspath)

                int auditedClasses = 0
                int minecraftFieldReferences = 0
                int minecraftMethodReferences = 0
                int resolvedReferences = 0
                int safePublicReferences = 0
                int safeProtectedReferences = 0
                int safePackageReferences = 0
                int safeAtReferences = 0
                int atBackedFieldReferences = 0
                int atBackedMethodReferences = 0
                int distinctMinecraftOwners = 0
                def forbiddenDirectAccesses = []
                def invalidPrivateAccesses = []
                def invalidPackageAccesses = []
                def invalidProtectedAccesses = []
                def unresolvedAccesses = []
                jarFile.entries().toList().findAll {
                    it.name.startsWith('dev/ryanhcode/sable/')
                            && it.name.endsWith('.class')
                            && !it.name.startsWith('dev/ryanhcode/sable/physics/impl/rapier/')
                            && !it.name.startsWith('dev/ryanhcode/sable/mixin/')
                }.each { classEntry ->
                    auditedClasses++
                    def audit = ProductionMinecraftAccessVerifier.auditMinecraftMemberReferences(
                            jarFile.getInputStream(classEntry).readAllBytes(),
                            atMembers,
                            minecraftVisibility)
                    minecraftFieldReferences += audit.minecraftFieldReferences
                    minecraftMethodReferences += audit.minecraftMethodReferences
                    resolvedReferences += audit.resolvedReferences
                    safePublicReferences += audit.safePublicReferences
                    safeProtectedReferences += audit.safeProtectedReferences
                    safePackageReferences += audit.safePackageReferences
                    safeAtReferences += audit.safeAtReferences
                    atBackedFieldReferences += audit.atBackedFieldReferences
                    atBackedMethodReferences += audit.atBackedMethodReferences
                    distinctMinecraftOwners += audit.distinctMinecraftOwners
                    forbiddenDirectAccesses.addAll(audit.forbiddenDirectAccesses)
                    invalidPrivateAccesses.addAll(audit.invalidPrivateAccesses)
                    invalidPackageAccesses.addAll(audit.invalidPackageAccesses)
                    invalidProtectedAccesses.addAll(audit.invalidProtectedAccesses)
                    unresolvedAccesses.addAll(audit.unresolvedAccesses)
                }
                if (!forbiddenDirectAccesses.isEmpty()) {
                    throw new GradleException("${jar.name} retained Sable bytecode still directly accesses accessor-managed private Minecraft fields: ${forbiddenDirectAccesses}")
                }
                if (!invalidPrivateAccesses.isEmpty() || !invalidPackageAccesses.isEmpty()
                        || !invalidProtectedAccesses.isEmpty() || !unresolvedAccesses.isEmpty()) {
                    throw new GradleException("${jar.name} retained Sable production Minecraft access audit failed: "
                            + "invalidPrivate=${invalidPrivateAccesses.take(20)}, "
                            + "invalidPackage=${invalidPackageAccesses.take(20)}, "
                            + "invalidProtected=${invalidProtectedAccesses.take(20)}, "
                            + "unresolved=${unresolvedAccesses.take(20)}")
                }

                if (jarFile.entries().toList().any { it.name.endsWith('.class') && it.name.contains('$Mockito') }) {
                    throw new GradleException("${jar.name} appears to contain generated test/mock classes")
                }
                String scannedJarSha256 = sha256(jar)
                logger.lifecycle("${jar.name} production MC access audit: "
                        + "sha256=${scannedJarSha256}, minecraftSrgClasses=${minecraftVisibility.classCount()}, "
                        + "auditedClasses=${auditedClasses}, minecraftFieldRefs=${minecraftFieldReferences}, "
                        + "minecraftMethodRefs=${minecraftMethodReferences}, resolvedRefs=${resolvedReferences}, "
                        + "safePublic=${safePublicReferences}, safeProtected=${safeProtectedReferences}, "
                        + "safePackage=${safePackageReferences}, safeAt=${safeAtReferences}, "
                        + "atBackedFieldRefs=${atBackedFieldReferences}, atBackedMethodRefs=${atBackedMethodReferences}, "
                        + "distinctOwnerVisits=${distinctMinecraftOwners}, invalidRefs=0, unresolvedRefs=0, "
                        + 'invalidAccessorManagedDirectRefs=0')
            } finally {
                jarFile.close()
            }
        }

        [
                layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}.jar").get().asFile,
                layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}-all.jar").get().asFile
        ].each { verifyJar(it) }

        int auditedAccessMechanisms = atMemberEntries + 7
        logger.lifecycle('verifyProductionMinecraftAccessBoundary PASS: '
                + "auditedAccessMechanisms=${auditedAccessMechanisms}, atMemberEntries=${atMemberEntries}, "
                + 'accessorEntries=7, DimensionDataStorage.dataFolder=f_78146_ via enabled accessor, '
                + 'LevelLightEngine.blockEngine=f_75802_ and skyEngine=f_75803_ via enabled accessor, '
                + 'ChunkHolder full/ticking/entity futures=f_140002_/f_140003_/f_140004_ via enabled accessor, '
                + 'ChunkMap.modified=f_140140_ via enabled setter accessor, '
                + 'ChunkMap.onFullChunkStatusChange=m_287285_ via enabled invoker, '
                + 'ServerGamePacketListenerImpl.connection=f_9742_ via enabled getter accessor, '
                + 'ClipContext block/fluid/collisionContext=f_45684_/f_45685_/f_45686_ via enabled getter accessor, '
                + 'obsolete direct AT/direct field access absent, staleNamedAtEntries=0, reflectionWorkarounds=0')
    }
}

tasks.register('verifyVeilRuntimeBoundary') {
    group = 'forge backport'
    description = 'Verifies the M9.2 retained Forge runtime no longer requires Veil.'

    inputs.dir(layout.buildDirectory.dir('classes/java/main'))
    inputs.file('src/main/resources/META-INF/mods.toml')
    inputs.files(fileTree('src/main/resources') { include '*.mixins.json' })
    inputs.files(fileTree(rootProject.file('common/src/main/resources')) { include '*.mixins.json' })
    inputs.file(layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}.jar"))

    doLast {
        def activeVeilClassRefs = []
        File classesDir = layout.buildDirectory.dir('classes/java/main').get().asFile
        [classesDir].findAll { it.isDirectory() }.each { dir ->
            fileTree(dir) { include '**/*.class' }.files.each { classFile ->
                String text = new String(Files.readAllBytes(classFile.toPath()), StandardCharsets.ISO_8859_1)
                if (text.contains('foundry/veil')) {
                    activeVeilClassRefs.add(dir.toPath().relativize(classFile.toPath()).toString().replace('\\', '/'))
                }
            }
        }
        if (!activeVeilClassRefs.isEmpty()) {
            throw new GradleException("Active compiled Sable classes still reference Veil: ${activeVeilClassRefs}")
        }

        String modsToml = file('src/main/resources/META-INF/mods.toml').getText('UTF-8')
        if (modsToml.contains('modId = "veil"') || modsToml.contains('mandatory = true') && modsToml.contains('veil')) {
            throw new GradleException('Forge mods.toml still declares a Veil runtime dependency')
        }

        def enabledMixinVeilRefs = []
        [
                file('src/main/resources/sable-common-forge.mixins.json'),
                file('src/main/resources/sable-forge.mixins.json')
        ].findAll { it.isFile() }.each { mixinConfig ->
            String text = mixinConfig.getText('UTF-8')
            if (text.contains('foundry.veil') || text.contains('foundry/veil')) {
                enabledMixinVeilRefs.add(mixinConfig.name)
            }
            def parsed = new JsonSlurper().parse(mixinConfig)
            ((parsed.mixins ?: []) + (parsed.client ?: [])).each { mixinName ->
                String path = "dev/ryanhcode/sable/mixin/${mixinName.toString().replace('.', '/')}.class"
                [classesDir].findAll { it.isDirectory() }.each { dir ->
                    File classFile = new File(dir, path)
                    if (classFile.isFile()) {
                        String classText = new String(Files.readAllBytes(classFile.toPath()), StandardCharsets.ISO_8859_1)
                        if (classText.contains('foundry/veil')) {
                            enabledMixinVeilRefs.add("${mixinConfig.name}:${mixinName}")
                        }
                    }
                }
            }
        }
        if (!enabledMixinVeilRefs.isEmpty()) {
            throw new GradleException("Enabled Sable mixins still reference Veil: ${enabledMixinVeilRefs}")
        }

        def normalClasspathVeil = ['implementation', 'compileOnly', 'runtimeOnly'].collectMany { configurationName ->
            configurations.named(configurationName).get().dependencies.collect { dependency ->
                "${configurationName}:${dependency.group}:${dependency.name}:${dependency.version}"
            }
        }.findAll { it.toLowerCase(Locale.ROOT).contains('veil') }
        if (!normalClasspathVeil.isEmpty()) {
            throw new GradleException("Normal Forge compile/runtime classpath still includes Veil: ${normalClasspathVeil}")
        }

        File finalJar = layout.buildDirectory.file("libs/${mod_id}-forge-${forge_minecraft_version}-${version}.jar").get().asFile
        if (finalJar.isFile()) {
            def finalVeilRefs = []
            JarFile jarFile = new JarFile(finalJar)
            try {
                jarFile.entries().toList().findAll { it.name.endsWith('.class') }.each { entry ->
                    String text = new String(jarFile.getInputStream(entry).readAllBytes(), StandardCharsets.ISO_8859_1)
                    if (text.contains('foundry/veil')) {
                        finalVeilRefs.add(entry.name)
                    }
                }
                def modsEntry = jarFile.getJarEntry('META-INF/mods.toml')
                if (modsEntry != null) {
                    String finalModsToml = new String(jarFile.getInputStream(modsEntry).readAllBytes(), StandardCharsets.UTF_8)
                    if (finalModsToml.contains('modId = "veil"')) {
                        throw new GradleException('Current built Forge jar still declares a Veil dependency in mods.toml')
                    }
                }
            } finally {
                jarFile.close()
            }
            if (!finalVeilRefs.isEmpty()) {
                throw new GradleException("Current built Forge jar still contains Veil class references: ${finalVeilRefs}")
            }
        }

        logger.lifecycle('verifyVeilRuntimeBoundary PASS: activeVeilClassRefs=0, enabledVeilMixinRefs=0, '
                + 'modsTomlVeilRequired=false, normalClasspathVeil=0')
    }
}

