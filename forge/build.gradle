}

sourceSets {
    m6SableRun {
        java.setSrcDirs([])
        resources.setSrcDirs([sourceSets.main.output.resourcesDir])
        output.classesDirs.setFrom(
                sourceSets.main.output.classesDirs,
                project(':sable_companion_1_20').sourceSets.main.output.classesDirs
