                    + itemInvokerRefs.annotationValues)
        }
        def mappedFlywheelMinecraftMixin = SableStandaloneUserdevMapper.classMembers(
                mappedFlywheel,
                'dev/engine_room/flywheel/impl/mixin/MinecraftMixin.class')
        if (!mappedFlywheelMinecraftMixin.fields.contains('resourceManager')
                || mappedFlywheelMinecraftMixin.fields.contains('f_91036_')) {
            throw new GradleException("Standalone Flywheel is not mapped for userdev MinecraftMixin: "
                    + mappedFlywheelMinecraftMixin.fields)
        }
        def expectedStandaloneMods = [
                mappedSableJar.name,
                createDevelopmentRuntime.get().asFile.name,
                mappedFlywheel.name,
                mappedPonder.name,
                veilDevelopmentRuntime.get().asFile.name
        ] as Set
        def actualStandaloneMods = (modsDir.listFiles()?.findAll { it.isFile() }*.name ?: []) as Set
        if (actualStandaloneMods != expectedStandaloneMods) {
            throw new GradleException(
                    "Standalone mods directory has unexpected contents: ${actualStandaloneMods}; "
                            + "expected ${expectedStandaloneMods}"
