tasks.register('verifyInteractionDistanceMixinBoundary') {
    group = 'forge backport'
    description = 'Bytecode-verifies the 1.20.1 interaction-distance mixin injection targets.'

    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/interaction_distance/PlayerMixin.java'))
    inputs.file(rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/interaction_distance/ServerPlayerGameModeMixin.java'))
    inputs.file('src/main/resources/sable-common-forge.mixins.json')

    doLast {
        File forgeMappedClasses = layout.buildDirectory.dir('compileClasspath/forgeMappedClasses').get().asFile
        if (!forgeMappedClasses.isDirectory()) {
            throw new GradleException("Missing staged mapped Minecraft classes for interaction-distance verification: ${forgeMappedClasses}")
        }
        File javap = new File(System.getProperty('java.home'),
                'bin/javap' + (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? '.exe' : ''))
        if (!javap.isFile()) {
            throw new GradleException("Could not find javap executable at ${javap}")
        }

        def disassemble = { String className ->
            ByteArrayOutputStream output = new ByteArrayOutputStream()
            exec {
                executable = javap.absolutePath
                args '-classpath', forgeMappedClasses.absolutePath, '-c', '-p', className
                standardOutput = output
            }
            output.toString('UTF-8')
        }
        def section = { String text, String start, String end ->
            int begin = text.indexOf(start)
            if (begin < 0) {
                throw new GradleException("Bytecode verifier could not find method section start: ${start}")
            }
            int finish = text.indexOf(end, begin + start.length())
            if (finish < 0) {
                finish = text.length()
            }
            text.substring(begin, finish)
        }

        String playerMixinText = rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/interaction_distance/PlayerMixin.java').getText('UTF-8')
        String gameModeMixinText = rootProject.file('common/src/main/java/dev/ryanhcode/sable/mixin/interaction_distance/ServerPlayerGameModeMixin.java').getText('UTF-8')
        String mixinConfigText = file('src/main/resources/sable-common-forge.mixins.json').getText('UTF-8')
        String listenerBytecode = disassemble('net.minecraft.server.network.ServerGamePacketListenerImpl')
        String gameModeBytecode = disassemble('net.minecraft.server.level.ServerPlayerGameMode')
        String handlePlayerAction = section(listenerBytecode,
                'public void handlePlayerAction(net.minecraft.network.protocol.game.ServerboundPlayerActionPacket);',
                'private static boolean wasBlockPlacementAttempt')
        String handleUseItemOn = section(listenerBytecode,
                'public void handleUseItemOn(net.minecraft.network.protocol.game.ServerboundUseItemOnPacket);',
                'private boolean testPlayerCanReach')
        String handleInteract = section(listenerBytecode,
                'public void handleInteract(net.minecraft.network.protocol.game.ServerboundInteractPacket);',
                'public void handleClientCommand')
        String handleBlockBreakAction = section(gameModeBytecode,
                'public void handleBlockBreakAction(net.minecraft.core.BlockPos, net.minecraft.network.protocol.game.ServerboundPlayerActionPacket$Action, net.minecraft.core.Direction, int, int);',
                'public void destroyAndAck')

        if (handlePlayerAction.contains('testPlayerCanReach:(Lnet/minecraft/core/BlockPos;)Z')) {
            throw new GradleException('Forge 47.4.20 handlePlayerAction unexpectedly calls ServerGamePacketListenerImpl#testPlayerCanReach; re-audit PlayerMixin targets before changing this verifier')
        }
        [
                'ServerPlayerGameMode.handleBlockBreakAction:(Lnet/minecraft/core/BlockPos;Lnet/minecraft/network/protocol/game/ServerboundPlayerActionPacket$Action;Lnet/minecraft/core/Direction;II)V'
        ].each { canary ->
            if (!handlePlayerAction.contains(canary)) {
                throw new GradleException("ServerGamePacketListenerImpl#handlePlayerAction lost bytecode canary: ${canary}")
            }
        }
        [
                'testPlayerCanReach:(Lnet/minecraft/core/BlockPos;)Z',
                'ServerPlayer.canReach:(Lnet/minecraft/core/BlockPos;D)Z',
                'ServerPlayer.canReachRaw:(Lnet/minecraft/core/BlockPos;D)Z',
                'ForgeHooks.onLeftClickBlock',
                'debugLogging:(Lnet/minecraft/core/BlockPos;ZILjava/lang/String;)V'
        ].each { canary ->
            if (!handleBlockBreakAction.contains(canary)) {
                throw new GradleException("ServerPlayerGameMode#handleBlockBreakAction lost bytecode canary: ${canary}")
            }
        }
        [
                'testPlayerCanReach:(Lnet/minecraft/core/BlockPos;)Z',
                'ServerPlayer.canReach:(Lnet/minecraft/core/BlockPos;D)Z',
                'ServerPlayer.canReachRaw:(Lnet/minecraft/core/BlockPos;D)Z'
        ].each { canary ->
            if (!handleUseItemOn.contains(canary)) {
                throw new GradleException("ServerGamePacketListenerImpl#handleUseItemOn lost bytecode canary: ${canary}")
            }
        }
        if (!handleInteract.contains('ServerPlayer.canReachRaw:(Lnet/minecraft/world/entity/Entity;D)Z')) {
            throw new GradleException('ServerGamePacketListenerImpl#handleInteract lost entity reach bytecode canary')
        }

        [
                '@Mixin(ServerGamePacketListenerImpl.class)',
                'method = "handleUseItemOn"',
                'method = "handleInteract"',
                'SABLE_M13_EDIT action=break phase=packet'
        ].each { canary ->
            if (!playerMixinText.contains(canary)) {
                throw new GradleException("PlayerMixin lost packet-listener canary: ${canary}")
            }
        }
        if (playerMixinText.contains('sable$testPlayerCanReachBlockAction')
                || playerMixinText.contains('sable$logSubLevelBlockBreakResult')
                || playerMixinText.contains('target = "Lnet/minecraft/server/network/ServerGamePacketListenerImpl;testPlayerCanReach')
                || playerMixinText.contains('ServerPlayerGameMode;handleBlockBreakAction')) {
            throw new GradleException('PlayerMixin still contains a stale or diagnostic handlePlayerAction call-site wrapper that fails 0/1 at production startup')
        }
        if ((playerMixinText + gameModeMixinText).contains('remap = false')
                && (playerMixinText + gameModeMixinText).contains('net/minecraft/server/level/ServerPlayer')) {
            throw new GradleException('Minecraft-owned interaction-distance @At targets must remap for production; do not use remap=false on ServerPlayer/ServerPlayerGameMode targets')
        }
        [
                '@Mixin(ServerPlayerGameMode.class)',
                'method = "handleBlockBreakAction"',
                'ServerPlayerGameMode;testPlayerCanReach',
                'ServerPlayer;canReach',
                'ServerPlayer;canReachRaw',
                'original.call(gameMode, pos)',
                'original.call(player, pos, slop)'
        ].each { canary ->
            if (!gameModeMixinText.contains(canary)) {
                throw new GradleException("ServerPlayerGameModeMixin lost 1.20 break-reach canary: ${canary}")
            }
        }
        if (!mixinConfigText.contains('interaction_distance.PlayerMixin')
                || !mixinConfigText.contains('interaction_distance.ServerPlayerGameModeMixin')) {
            throw new GradleException('Forge mixin config must include both interaction-distance packet and game-mode mixins')
        }

        logger.lifecycle('verifyInteractionDistanceMixinBoundary PASS: PlayerMixin has no critical diagnostic '
                + 'handlePlayerAction call-site wrapper, Minecraft-owned interaction-distance @At targets remap '
                + 'for production, and block-break reach is wrapped at ServerPlayerGameMode#handleBlockBreakAction '
                + 'where Forge 47.4.20 actually performs it')
    }
}

