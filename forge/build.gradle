tasks.register('verifySableCommandArgumentSerializationBoundary') {
    group = 'forge backport'
    description = 'Verifies every custom Sable Brigadier argument reachable from /sable has Forge command-tree network serialization.'

    inputs.dir(rootProject.file('common/src/main/java/dev/ryanhcode/sable'))
    inputs.file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java')
    inputs.file('src/main/resources/sable-common-forge.mixins.json')

    doLast {
        File commonSourceRoot = rootProject.file('common/src/main/java/dev/ryanhcode/sable')
        File registrarSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/command/SableCommandArgumentTypes.java')
        File subLevelSource = rootProject.file('common/src/main/java/dev/ryanhcode/sable/api/command/SubLevelArgumentType.java')
        File vec3Source = rootProject.file('common/src/main/java/dev/ryanhcode/sable/command/Vec3ArgumentAbsolute.java')
        File forgeSource = file('src/main/java/dev/ryanhcode/sable/forge/SableForge.java')
        File forgeMixinConfig = file('src/main/resources/sable-common-forge.mixins.json')

        def customArgumentFiles = fileTree(commonSourceRoot) {
            include '**/*.java'
            exclude '**/mixin/**'
        }.matching {
            include '**/*.java'
        }.files.findAll {
            it.getText('UTF-8').contains('implements ArgumentType')
        }.collect {
            commonSourceRoot.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.sort()

        def expectedCustomArgumentFiles = [
                'api/command/SubLevelArgumentType.java',
                'command/Vec3ArgumentAbsolute.java'
        ]
        if (customArgumentFiles != expectedCustomArgumentFiles) {
            throw new GradleException("Unexpected custom Sable ArgumentType implementations: "
                    + "${customArgumentFiles}; expected ${expectedCustomArgumentFiles}")
        }

        String registrarText = registrarSource.getText('UTF-8')
        String subLevelText = subLevelSource.getText('UTF-8')
        String vec3Text = vec3Source.getText('UTF-8')
        String forgeText = forgeSource.getText('UTF-8')
        String forgeMixinText = forgeMixinConfig.getText('UTF-8')

        [
                'public static final ResourceLocation SUB_LEVEL_ID = new ResourceLocation(Sable.MOD_ID, "sub_level")',
                'public static final ResourceLocation VEC3_ABSOLUTE_ID = new ResourceLocation(Sable.MOD_ID, "vec3_absolute")',
                'ArgumentTypeInfos.registerByClass(SubLevelArgumentType.class, new SubLevelArgumentType.Info())',
                'ArgumentTypeInfos.registerByClass(',
                'SingletonArgumentInfo.contextFree(Vec3ArgumentAbsolute::vec3)',
                'public static class Info implements ArgumentTypeInfo<SubLevelArgumentType, SubLevelArgumentType.Info.Template>',
                'public Vec3 parse(StringReader stringReader) throws CommandSyntaxException'
        ].each { canary ->
            if (!(registrarText + subLevelText + vec3Text).contains(canary)) {
                throw new GradleException("Sable command ArgumentType serialization lost canary: ${canary}")
            }
        }

        [
                'modBus.addListener(this::registerCommandArgumentTypes)',
                'private void registerCommandArgumentTypes(final RegisterEvent event)',
                'event.register(Registries.COMMAND_ARGUMENT_TYPE, helper ->',
                'helper.register(SableCommandArgumentTypes.SUB_LEVEL_ID, subLevelInfo)',
                'helper.register(SableCommandArgumentTypes.VEC3_ABSOLUTE_ID, vec3AbsoluteInfo)'
        ].each { canary ->
            if (!forgeText.contains(canary)) {
                throw new GradleException("Forge command ArgumentType registration lost canary: ${canary}")
            }
        }

        if (forgeMixinText.contains('command.ArgumentTypeInfosMixin')) {
            throw new GradleException('Forge production mixin config still depends on ArgumentTypeInfos bootstrap injection')
        }
        if (forgeText.contains('server-console-only') || forgeText.contains('ClientboundCommandsPacket')) {
            throw new GradleException('Command argument serialization fix must not hide the /sable tree from clients')
        }

        logger.lifecycle('verifySableCommandArgumentSerializationBoundary PASS: custom /sable arguments are exactly '
                + 'SubLevelArgumentType and Vec3ArgumentAbsolute; both register ArgumentTypeInfos by class through '
                + 'the Forge COMMAND_ARGUMENT_TYPE registry before ClientboundCommandsPacket serialization')
    }
}

