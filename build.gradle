plugins {
    // Fabric/NeoForge plugin versions live in their own 1.21 modules so the
    // Forge 1.20.1 backport can run under ForgeGradle's Gradle 8.x range.
    // ForgeGradle is used only by the Minecraft 1.20.1 Forge backport module.
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    // see // https://github.com/modmuss50/mod-publish-plugin for new versions
    id "me.modmuss50.mod-publish-plugin" version "1.1.0" apply false

    id 'com.diffplug.spotless' version '7.2.1'
    id "checkstyle"
}

allprojects {
    apply plugin: 'com.diffplug.spotless'

    spotless {
        format 'misc', {
            target '*.gradle', '.gitattributes', '.gitignore'

            trimTrailingWhitespace()
            leadingTabsToSpaces()
            endWithNewline()
        }
    }
}
